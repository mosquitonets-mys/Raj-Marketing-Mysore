<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>My Orders - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cart-checkout.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="cart-container">

        <div class="cart-header">
            <h1><i class="fas fa-box"></i> My Orders</h1>
            <span class="cart-count-badge" id="ordersCount">0 orders</span>
        </div>

        <div id="ordersContent">
            <div class="loader">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading orders...</p>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/cart-engine.js"></script>

    <script>
    (function() {
        'use strict';

        const STATUS_MAP = {
            'NEW': { label: 'New Order', class: 'status-new', icon: 'fa-plus-circle' },
            'CONFIRMED': { label: 'Confirmed', class: 'status-confirmed', icon: 'fa-check-circle' },
            'PROCESSING': { label: 'Processing', class: 'status-processing', icon: 'fa-cog' },
            'READY': { label: 'Ready', class: 'status-ready', icon: 'fa-box' },
            'DELIVERED': { label: 'Delivered', class: 'status-delivered', icon: 'fa-check-double' },
            'CANCELLED': { label: 'Cancelled', class: 'status-cancelled', icon: 'fa-times-circle' }
        };

        function loadOrders() {
            const container = document.getElementById('ordersContent');
            let orders = [];
            try {
                orders = JSON.parse(localStorage.getItem('raj_orders') || '[]');
            } catch (e) {}

            document.getElementById('ordersCount').textContent = orders.length + ' order' + (orders.length !== 1 ? 's' : '');

            if (!orders.length) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-icon"><i class="fas fa-box-open"></i></div>
                        <h2>No orders yet</h2>
                        <p>Your orders will appear here once you place one.</p>
                        <a href="products.html" class="btn btn-primary">
                            <i class="fas fa-th-large"></i> Browse Products
                        </a>
                    </div>
                `;
                return;
            }

            // Sort by newest first
            orders = orders.slice().reverse();

            container.innerHTML = orders.map(order => renderOrderCard(order)).join('');
        }

        function renderOrderCard(order) {
            const status = STATUS_MAP[order.status] || STATUS_MAP['NEW'];
            const total = (order.totals && order.totals.grandTotal) || 0;
            const itemCount = (order.items && order.items.length) || 0;
            const date = new Date(order.createdAt).toLocaleDateString('en-IN', {
                day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            // Status timeline
            const steps = ['NEW', 'CONFIRMED', 'PROCESSING', 'DELIVERED'];
            const currentIdx = steps.indexOf(order.status === 'READY' ? 'PROCESSING' : order.status);

            const timelineHtml = steps.map((step, i) => {
                let cls = '';
                if (i < currentIdx) cls = 'done';
                else if (i === currentIdx) cls = 'current';
                const icons = { NEW: 'fa-check', CONFIRMED: 'fa-thumbs-up', PROCESSING: 'fa-cog', DELIVERED: 'fa-check-double' };
                return `
                    <div class="status-step ${cls}">
                        <div class="dot"><i class="fas ${icons[step]}"></i></div>
                        <div class="label">${step.charAt(0) + step.slice(1).toLowerCase()}</div>
                    </div>
                `;
            }).join('');

            return `
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <h3>#${order.orderId}</h3>
                            <div class="order-date">${date}</div>
                        </div>
                        <span class="status-badge ${status.class}">
                            <i class="fas ${status.icon}"></i> ${status.label}
                        </span>
                    </div>

                    <div class="status-timeline">${timelineHtml}</div>

                    <div class="order-body">
                        <div class="order-stat">
                            <span class="stat-label">Items</span>
                            <span class="stat-value">${itemCount}</span>
                        </div>
                        <div class="order-stat">
                            <span class="stat-label">Total</span>
                            <span class="stat-value" style="color:var(--royal-blue);">${CartEngine.formatCurrency(total)}</span>
                        </div>
                        <div class="order-stat">
                            <span class="stat-label">Payment</span>
                            <span class="stat-value" style="font-size:11px;">${order.paymentMethod || '—'}</span>
                        </div>
                    </div>

                    <div class="order-actions">
                        <a href="order-details.html?id=${order.orderId}" class="btn btn-primary">
                            <i class="fas fa-eye"></i> View Details
                        </a>
                        <a href="https://wa.me/919483037385?text=Hi,%20about%20order%20${order.orderId}" target="_blank" class="btn btn-whatsapp" style="background:#25D366;color:#fff;">
                            <i class="fab fa-whatsapp"></i> Support
                        </a>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    })();
    </script>
</body>
</html>
