<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Customer Login - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .auth-container { max-width: 480px; margin: 0 auto; padding: 20px 16px 100px; }
        .auth-card {
            background: #fff;
            border-radius: 20px;
            padding: 32px 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
        }
        .auth-header { text-align: center; margin-bottom: 28px; }
        .auth-header .icon-wrap {
            width: 72px; height: 72px;
            background: linear-gradient(145deg, #1a56db, #0f1b33);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(26,86,219,0.25);
        }
        .auth-header h1 {
            font-size: 24px; font-weight: 900;
            color: #1f2937; letter-spacing: -0.5px; margin-bottom: 6px;
        }
        .auth-header p { font-size: 13px; color: #6b7280; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 700;
            color: #1f2937; margin-bottom: 6px;
        }
        .form-group label .required { color: #dc2626; }
        .form-group input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #e2e8f0; border-radius: 12px;
            font-size: 14px; font-family: 'Poppins', sans-serif;
            outline: none; color: #1f2937;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #1a56db;
            box-shadow: 0 0 0 4px rgba(26,86,219,0.08);
        }
        .form-hint { font-size: 11px; color: #6b7280; margin-top: 4px; }
        .btn {
            padding: 12px 20px; border-radius: 40px;
            font-weight: 700; font-size: 13px;
            border: none; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; font-family: 'Poppins', sans-serif;
            text-decoration: none; transition: all 0.25s ease;
            box-sizing: border-box;
        }
        .btn-primary {
            background: linear-gradient(145deg, #1a56db, #0f1b33);
            color: #fff;
            box-shadow: 0 4px 14px rgba(26,86,219,0.3);
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary {
            background: #fff; color: #374151;
            border: 1.5px solid #e2e8f0;
        }
        .btn-secondary:hover { border-color: #1a56db; color: #1a56db; }
        .btn-block { width: 100%; }
        .btn-lg { padding: 14px 28px; font-size: 14px; }
        .divider { text-align: center; margin: 16px 0; color: #6b7280; font-size: 12px; position: relative; }
        .divider hr { border: none; border-top: 1px solid #e2e8f0; margin: 0; }
        .divider span {
            background: #fff; padding: 0 12px;
            position: relative; top: -9px; font-weight: 600;
        }
        .footer-note {
            text-align: center; margin-top: 20px;
            font-size: 12px; color: #6b7280;
        }
        .footer-note a { color: #1a56db; text-decoration: none; font-weight: 700; }
        .rm-toast {
            position: fixed; top: 24px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 14px 24px; border-radius: 12px;
            color: #fff; font-weight: 600; font-size: 14px;
            z-index: 9999; transition: transform 0.3s ease;
            max-width: 90vw; text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .rm-toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="icon-wrap"><i class="fas fa-user-shield"></i></div>
                <h1>Customer Login</h1>
                <p>Sign in to access your dashboard</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" id="loginEmail" required
                           inputmode="email" placeholder="Enter your email"
                           autocomplete="email" />
                </div>

                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" id="loginPassword" required
                           placeholder="Enter password" minlength="6"
                           autocomplete="current-password" />
                    <div class="form-hint" style="text-align:right;">
                        <a href="#" onclick="forgotPassword(event)"
                           style="color:#1a56db;text-decoration:none;font-weight:700;">
                            Forgot password?
                        </a>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div class="divider"><hr><span>OR</span></div>

                <a href="customer-registration.html" class="btn btn-secondary btn-block btn-lg">
                    <i class="fas fa-user-plus"></i> Create New Account
                </a>
            </form>
        </div>

        <div class="footer-note">
            <p>By continuing, you agree to our</p>
            <p>
                <a href="../terms.html">Terms</a> ·
                <a href="../privacy.html">Privacy Policy</a>
            </p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

<script type="module">
import { CustomerAuth } from '../js/firebase-auth.js';
import { auth } from '../firebase-config.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

const form = document.getElementById('loginForm');
form.style.opacity = '0.5';
form.style.pointerEvents = 'none';

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        form.style.opacity = '1';
        form.style.pointerEvents = 'auto';
        return;
    }
    try {
        const profile = await CustomerAuth.getCurrentProfile(user); // pass user
        if (profile) {
            window.location.replace('customer-dashboard.html');
            return;
        }
        // Auth user exists but no customer profile → wrong role / orphan
        await signOut(auth);
        showToast('No customer profile found. Please register.', 'warning');
    } catch (err) {
        console.error('Profile check failed:', err);
        showToast('Could not verify your account.', 'error');
    } finally {
        form.style.opacity = '1';
        form.style.pointerEvents = 'auto';
    }
});

window.handleLogin = async function (e) {
    e.preventDefault();

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('submitBtn');

    if (!email || !password) {
        showToast('Please enter email and password', 'error');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    try {
        const result = await CustomerAuth.login(email, password);
        if (!result.success) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            showToast('❌ ' + result.error, 'error');
            document.getElementById('loginPassword').value = '';
            return;
        }
        showToast('✅ Login successful!', 'success');
    } catch (err) {
        console.error('Login failed:', err);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        showToast('Network error. Please try again.', 'error');
    }
};

window.forgotPassword = async function (e) {
    e.preventDefault();
    const input = prompt('Enter your registered email:');
    const email = (input || '').trim();
    if (!email) { showToast('Email is required.', 'warning'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast('Please enter a valid email address.', 'error');
        return;
    }
    try {
        const result = await CustomerAuth.resetPassword(email);
        showToast(
            result.success ? '📧 Password reset email sent!' : '❌ ' + result.error,
            result.success ? 'success' : 'error'
        );
    } catch (err) {
        console.error('Reset failed:', err);
        showToast('Could not send reset email. Try again.', 'error');
    }
};

function showToast(msg, type = 'info') {
    document.querySelectorAll('.rm-toast').forEach(t => t.remove());
    const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#1a56db' };
    const t = document.createElement('div');
    t.className = 'rm-toast';
    t.textContent = msg;
    t.style.background = colors[type] || colors.info;
    document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
}
</script>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
</body>
</html>
