<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Bills & Invoices - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-file-invoice-dollar"></i> Bills & Invoices</h1>
        </div>

        <div id="billList">
            <div class="loader">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading bills...</p>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        function load() {
            const container = document.getElementById('billList');
            try {
                const data = JSON.parse(localStorage.getItem('raj_estimator_data') || '{}');
                const orders = data.orders || [];

                if (!orders.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-file-invoice"></i>
                            <h3>No bills available</h3>
                            <p>Your invoices will appear here once you place an order</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.slice().reverse().map(order => {
                    const total = parseFloat(order.totalAmount || 0);
                    const advance = parseFloat(order.advanceAmount || 0);
                    const balance = total - advance;

                    return `
                        <div class="card">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:12px;flex-wrap:wrap;">
                                <div>
                                    <div style="font-weight:900;color:var(--highlight-grey);font-size:15px;">
                                        Invoice #${order.orderId || order.id}
                                    </div>
                                    <div style="font-size:11px;color:var(--muted-text);font-weight:600;">
                                        ${formatDate(order.createdAt)}
                                    </div>
                                </div>
                                <span class="status-badge status-${(order.paymentStatus || 'pending').toLowerCase()}">
                                    ${order.paymentStatus || 'Pending'}
                                </span>
                            </div>

                            <div class="detail-row">
                                <span class="label"><i class="fas fa-box"></i> Product</span>
                                <span class="value">${order.product || '—'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="label"><i class="fas fa-rupee-sign"></i> Total</span>
                                <span class="value emphasis">₹${Math.round(total).toLocaleString('en-IN')}</span>
                            </div>
                            <div class="detail-row">
                                <span class="label"><i class="fas fa-check-circle"></i> Advance Paid</span>
                                <span class="value green">₹${Math.round(advance).toLocaleString('en-IN')}</span>
                            </div>
                            <div class="detail-row">
                                <span class="label"><i class="fas fa-hourglass-half"></i> Balance Due</span>
                                <span class="value">₹${Math.round(balance).toLocaleString('en-IN')}</span>
                            </div>

                            <div class="btn-group" style="margin-top:12px;">
                                <button class="btn btn-primary btn-sm" onclick="downloadBill('${order.orderId || order.id}')">
                                    <i class="fas fa-download"></i> Download
                                </button>
                                <button class="btn btn-secondary btn-sm" onclick="window.print()">
                                    <i class="fas fa-print"></i> Print
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Error loading</h3></div>`;
            }
        }

        window.downloadBill = function(orderId) {
            showToast('Bill download coming soon', 'info');
        };

        function formatDate(d) {
            if (!d) return '—';
            try {
                return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch { return '—'; }
        }

        function showToast(msg, type = 'info') {
            document.querySelectorAll('.rm-toast').forEach(t => t.remove());
            const colors = { success: '#10b981', error: '#ef4444', info: '#1a56db' };
            const t = document.createElement('div');
            t.className = 'rm-toast';
            t.textContent = msg;
            t.style.background = colors[type] || colors.info;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
</html>
