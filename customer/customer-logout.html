<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Logout - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="auth-container">
        <div class="auth-card" style="text-align:center;">
            <div class="auth-header">
                <div class="icon-wrap" style="background:linear-gradient(145deg,#f59e0b,#d97706);">
                    <i class="fas fa-sign-out-alt"></i>
                </div>
                <h1>Logging Out...</h1>
                <p id="logoutMsg">Please wait while we sign you out</p>
            </div>

            <div style="margin:24px 0;">
                <i class="fas fa-spinner fa-spin" style="font-size:36px;color:var(--royal-blue);"></i>
            </div>

            <a href="customer-login.html" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-sign-in-alt"></i> Sign In Again
            </a>

            <a href="../index.html" class="btn btn-secondary btn-block" style="margin-top:10px;">
                <i class="fas fa-home"></i> Go to Homepage
            </a>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        // Clear session
        try {
            localStorage.removeItem('raj_customer');
        } catch (e) {}

        // Update message
        setTimeout(() => {
            document.getElementById('logoutMsg').textContent = 'You have been logged out successfully';
        }, 800);

        // Auto redirect to login after 2.5s
        setTimeout(() => {
            window.location.href = 'customer-login.html';
        }, 2500);
    })();
    </script>
</body>
</html>
