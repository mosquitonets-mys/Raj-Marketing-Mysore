<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Products - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 12px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--highlight-grey);
            transition: var(--transition);
            display: block;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--royal-blue);
            box-shadow: var(--shadow-md);
        }
        .product-card .img-wrap {
            width: 100%;
            aspect-ratio: 1.2 / 1;
            border-radius: var(--radius);
            background: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 10px;
            font-size: 40px;
            color: var(--royal-blue);
        }
        .product-card .name {
            font-weight: 800;
            font-size: 13px;
            color: var(--highlight-grey);
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .product-card .variant { font-size: 11px; color: var(--muted-text); margin-bottom: 6px; }
        .product-card .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-light);
            padding-top: 8px;
        }
        .product-card .price { font-size: 16px; font-weight: 900; color: var(--royal-blue); }
        .product-card .unit { font-size: 10px; color: var(--muted-text); }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-th-large"></i> Products</h1>
            <span class="est-badge" style="background:var(--light-blue);color:var(--royal-blue);font-size:12px;font-weight:800;padding:6px 14px;border-radius:30px;" id="productCount">0</span>
        </div>

        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search products..." oninput="filterProducts()" />
        </div>

        <div class="tabs-nav" id="categoryTabs">
            <button class="tab-btn active" data-cat="all" onclick="setCategory('all')">All</button>
            <button class="tab-btn" data-cat="Velcro" onclick="setCategory('Velcro')">Velcro</button>
            <button class="tab-btn" data-cat="Aluminium" onclick="setCategory('Aluminium')">Aluminium</button>
            <button class="tab-btn" data-cat="Pleated" onclick="setCategory('Pleated')">Pleated</button>
            <button class="tab-btn" data-cat="Sliding" onclick="setCategory('Sliding')">Sliding</button>
            <button class="tab-btn" data-cat="Security" onclick="setCategory('Security')">Security</button>
            <button class="tab-btn" data-cat="Mesh" onclick="setCategory('Mesh')">Mesh</button>
        </div>

        <div class="product-grid" id="productGrid">
            <div class="loader" style="grid-column:1/-1;">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading products...</p>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        const PRODUCTS = [
            { id: 'velcro-economic', name: 'Velcro System – Economic', category: 'Velcro', variant: 'Economic', price: 65, icon: 'fa-link' },
            { id: 'velcro-premium', name: 'Velcro System – Premium', category: 'Velcro', variant: 'Saint-Gobain', price: 80, icon: 'fa-link' },
            { id: 'aluminium-black-ss', name: 'Aluminium Frame – Black SS', category: 'Aluminium', variant: 'Regular + Black SS', price: 200, icon: 'fa-border-all' },
            { id: 'aluminium-bright-ss', name: 'Aluminium Frame – Bright SS 304', category: 'Aluminium', variant: 'Regular + Bright SS', price: 220, icon: 'fa-border-all' },
            { id: 'aluminium-teakwood', name: 'Premium Teakwood Frame', category: 'Aluminium', variant: 'Teakwood + Black SS', price: 300, icon: 'fa-tree' },
            { id: 'pleated-gold', name: 'Pleated Mesh – Gold', category: 'Pleated', variant: '32mm Single', price: 380, icon: 'fa-wind' },
            { id: 'pleated-platinum', name: 'Pleated SS – Platinum', category: 'Pleated', variant: '25mm Single', price: 500, icon: 'fa-wind' },
            { id: 'pleated-diamond', name: 'Pleated SS – Diamond', category: 'Pleated', variant: '32mm Single', price: 560, icon: 'fa-wind' },
            { id: 'honeycomb-gold', name: 'Honeycomb Gold Pleated', category: 'Pleated', variant: '32mm Single', price: 520, icon: 'fa-th' },
            { id: 'single-sliding', name: 'Single Sliding Economic', category: 'Sliding', variant: 'Single', price: 400, icon: 'fa-arrows-alt-h' },
            { id: 'double-sliding', name: 'Double Sliding Economic', category: 'Sliding', variant: 'Double', price: 450, icon: 'fa-arrows-alt-h' },
            { id: 'security-single', name: 'Security Screen – Single', category: 'Security', variant: 'Single Door', price: 990, icon: 'fa-shield-alt' },
            { id: 'security-double', name: 'Security Screen – Double', category: 'Security', variant: 'Double Door', price: 1150, icon: 'fa-shield-alt' },
            { id: 'mesh-black-018', name: 'SS Black Mesh 0.18mm', category: 'Mesh', variant: 'Black', price: 36, icon: 'fa-circle' },
            { id: 'mesh-black', name: 'SS Black Mesh', category: 'Mesh', variant: 'Standard', price: 38, icon: 'fa-circle' },
            { id: 'mesh-3ft', name: 'SS Black Mesh 3 ft', category: 'Mesh', variant: '3 ft', price: 42, icon: 'fa-circle' },
            { id: 'mesh-bright-4ft', name: 'SS Bright Mesh 4 ft', category: 'Mesh', variant: '0.24mm', price: 48, icon: 'fa-circle' },
            { id: 'fiber-mesh', name: 'Fiber / Touflex Mesh', category: 'Mesh', variant: 'Fiber', price: 8, icon: 'fa-circle-notch' }
        ];

        let allProducts = PRODUCTS;
        let currentCategory = 'all';

        function render(list) {
            const grid = document.getElementById('productGrid');
            document.getElementById('productCount').textContent = list.length + ' items';

            if (!list.length) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <i class="fas fa-box-open"></i>
                        <h3>No products found</h3>
                        <p>Try a different search or category</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map(p => `
                <a href="../product-detail.html?id=${p.id}" class="product-card">
                    <div class="img-wrap"><i class="fas ${p.icon}"></i></div>
                    <div class="name">${p.name}</div>
                    <div class="variant">${p.variant}</div>
                    <div class="price-row">
                        <div>
                            <div class="price">₹${p.price}</div>
                            <div class="unit">per sq.ft</div>
                        </div>
                        <i class="fas fa-chevron-right" style="color:var(--royal-blue);font-size:14px;"></i>
                    </div>
                </a>
            `).join('');
        }

        window.filterProducts = function() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            let list = allProducts;
            if (currentCategory !== 'all') list = list.filter(p => p.category === currentCategory);
            if (q) list = list.filter(p =>
                p.name.toLowerCase().includes(q) ||
                p.variant.toLowerCase().includes(q) ||
                p.category.toLowerCase().includes(q)
            );
            render(list);
        };

        window.setCategory = function(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
            filterProducts();
        };

        document.addEventListener('DOMContentLoaded', () => render(allProducts));
    })();
    </script>
</body>
    </html>
