<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>My Measurements - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .measure-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 8px;
        }
        .measure-table th {
            background: var(--light-blue);
            color: var(--royal-blue);
            padding: 10px 8px;
            text-align: left;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
        }
        .measure-table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-light);
            color: var(--highlight-grey);
            font-weight: 600;
        }
        .measure-table tr:hover td { background: var(--bg-light); }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-ruler-combined"></i> Measurements</h1>
            <a href="../appointment.html" class="btn btn-primary btn-sm">
                <i class="fas fa-plus"></i> New Measurement
            </a>
        </div>

        <div class="card">
            <div class="card-title">
                <i class="fas fa-clipboard-list"></i> Saved Measurements
                <span class="badge" id="measureCount">0</span>
            </div>
            <div id="measureContent">
                <div class="loader">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading measurements...</p>
                </div>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        function load() {
            const container = document.getElementById('measureContent');
            try {
                const data = JSON.parse(localStorage.getItem('raj_estimator_data') || '{}');
                const estimates = data.estimates || [];

                const allMeasurements = [];
                estimates.forEach(est => {
                    if (est.measurements && est.measurements.length) {
                        est.measurements.forEach(m => {
                            allMeasurements.push({
                                ...m,
                                estimateNo: est.estNo,
                                product: est.productName || est.category,
                                date: est.date
                            });
                        });
                    }
                });

                document.getElementById('measureCount').textContent = allMeasurements.length;

                if (!allMeasurements.length) {
                    container.innerHTML = `
                        <div class="empty-state" style="border:none;padding:30px 10px;">
                            <i class="fas fa-ruler-combined"></i>
                            <h3>No measurements yet</h3>
                            <p>Book a site visit to get measurements</p>
                            <a href="../appointment.html" class="btn btn-primary btn-sm">
                                <i class="fas fa-calendar-plus"></i> Book Visit
                            </a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div style="overflow-x:auto;">
                        <table class="measure-table">
                            <thead>
                                <tr>
                                    <th>Location</th>
                                    <th>W (in)</th>
                                    <th>H (in)</th>
                                    <th>Qty</th>
                                    <th>Sq.ft</th>
                                    <th>Estimate</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${allMeasurements.map(m => `
                                    <tr>
                                        <td>${m.location || '-'}</td>
                                        <td>${m.width || 0}</td>
                                        <td>${m.height || 0}</td>
                                        <td>${m.qty || 1}</td>
                                        <td>${(m.sqft || 0).toFixed(2)}</td>
                                        <td style="color:var(--royal-blue);font-size:11px;">${m.estimateNo || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state" style="border:none;"><i class="fas fa-exclamation-circle"></i><h3>Error</h3><p>Try again later</p></div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
</html>
