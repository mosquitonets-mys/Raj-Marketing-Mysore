<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Payments - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-credit-card"></i> Payments</h1>
        </div>

        <!-- Payment Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon" style="background:#d1fae5;color:#059669;"><i class="fas fa-check-circle"></i></div>
                <div class="number" id="statPaid">₹0</div>
                <div class="label">Total Paid</div>
            </div>
            <div class="stat-card">
                <div class="icon" style="background:#fef3c7;color:#d97706;"><i class="fas fa-hourglass-half"></i></div>
                <div class="number" id="statPending">₹0</div>
                <div class="label">Pending</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <i class="fas fa-history"></i> Payment History
                <span class="badge" id="paymentCount">0</span>
            </div>
            <div id="paymentList">
                <div class="loader">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading payments...</p>
                </div>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        function load() {
            const container = document.getElementById('paymentList');
            try {
                const data = JSON.parse(localStorage.getItem('raj_estimator_data') || '{}');
                const orders = data.orders || [];

                let totalPaid = 0;
                let totalPending = 0;
                const payments = [];

                orders.forEach(order => {
                    const advance = parseFloat(order.advanceAmount || 0);
                    const total = parseFloat(order.totalAmount || 0);
                    const balance = total - advance;

                    if (advance > 0) {
                        payments.push({
                            date: order.createdAt,
                            amount: advance,
                            type: 'Advance',
                            orderId: order.orderId || order.id,
                            status: 'Paid'
                        });
                        totalPaid += advance;
                    }

                    if (balance > 0 && order.paymentStatus !== 'COMPLETED') {
                        totalPending += balance;
                    }
                });

                document.getElementById('statPaid').textContent = '₹' + Math.round(totalPaid).toLocaleString('en-IN');
                document.getElementById('statPending').textContent = '₹' + Math.round(totalPending).toLocaleString('en-IN');
                document.getElementById('paymentCount').textContent = payments.length;

                if (!payments.length) {
                    container.innerHTML = `
                        <div class="empty-state" style="border:none;padding:30px 10px;">
                            <i class="fas fa-receipt"></i>
                            <h3>No payments yet</h3>
                            <p>Your payment history will appear here</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = payments.map(p => `
                    <div class="list-item">
                        <div class="icon" style="background:#d1fae5;color:#059669;">
                            <i class="fas fa-check"></i>
                        </div>
                        <div class="info">
                            <div class="title">${p.type} Payment</div>
                            <div class="subtitle">Order #${p.orderId} · ${formatDate(p.date)}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:900;color:#059669;font-size:15px;">₹${Math.round(p.amount).toLocaleString('en-IN')}</div>
                            <span class="status-badge status-paid">Paid</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div class="empty-state" style="border:none;"><i class="fas fa-exclamation-circle"></i><h3>Error loading</h3></div>`;
            }
        }

        function formatDate(d) {
            if (!d) return '—';
            try {
                return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch { return '—'; }
        }

        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
</html>
