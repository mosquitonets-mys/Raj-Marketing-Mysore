<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>My Orders - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-shopping-bag"></i> My Orders</h1>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" data-status="all" onclick="setTab('all')">All</button>
            <button class="tab-btn" data-status="NEW" onclick="setTab('NEW')">New</button>
            <button class="tab-btn" data-status="In Progress" onclick="setTab('In Progress')">In Progress</button>
            <button class="tab-btn" data-status="Completed" onclick="setTab('Completed')">Completed</button>
        </div>

        <div id="orderList">
            <div class="loader">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading orders...</p>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        let allOrders = [];
        let currentTab = 'all';

        function load() {
            try {
                const data = JSON.parse(localStorage.getItem('raj_estimator_data') || '{}');
                allOrders = (data.orders || []).slice().reverse();
                render();
            } catch (e) { render(); }
        }

        window.setTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.status === tab));
            render();
        };

        window.render = function() {
            const container = document.getElementById('orderList');
            let list = allOrders;
            if (currentTab !== 'all') {
                list = list.filter(o => (o.orderStatus || 'NEW') === currentTab);
            }

            if (!list.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-shopping-bag"></i>
                        <h3>No orders found</h3>
                        <p>Your orders will appear here</p>
                        <a href="../products.html" class="btn btn-primary">
                            <i class="fas fa-th-large"></i> Browse Products
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(order => {
                const total = parseFloat(order.totalAmount || 0);
                const advance = parseFloat(order.advanceAmount || 0);
                const status = (order.orderStatus || 'NEW').toLowerCase().replace(/\s+/g, '-');

                return `
                    <div class="card">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px;">
                            <div>
                                <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                                    <i class="fas fa-box" style="color:var(--royal-blue);font-size:18px;"></i>
                                    <h3 style="font-size:15px;font-weight:800;color:var(--highlight-grey);">
                                        ${order.product || 'Mosquito Net'}
                                    </h3>
                                </div>
                                <div style="font-size:11px;color:var(--muted-text);font-weight:600;">
                                    Order #${order.orderId || order.id}
                                </div>
                            </div>
                            <span class="status-badge status-${status}">${order.orderStatus || 'NEW'}</span>
                        </div>

                        <div class="detail-row">
                            <span class="label"><i class="fas fa-ruler-combined"></i> Area</span>
                            <span class="value">${(order.totalSqft || 0).toFixed(2)} sq.ft</span>
                        </div>
                        <div class="detail-row">
                            <span class="label"><i class="fas fa-rupee-sign"></i> Total</span>
                            <span class="value emphasis">₹${Math.round(total).toLocaleString('en-IN')}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label"><i class="fas fa-check-circle"></i> Advance</span>
                            <span class="value green">₹${Math.round(advance).toLocaleString('en-IN')}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label"><i class="fas fa-hourglass-half"></i> Balance</span>
                            <span class="value">₹${Math.round(total - advance).toLocaleString('en-IN')}</span>
                        </div>

                        <div class="btn-group" style="margin-top:12px;">
                            <a href="../track-order.html?id=${order.orderId || order.id}" class="btn btn-primary btn-sm">
                                <i class="fas fa-truck"></i> Track
                            </a>
                            <a href="customer-bills.html?id=${order.orderId || order.id}" class="btn btn-secondary btn-sm">
                                <i class="fas fa-receipt"></i> Bill
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        };

        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
</html>
