<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>My Estimates - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-file-invoice"></i> My Estimates</h1>
            <a href="../estimate.html" class="btn btn-primary btn-sm">
                <i class="fas fa-plus"></i> New Estimate
            </a>
        </div>

        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search by estimate no, customer..." oninput="render()" />
        </div>

        <div id="estimateList">
            <div class="loader">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading estimates...</p>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        let allEstimates = [];

        function load() {
            try {
                const data = JSON.parse(localStorage.getItem('raj_estimator_data') || '{}');
                allEstimates = (data.estimates || []).slice().reverse();
                render();
            } catch (e) {
                document.getElementById('estimateList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Error loading</h3>
                    </div>
                `;
            }
        }

        window.render = function() {
            const container = document.getElementById('estimateList');
            const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            let list = allEstimates;
            if (q) list = list.filter(e =>
                (e.estNo || '').toLowerCase().includes(q) ||
                (e.customerName || '').toLowerCase().includes(q) ||
                (e.productName || '').toLowerCase().includes(q) ||
                (e.category || '').toLowerCase().includes(q)
            );

            if (!list.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-file-invoice"></i>
                        <h3>No estimates found</h3>
                        <p>Create your first estimate</p>
                        <a href="../estimate.html" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Get Estimate
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(est => {
                const total = parseFloat(est.finalAmount || 0);
                const status = (est.status || 'Draft').toLowerCase();
                return `
                    <div class="card">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
                            <div style="flex:1;min-width:200px;">
                                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                                    <i class="fas fa-file-invoice" style="color:var(--royal-blue);font-size:18px;"></i>
                                    <h3 style="font-size:15px;font-weight:800;color:var(--highlight-grey);">
                                        ${est.productName || est.category || 'Estimate'}
                                    </h3>
                                </div>
                                <div class="detail-row">
                                    <span class="label"><i class="fas fa-hashtag"></i> Estimate No</span>
                                    <span class="value">${est.estNo || est.id || '—'}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="label"><i class="fas fa-calendar"></i> Date</span>
                                    <span class="value">${est.date || '—'}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="label"><i class="fas fa-ruler-combined"></i> Area</span>
                                    <span class="value">${(est.totalSqft || 0).toFixed(2)} sq.ft</span>
                                </div>
                                <div class="detail-row">
                                    <span class="label"><i class="fas fa-rupee-sign"></i> Total</span>
                                    <span class="value emphasis">₹${Math.round(total).toLocaleString('en-IN')}</span>
                                </div>
                            </div>
                            <span class="status-badge status-${status}">
                                ${est.status || 'Draft'}
                            </span>
                        </div>
                        <div class="btn-group" style="margin-top:12px;">
                            <a href="../estimate-details.html?id=${est.id}" class="btn btn-primary btn-sm">
                                <i class="fas fa-eye"></i> View
                            </a>
                            <a href="../estimate.html?id=${est.id}" class="btn btn-secondary btn-sm">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <button class="btn btn-secondary btn-sm" onclick="deleteEstimate('${est.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.deleteEstimate = function(id) {
            if (!confirm('Delete this estimate?')) return;
            try {
                const data = JSON.parse(localStorage.getItem('raj_estimator_data') || '{}');
                data.estimates = (data.estimates || []).filter(e => e.id !== id);
                localStorage.setItem('raj_estimator_data', JSON.stringify(data));
                showToast('Estimate deleted', 'warning');
                load();
            } catch (e) {}
        };

        function showToast(msg, type = 'info') {
            document.querySelectorAll('.rm-toast').forEach(t => t.remove());
            const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#1a56db' };
            const t = document.createElement('div');
            t.className = 'rm-toast';
            t.textContent = msg;
            t.style.background = colors[type] || colors.info;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
    </html>
