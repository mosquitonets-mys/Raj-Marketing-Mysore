<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>My Appointments - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-calendar-check"></i> Appointments</h1>
            <a href="../appointment.html" class="btn btn-primary btn-sm">
                <i class="fas fa-plus"></i> Book New
            </a>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="upcoming" onclick="switchTab('upcoming')">Upcoming</button>
            <button class="tab-btn" data-tab="past" onclick="switchTab('past')">Past</button>
            <button class="tab-btn" data-tab="cancelled" onclick="switchTab('cancelled')">Cancelled</button>
        </div>

        <div id="appointmentsList">
            <div class="loader">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading appointments...</p>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        let currentTab = 'upcoming';

        function loadAppointments() {
            const container = document.getElementById('appointmentsList');

            try {
                const data = JSON.parse(localStorage.getItem('raj_estimator_data') || '{}');
                const estimates = data.estimates || [];
                const appointments = estimates.filter(e => e.siteVisit === 'Yes' || e.appointmentDate);

                const now = new Date();
                let filtered = [];

                if (currentTab === 'upcoming') {
                    filtered = appointments.filter(a => {
                        const d = a.appointmentDate ? new Date(a.appointmentDate) : null;
                        return !d || d >= now;
                    });
                } else if (currentTab === 'past') {
                    filtered = appointments.filter(a => {
                        const d = a.appointmentDate ? new Date(a.appointmentDate) : null;
                        return d && d < now;
                    });
                } else {
                    filtered = appointments.filter(a => a.status === 'Cancelled');
                }

                if (!filtered.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-calendar-times"></i>
                            <h3>No ${currentTab} appointments</h3>
                            <p>Book a site visit to get started</p>
                            <a href="../appointment.html" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Book Appointment
                            </a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = filtered.map(apt => `
                    <div class="card">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
                            <div style="flex:1;min-width:200px;">
                                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                                    <i class="fas fa-calendar-alt" style="color:var(--royal-blue);font-size:18px;"></i>
                                    <h3 style="font-size:15px;font-weight:800;color:var(--highlight-grey);">
                                        ${apt.productName || apt.category || 'Site Visit'}
                                    </h3>
                                </div>
                                <div class="detail-row">
                                    <span class="label"><i class="fas fa-calendar"></i> Date</span>
                                    <span class="value">${apt.appointmentDate || apt.date || '—'}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="label"><i class="fas fa-clock"></i> Time</span>
                                    <span class="value">${apt.appointmentTime || 'Morning'}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="label"><i class="fas fa-map-marker-alt"></i> Address</span>
                                    <span class="value">${apt.customerAddress || '—'}</span>
                                </div>
                            </div>
                            <span class="status-badge status-${(apt.status || 'confirmed').toLowerCase()}">
                                ${apt.status || 'Confirmed'}
                            </span>
                        </div>
                        <div class="btn-group" style="margin-top:12px;">
                            <a href="tel:9483037385" class="btn btn-secondary btn-sm">
                                <i class="fas fa-phone"></i> Call
                            </a>
                            <a href="https://wa.me/919483037385" target="_blank" class="btn btn-whatsapp btn-sm">
                                <i class="fab fa-whatsapp"></i> WhatsApp
                            </a>
                            <button class="btn btn-secondary btn-sm" onclick="cancelAppointment('${apt.id}')">
                                <i class="fas fa-times"></i> Cancel
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Unable to load</h3>
                        <p>Please try again later</p>
                    </div>
                `;
            }
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            loadAppointments();
        };

        window.cancelAppointment = function(id) {
            if (!confirm('Cancel this appointment?')) return;
            try {
                const data = JSON.parse(localStorage.getItem('raj_estimator_data') || '{}');
                const estimates = data.estimates || [];
                const idx = estimates.findIndex(e => e.id === id);
                if (idx >= 0) {
                    estimates[idx].status = 'Cancelled';
                    data.estimates = estimates;
                    localStorage.setItem('raj_estimator_data', JSON.stringify(data));
                    showToast('Appointment cancelled', 'warning');
                    loadAppointments();
                }
            } catch (e) {}
        };

        function showToast(msg, type = 'info') {
            document.querySelectorAll('.rm-toast').forEach(t => t.remove());
            const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#1a56db' };
            const t = document.createElement('div');
            t.className = 'rm-toast';
            t.textContent = msg;
            t.style.background = colors[type] || colors.info;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', loadAppointments);
    })();
    </script>
</body>
    </html>
