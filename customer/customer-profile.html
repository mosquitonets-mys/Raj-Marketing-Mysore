<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>My Profile - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-user-circle"></i> My Profile</h1>
            <div class="actions">
                <a href="customer-dashboard.html" class="btn btn-secondary btn-sm">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
        </div>

        <!-- Avatar Card -->
        <div class="hero-card" style="text-align:center;">
            <div style="position:relative;z-index:1;">
                <div style="width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:40px;color:#fff;border:3px solid rgba(255,255,255,0.4);">
                    <i class="fas fa-user"></i>
                </div>
                <h2 id="profileName">—</h2>
                <p id="profileEmail">—</p>
            </div>
        </div>

        <!-- Profile Form -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-id-card"></i> Personal Information
            </div>

            <form id="profileForm" onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="pName" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="pEmail" required />
                    </div>
                    <div class="form-group">
                        <label>Mobile <span class="required">*</span></label>
                        <input type="tel" id="pMobile" required maxlength="10" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input type="tel" id="pWhatsapp" maxlength="10" placeholder="If different" />
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="pCity" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea id="pAddress" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" id="pPincode" maxlength="6" placeholder="570001" />
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </form>
        </div>

        <!-- Account Actions -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-cog"></i> Account Actions
            </div>

            <a href="customer-payments.html" class="list-item">
                <div class="icon"><i class="fas fa-credit-card"></i></div>
                <div class="info">
                    <div class="title">Payment Methods</div>
                    <div class="subtitle">Manage your payment options</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <a href="customer-offers.html" class="list-item">
                <div class="icon"><i class="fas fa-gift"></i></div>
                <div class="info">
                    <div class="title">My Offers</div>
                    <div class="subtitle">View available offers</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <a href="customer-support.html" class="list-item">
                <div class="icon"><i class="fas fa-headset"></i></div>
                <div class="info">
                    <div class="title">Help & Support</div>
                    <div class="subtitle">Get help from our team</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <button class="list-item" onclick="logout()" style="width:100%;border:none;cursor:pointer;text-align:left;font-family:inherit;">
                <div class="icon" style="background:#fee2e2;color:#dc2626;"><i class="fas fa-sign-out-alt"></i></div>
                <div class="info">
                    <div class="title" style="color:#dc2626;">Logout</div>
                    <div class="subtitle">Sign out of your account</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </button>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        function init() {
            loadProfile();
        }

        function loadProfile() {
            try {
                const user = JSON.parse(localStorage.getItem('raj_customer') || '{}');
                if (!user.id) {
                    window.location.href = 'customer-login.html';
                    return;
                }

                const users = JSON.parse(localStorage.getItem('raj_customers') || '[]');
                const fullUser = users.find(u => u.id === user.id) || user;

                document.getElementById('profileName').textContent = fullUser.name || 'Customer';
                document.getElementById('profileEmail').textContent = fullUser.email || '';

                document.getElementById('pName').value = fullUser.name || '';
                document.getElementById('pEmail').value = fullUser.email || '';
                document.getElementById('pMobile').value = fullUser.mobile || '';
                document.getElementById('pWhatsapp').value = fullUser.whatsapp || '';
                document.getElementById('pCity').value = fullUser.city || 'Mysore';
                document.getElementById('pAddress').value = fullUser.address || '';
                document.getElementById('pPincode').value = fullUser.pincode || '';
            } catch (e) {
                console.error(e);
            }
        }

        window.saveProfile = function(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value.trim();
            const email = document.getElementById('pEmail').value.trim();
            const mobile = document.getElementById('pMobile').value.trim();

            if (!name || !email || !mobile) {
                showToast('Please fill required fields', 'error');
                return;
            }

            try {
                const user = JSON.parse(localStorage.getItem('raj_customer') || '{}');
                const users = JSON.parse(localStorage.getItem('raj_customers') || '[]');
                const idx = users.findIndex(u => u.id === user.id);

                const updated = {
                    ...(idx >= 0 ? users[idx] : user),
                    name, email, mobile,
                    whatsapp: document.getElementById('pWhatsapp').value.trim(),
                    city: document.getElementById('pCity').value.trim(),
                    address: document.getElementById('pAddress').value.trim(),
                    pincode: document.getElementById('pPincode').value.trim(),
                    updatedAt: new Date().toISOString()
                };

                if (idx >= 0) users[idx] = updated;
                else users.push(updated);

                localStorage.setItem('raj_customers', JSON.stringify(users));
                localStorage.setItem('raj_customer', JSON.stringify({
                    ...user,
                    name, email, mobile
                }));

                document.getElementById('profileName').textContent = name;
                document.getElementById('profileEmail').textContent = email;

                showToast('✅ Profile updated successfully!', 'success');
            } catch (err) {
                showToast('Failed to save profile', 'error');
            }
        };

        window.logout = function() {
            if (!confirm('Are you sure you want to logout?')) return;
            localStorage.removeItem('raj_customer');
            showToast('Logged out successfully', 'info');
            setTimeout(() => window.location.href = 'customer-login.html', 700);
        };

        function showToast(msg, type = 'info') {
            document.querySelectorAll('.rm-toast').forEach(t => t.remove());
            const colors = { success: '#10b981', error: '#ef4444', info: '#1a56db' };
            const t = document.createElement('div');
            t.className = 'rm-toast';
            t.textContent = msg;
            t.style.background = colors[type] || colors.info;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
            </html>
