<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Customer Registration - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="auth-container">

        <div class="auth-card">
            <div class="auth-header">
                <div class="icon-wrap"><i class="fas fa-user-plus"></i></div>
                <h1>Create Account</h1>
                <p>Join Raj Marketing Mysore</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="regName" required placeholder="Enter your full name" />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="regEmail" required placeholder="your@email.com" />
                    </div>
                    <div class="form-group">
                        <label>Mobile <span class="required">*</span></label>
                        <input type="tel" id="regMobile" required placeholder="10-digit number" maxlength="10" pattern="[0-9]{10}" />
                    </div>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="regCity" value="Mysore" placeholder="Your city" />
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea id="regAddress" placeholder="Street, area, landmark..." rows="2"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <input type="password" id="regPassword" required placeholder="Min 6 characters" minlength="6" />
                    </div>
                    <div class="form-group">
                        <label>Confirm Password <span class="required">*</span></label>
                        <input type="password" id="regConfirm" required placeholder="Re-enter password" minlength="6" />
                    </div>
                </div>

                <div class="form-group" style="display:flex;align-items:flex-start;gap:8px;">
                    <input type="checkbox" id="regTerms" required style="width:auto;margin-top:4px;flex-shrink:0;" />
                    <label for="regTerms" style="font-weight:500;font-size:12px;color:var(--muted-text);line-height:1.5;">
                        I agree to the
                        <a href="../terms.html" style="color:var(--royal-blue);text-decoration:none;font-weight:700;">Terms</a>
                        and
                        <a href="../privacy.html" style="color:var(--royal-blue);text-decoration:none;font-weight:700;">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>

                <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted-text);">
                    Already have an account?
                    <a href="customer-login.html" style="color:var(--royal-blue);text-decoration:none;font-weight:700;">Sign In</a>
                </div>
            </form>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    function handleRegister(e) {
        e.preventDefault();

        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim().toLowerCase();
        const mobile = document.getElementById('regMobile').value.trim();
        const city = document.getElementById('regCity').value.trim();
        const address = document.getElementById('regAddress').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        const terms = document.getElementById('regTerms').checked;

        if (!name || name.length < 2) { showToast('Please enter a valid name', 'error'); return; }
        if (!email || !/^\S+@\S+\.\S+$/.test(email)) { showToast('Please enter a valid email', 'error'); return; }
        if (!mobile || mobile.length !== 10) { showToast('Please enter a valid 10-digit mobile', 'error'); return; }
        if (password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
        if (password !== confirm) { showToast('Passwords do not match', 'error'); return; }
        if (!terms) { showToast('Please accept Terms & Privacy', 'error'); return; }

        try {
            const users = JSON.parse(localStorage.getItem('raj_customers') || '[]');

            if (users.find(u => u.email === email || u.mobile === mobile)) {
                showToast('An account with this email or mobile already exists', 'error');
                return;
            }

            const newUser = {
                id: 'CUST-' + Date.now(),
                name, email, mobile, city, address,
                password,
                registeredAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('raj_customers', JSON.stringify(users));

            // Auto-login
            localStorage.setItem('raj_customer', JSON.stringify({
                id: newUser.id,
                name: newUser.name,
                email: newUser.email,
                mobile: newUser.mobile,
                loggedInAt: new Date().toISOString()
            }));

            showToast('🎉 Account created successfully!', 'success');
            setTimeout(() => window.location.href = 'customer-dashboard.html', 900);
        } catch (err) {
            showToast('Registration failed. Try again.', 'error');
        }
    }

    function showToast(msg, type = 'info') {
        document.querySelectorAll('.rm-toast').forEach(t => t.remove());
        const colors = { success: '#10b981', error: '#ef4444', info: '#1a56db' };
        const t = document.createElement('div');
        t.className = 'rm-toast';
        t.textContent = msg;
        t.style.background = colors[type] || colors.info;
        document.body.appendChild(t);
        requestAnimationFrame(() => t.classList.add('show'));
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
    }
    </script>
</body>
        </html>
