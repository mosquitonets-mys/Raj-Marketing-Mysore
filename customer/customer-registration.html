<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Raj Marketing · Customer Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f4f8; display: flex; justify-content: center; min-height: 100vh; padding: 20px; padding-top: 40px; padding-bottom: 40px; }
        .register-container { max-width: 480px; width: 100%; background: #ffffff; border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.06); padding: 35px 28px 30px 28px; border: 1px solid #e8ecf0; }
        .register-header { text-align: center; margin-bottom: 24px; }
        .register-header .logo-icon { width: 72px; height: 72px; background: linear-gradient(145deg, #0ea5e9, #0284c7); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 32px; box-shadow: 0 4px 20px rgba(14,165,233,0.3); }
        .register-header h1 { font-size: 22px; font-weight: 800; color: #1a1a2e; margin-top: 12px; }
        .register-header p { font-size: 13px; color: #6b6b7b; margin-top: 2px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #4a4a5a; display: block; margin-bottom: 4px; }
        .form-group label .required { color: #dc2626; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #e8ecf0; border-radius: 12px; font-size: 13px; outline: none; font-family: 'Poppins', sans-serif; background: #f8fafc; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,0.08); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-register { width: 100%; padding: 14px; background: linear-gradient(145deg, #0ea5e9, #0284c7); color: #fff; border: none; border-radius: 40px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 16px rgba(14,165,233,0.25); margin-top: 6px; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(14,165,233,0.35); }
        .btn-register:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-register .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .login-footer { text-align: center; margin-top: 18px; font-size: 13px; color: #6b6b7b; }
        .login-footer a { color: #0ea5e9; text-decoration: none; font-weight: 600; }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; font-size: 13px; display: none; border-left: 4px solid #dc2626; }
        .error-msg.show { display: block; }
        .success-msg { background: #d1fae5; color: #065f46; padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; font-size: 13px; display: none; border-left: 4px solid #22c55e; }
        .success-msg.show { display: block; }
        @media (max-width: 500px) { .register-container { padding: 24px 16px; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
            <h1>Create Customer Account</h1>
            <p>Register to track your orders, estimates and appointments</p>
        </div>

        <div id="errorBox" class="error-msg"></div>
        <div id="successBox" class="success-msg"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" placeholder="Enter your full name" required />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Mobile Number <span class="required">*</span></label>
                    <input type="tel" id="mobile" placeholder="9483037385" required />
                </div>
                <div class="form-group">
                    <label>WhatsApp Number</label>
                    <input type="tel" id="whatsapp" placeholder="Same as mobile" />
                </div>
            </div>
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" placeholder="your@email.com" required />
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address" placeholder="Street, area, landmark" />
            </div>
            <div class="form-row">
                <div class="form-group"><label>City</label><input type="text" id="city" placeholder="Your city" /></div>
                <div class="form-group"><label>District</label><input type="text" id="district" placeholder="Your district" /></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>State</label><input type="text" id="state" value="Karnataka" /></div>
                <div class="form-group"><label>PIN Code</label><input type="text" id="pin" placeholder="570001" /></div>
            </div>
            <div class="form-group">
                <label>How did you hear about us?</label>
                <select id="source">
                    <option value="">Select...</option>
                    <option value="Google">Google Search</option>
                    <option value="Facebook">Facebook/Instagram</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Friend">Friend/Family</option>
                    <option value="Dealer">Dealer</option>
                    <option value="Google Ads">Google Ads</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" id="password" placeholder="Min 8 characters" required minlength="8" />
            </div>
            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
            </div>
            <button type="submit" class="btn-register" id="registerBtn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="login-footer">
            <p>Already have an account? <a href="customer-login.html">Login Here</a></p>
            <p style="margin-top:6px; font-size:12px; color:#8a8a9a;">
                <a href="index.html"><i class="fas fa-home"></i> Back to Home</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const form = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');

        function generateCustomerId() {
            const now = new Date();
            const date = now.getFullYear() +
                String(now.getMonth() + 1).padStart(2, '0') +
                String(now.getDate()).padStart(2, '0');
            const random = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
            return `RM-CUS-${date}-${random}`;
        }

        window.handleRegister = async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const email = document.getElementById('email').value.trim();
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value.trim();
            const district = document.getElementById('district').value.trim();
            const state = document.getElementById('state').value.trim();
            const pin = document.getElementById('pin').value.trim();
            const source = document.getElementById('source').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            errorBox.classList.remove('show');
            successBox.classList.remove('show');

            if (!fullName || !mobile || !email || !password) {
                showError('Please fill in all required fields.');
                return;
            }

            if (mobile.length < 10) {
                showError('Please enter a valid 10-digit mobile number.');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showError('Please enter a valid email address.');
                return;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="spinner"></span> Creating account...';

            try {
                // Create Firebase Auth user
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // Generate Customer ID
                const customerId = generateCustomerId();

                // Save customer data to Firestore
                await setDoc(doc(db, 'customers', customerId), {
                    customerId: customerId,
                    uid: uid,
                    name: fullName,
                    mobile: mobile,
                    phone: mobile,
                    whatsapp: whatsapp || mobile,
                    email: email,
                    address: address || '',
                    city: city || '',
                    district: district || '',
                    state: state || 'Karnataka',
                    pin: pin || '',
                    source: source || '',
                    status: 'Active',
                    referralCode: `RAJ-REF-${String(Date.now()).slice(-6)}`,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });

                successBox.textContent = '✅ Account created successfully! Redirecting to dashboard...';
                successBox.classList.add('show');
                form.reset();

                setTimeout(() => {
                    window.location.href = 'customer-dashboard.html';
                }, 2500);

            } catch (error) {
                console.error('❌ Registration error:', error);
                let msg = 'Registration failed. Please try again.';
                if (error.code === 'auth/email-already-in-use') {
                    msg = 'This email is already registered. Please use a different email or login.';
                } else if (error.code === 'auth/weak-password') {
                    msg = 'Password is too weak. Please use at least 8 characters with mix of letters, numbers and symbols.';
                } else if (error.code === 'auth/invalid-email') {
                    msg = 'Please enter a valid email address.';
                }
                showError(msg);
            } finally {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        };

        function showError(msg) {
            errorBox.textContent = '❌ ' + msg;
            errorBox.classList.add('show');
            successBox.classList.remove('show');
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('registerBtn').click();
            }
        });

        console.log("✅ Customer registration page loaded");
    </script>
</body>
</html>
