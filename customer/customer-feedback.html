<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Feedback - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .star-rating {
            display: flex;
            gap: 8px;
            font-size: 36px;
            color: #f59e0b;
            margin: 8px 0 16px;
        }
        .star-rating .star {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .star-rating .star:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-star"></i> Share Feedback</h1>
        </div>

        <div class="card">
            <div class="card-title">
                <i class="fas fa-comment-dots"></i> Your Experience
            </div>

            <form id="feedbackForm" onsubmit="submitFeedback(event)">
                <div class="form-group">
                    <label>How would you rate us? <span class="required">*</span></label>
                    <div class="star-rating" id="starRating">
                        <i class="fas fa-star star" data-value="1"></i>
                        <i class="fas fa-star star" data-value="2"></i>
                        <i class="fas fa-star star" data-value="3"></i>
                        <i class="fas fa-star star" data-value="4"></i>
                        <i class="fas fa-star star" data-value="5"></i>
                    </div>
                    <input type="hidden" id="ratingValue" value="0" />
                </div>

                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="fbName" placeholder="Optional" />
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="fbCategory">
                        <option value="General">General Feedback</option>
                        <option value="Product Quality">Product Quality</option>
                        <option value="Installation">Installation</option>
                        <option value="Customer Service">Customer Service</option>
                        <option value="Pricing">Pricing</option>
                        <option value="Bug Report">Report Issue</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tell us more <span class="required">*</span></label>
                    <textarea id="fbMessage" required placeholder="Share your experience..." rows="5"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-paper-plane"></i> Submit Feedback
                </button>
            </form>
        </div>

        <div class="card">
            <div class="card-title">
                <i class="fas fa-google"></i> Love Our Service?
            </div>
            <p style="font-size:13px;color:var(--bold-grey);line-height:1.6;margin-bottom:14px;">
                Help others find us by leaving a review on Google. Your feedback means a lot to our team!
            </p>
            <a href="https://g.page/r/Cd4VqO0Z0WjtEAI/review" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-block">
                <i class="fas fa-star"></i> Leave Google Review
            </a>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        let currentRating = 0;

        // Star rating
        document.querySelectorAll('.star-rating .star').forEach(star => {
            star.addEventListener('click', function() {
                currentRating = parseInt(this.dataset.value);
                document.getElementById('ratingValue').value = currentRating;
                document.querySelectorAll('.star-rating .star').forEach((s, i) => {
                    s.style.color = i < currentRating ? '#f59e0b' : '#e5e7eb';
                });
            });

            star.addEventListener('mouseenter', function() {
                const val = parseInt(this.dataset.value);
                document.querySelectorAll('.star-rating .star').forEach((s, i) => {
                    s.style.color = i < val ? '#f59e0b' : '#e5e7eb';
                });
            });
        });

        document.getElementById('starRating').addEventListener('mouseleave', function() {
            document.querySelectorAll('.star-rating .star').forEach((s, i) => {
                s.style.color = i < currentRating ? '#f59e0b' : '#e5e7eb';
            });
        });

        window.submitFeedback = function(e) {
            e.preventDefault();

            const name = document.getElementById('fbName').value.trim();
            const category = document.getElementById('fbCategory').value;
            const message = document.getElementById('fbMessage').value.trim();

            if (currentRating === 0) {
                showToast('Please select a rating', 'error');
                return;
            }
            if (!message || message.length < 5) {
                showToast('Please write your feedback', 'error');
                return;
            }

            try {
                const feedbacks = JSON.parse(localStorage.getItem('raj_feedbacks') || '[]');
                feedbacks.push({
                    id: 'FB-' + Date.now(),
                    rating: currentRating,
                    name: name || 'Anonymous',
                    category,
                    message,
                    createdAt: new Date().toISOString()
                });
                localStorage.setItem('raj_feedbacks', JSON.stringify(feedbacks));

                showToast('✅ Thank you for your feedback!', 'success');
                document.getElementById('feedbackForm').reset();
                currentRating = 0;
                document.querySelectorAll('.star-rating .star').forEach(s => s.style.color = '#e5e7eb');
            } catch (err) {
                showToast('Failed to submit feedback', 'error');
            }
        };

        function showToast(msg, type = 'info') {
            document.querySelectorAll('.rm-toast').forEach(t => t.remove());
            const colors = { success: '#10b981', error: '#ef4444', info: '#1a56db' };
            const t = document.createElement('div');
            t.className = 'rm-toast';
            t.textContent = msg;
            t.style.background = colors[type] || colors.info;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        }
    })();
    </script>
</body>
    </html>
