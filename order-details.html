<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Raj Marketing · Order Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0 12px;
            padding-top: 80px;
            padding-bottom: 100px;
        }
        .app-container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            padding: 20px 18px;
            border: 1px solid #e8ecf0;
        }
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            max-width: 504px;
            margin: 0 auto;
            width: 100%;
            background: #ffffff;
            padding: 14px 20px 10px 20px;
            border-bottom: 1px solid #e8ecf0;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fixed-header .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .fixed-header .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(145deg, #0ea5e9, #0284c7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }
        .fixed-header .logo-text {
            font-weight: 700;
            font-size: 16px;
            color: #1a1a1a;
            line-height: 1.2;
        }
        .fixed-header .logo-text span {
            display: block;
            font-weight: 400;
            font-size: 9px;
            color: #6b6b6b;
        }
        .fixed-header .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .fixed-header .header-actions i {
            font-size: 18px;
            color: #2d2d2d;
            background: #f5f0eb;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
        }
        .fixed-header .back-btn {
            font-size: 20px;
            color: #2d2d2d;
            background: #f5f0eb;
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            text-decoration: none;
        }
        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            max-width: 504px;
            margin: 0 auto;
            width: 100%;
            background: #ffffff;
            padding: 8px 12px 12px 12px;
            border-top: 1px solid #e8ecf0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 30px 30px 0 0;
        }
        .fixed-footer .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: #8a8a8a;
            font-weight: 500;
            gap: 2px;
            padding: 4px 12px;
            border-radius: 30px;
            text-decoration: none;
        }
        .fixed-footer .nav-item i {
            font-size: 20px;
            color: #8a8a8a;
        }
        .fixed-footer .nav-item.active i {
            color: #0ea5e9;
        }
        .fixed-footer .nav-item.active {
            color: #0ea5e9;
            background: rgba(14, 165, 233, 0.08);
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 18px 16px;
            margin: 14px 0;
            border: 1px solid #e8ecf0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
        }
        .card-title {
            font-weight: 700;
            font-size: 15px;
            color: #1a1a1a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title i {
            color: #0ea5e9;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0ece6;
            font-size: 13px;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-row .label {
            color: #6b6b7b;
        }
        .detail-row .value {
            font-weight: 600;
            color: #1a1a2e;
        }
        .detail-row .value.total {
            font-size: 18px;
            color: #0ea5e9;
        }
        .status-badge {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .status-new { background: #fff7ed; color: #ea580c; }
        .status-confirmed { background: #dbeafe; color: #1d4ed8; }
        .status-production { background: #dbeafe; color: #1d4ed8; }
        .status-ready { background: #d1fae5; color: #059669; }
        .status-completed { background: #d1fae5; color: #059669; }
        .status-cancelled { background: #fee2e2; color: #dc2626; }
        .btn-primary {
            background: linear-gradient(145deg, #0ea5e9, #0284c7);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.3);
        }
        .btn-secondary {
            background: #f5f0eb;
            color: #1a1a1a;
            border: 1px solid #e8ecf0;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            text-align: center;
        }
        .btn-secondary:hover {
            background: #e8ecf0;
        }
        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: 0.2s;
        }
        .btn-whatsapp:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .loading-text {
            text-align: center;
            padding: 20px;
            color: #777;
        }
        @media (max-width: 400px) {
            .action-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="fixed-header">
        <div class="logo-area">
            <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <div class="logo-text">Raj Marketing<span>Mysore</span></div>
        </div>
        <div class="header-actions">
            <i class="fas fa-user-circle" title="Profile"></i>
        </div>
    </header>

    <div class="app-container">
        <h2 style="font-size:20px; font-weight:800; color:#1a1a2e; margin-bottom:4px;">📦 Order Details</h2>
        <p style="font-size:13px; color:#6b6b7b; margin-bottom:12px;" id="orderIdDisplay">Order ID: —</p>

        <div id="orderContent">
            <div class="loading-text">Loading order details...</div>
        </div>

        <div style="font-size:9px; color:#aaa; text-align:center; margin-top:14px;">
            Raj Marketing Mysore · Order Details
        </div>
    </div>

    <footer class="fixed-footer">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
        <a href="estimate.html" class="nav-item"><i class="fas fa-th-large"></i> Products</a>
        <a href="appointment.html" class="nav-item"><i class="fas fa-calendar-check"></i> Appointment</a>
        <a href="price-checker.html" class="nav-item"><i class="fas fa-robot"></i> AI Price</a>
        <a href="customer-dashboard.html" class="nav-item active"><i class="fas fa-user"></i> Profile</a>
    </footer>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        // Get order ID from URL
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "customer-login.html";
                return;
            }
            if (orderId) {
                await loadOrderDetails(orderId);
            } else {
                document.getElementById("orderContent").innerHTML = `
                    <div class="card" style="text-align:center; padding:30px 20px;">
                        <i class="fas fa-box" style="font-size:48px; color:#6b6b7b; display:block; margin-bottom:12px;"></i>
                        <h3 style="font-size:16px; font-weight:700; color:#1a1a2e;">No Order Selected</h3>
                        <p style="color:#6b6b7b; font-size:13px;">Please select an order from your dashboard.</p>
                        <a href="customer-dashboard.html" class="btn-secondary" style="margin-top:12px; display:inline-block; width:auto;">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                `;
            }
        });

        async function loadOrderDetails(id) {
            try {
                const orderRef = doc(db, "orders", id);
                const orderSnap = await getDoc(orderRef);

                if (!orderSnap.exists()) {
                    document.getElementById("orderContent").innerHTML = `
                        <div class="card" style="text-align:center; padding:30px 20px;">
                            <i class="fas fa-exclamation-circle" style="font-size:48px; color:#dc2626; display:block; margin-bottom:12px;"></i>
                            <h3 style="font-size:16px; font-weight:700; color:#1a1a2e;">Order Not Found</h3>
                            <p style="color:#6b6b7b; font-size:13px;">The order you're looking for doesn't exist.</p>
                        </div>
                    `;
                    return;
                }

                const order = orderSnap.data();
                document.getElementById("orderIdDisplay").textContent = `Order ID: ${order.orderId || order.id || "—"}`;

                const status = order.orderStatus || order.status || "NEW";
                const statusClass = status.toLowerCase().replace(/ /g, '');
                const total = order.totalAmount || order.total || 0;
                const advance = order.advanceAmount || order.advance || 0;
                const balance = Math.max(total - advance, 0);

                document.getElementById("orderContent").innerHTML = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                            <span style="font-weight:700; font-size:16px; color:#1a1a2e;">${order.product || "—"}</span>
                            <span class="status-badge status-${statusClass}">${status}</span>
                        </div>

                        <div class="detail-row">
                            <span class="label">Customer</span>
                            <span class="value">${order.customerName || "—"}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Mobile</span>
                            <span class="value">${order.mobile || "—"}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Product</span>
                            <span class="value">${order.product || "—"} ${order.variant ? '(' + order.variant + ')' : ''}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Sq.ft</span>
                            <span class="value">${order.sqft || 0}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Rate</span>
                            <span class="value">₹${order.rate || 0}/sq.ft</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Total Amount</span>
                            <span class="value total">₹${total.toLocaleString("en-IN")}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Advance (60%)</span>
                            <span class="value">₹${advance.toLocaleString("en-IN")}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Balance (40%)</span>
                            <span class="value">₹${balance.toLocaleString("en-IN")}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Production Status</span>
                            <span class="value">${order.productionStatus || "PENDING"}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Order Date</span>
                            <span class="value">${formatDate(order.createdAt)}</span>
                        </div>
                        ${order.notes ? `
                        <div class="detail-row">
                            <span class="label">Notes</span>
                            <span class="value" style="font-weight:400;">${order.notes}</span>
                        </div>` : ''}
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fas fa-actions"></i> Actions</div>
                        <div class="action-grid">
                            <a href="tel:${order.mobile || '9483037385'}" class="btn-secondary">
                                <i class="fas fa-phone"></i> Call
                            </a>
                            <a href="https://wa.me/91${String(order.mobile || '9483037385').replace(/\D/g,'')}" target="_blank" class="btn-whatsapp">
                                <i class="fab fa-whatsapp"></i> WhatsApp
                            </a>
                            <a href="invoice.html?id=${order.id}" class="btn-primary">
                                <i class="fas fa-file-invoice"></i> View Invoice
                            </a>
                            <a href="estimate.html" class="btn-secondary">
                                <i class="fas fa-plus"></i> New Estimate
                            </a>
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error("Order load error:", error);
                document.getElementById("orderContent").innerHTML = `
                    <div class="card" style="text-align:center; padding:30px 20px;">
                        <i class="fas fa-exclamation-circle" style="font-size:48px; color:#dc2626; display:block; margin-bottom:12px;"></i>
                        <h3 style="font-size:16px; font-weight:700; color:#1a1a2e;">Error Loading Order</h3>
                        <p style="color:#6b6b7b; font-size:13px;">${error.message}</p>
                    </div>
                `;
            }
        }

        function formatDate(value) {
            if (!value) return "—";
            try {
                if (value.toDate) {
                    return value.toDate().toLocaleDateString("en-IN", { day: '2-digit', month: 'short', year: 'numeric' });
                }
                const d = new Date(value);
                if (isNaN(d.getTime())) return "—";
                return d.toLocaleDateString("en-IN", { day: '2-digit', month: 'short', year: 'numeric' });
            } catch {
                return "—";
            }
        }
    </script>

</body>
</html>
