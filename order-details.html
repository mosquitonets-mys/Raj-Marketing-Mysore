<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Order Details - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cart-checkout.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="order-confirm-container" id="detailsContainer">
        <div class="loader">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading order details...</p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/cart-engine.js"></script>

    <script>
    (function() {
        'use strict';

        const STATUS_MAP = {
            'NEW': { label: 'New Order', class: 'status-new' },
            'CONFIRMED': { label: 'Confirmed', class: 'status-confirmed' },
            'PROCESSING': { label: 'Processing', class: 'status-processing' },
            'READY': { label: 'Ready', class: 'status-ready' },
            'DELIVERED': { label: 'Delivered', class: 'status-delivered' },
            'CANCELLED': { label: 'Cancelled', class: 'status-cancelled' }
        };

        function init() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                showError('No order ID provided');
                return;
            }

            let order = null;
            try {
                const orders = JSON.parse(localStorage.getItem('raj_orders') || '[]');
                order = orders.find(o => o.orderId === id || o.id === id);
            } catch (e) {}

            if (!order) {
                showError('Order not found');
                return;
            }

            render(order);
        }

        function render(order) {
            const container = document.getElementById('detailsContainer');
            const status = STATUS_MAP[order.status] || STATUS_MAP['NEW'];
            const totals = order.totals || {};
            const cust = order.customer || {};

            const itemsHtml = (order.items || []).map(item => {
                const unitLabel = item.unit === 'cm' ? 'cm' : '"';
                return `
                    <div class="cart-item" style="grid-template-columns:80px 1fr;">
                        <div class="item-image" style="width:80px;height:80px;">
                            ${item.image ? `<img src="${item.image}" alt="${item.productName}" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\'fas fa-box\\'></i>'" />` : '<i class="fas fa-box"></i>'}
                        </div>
                        <div class="item-details">
                            <div class="item-name">${item.productName}</div>
                            <div class="item-meta">
                                ${item.colour ? `<span>${item.colour}</span>` : ''}
                                ${item.type ? `<span>${item.type}</span>` : ''}
                            </div>
                            <div class="item-measurement">
                                <span class="mq"><i class="fas fa-arrows-alt-h"></i> ${item.width}${unitLabel}</span>
                                <span class="mq"><i class="fas fa-arrows-alt-v"></i> ${item.height}${unitLabel}</span>
                                <span class="mq"><i class="fas fa-sort-numeric-up"></i> ${item.qty}</span>
                                <span class="mq"><i class="fas fa-th"></i> ${item.totalSqft.toFixed(2)}</span>
                            </div>
                            <div class="item-price-row">
                                <span style="font-size:11px;color:var(--muted-text);">₹${item.rate}/sq.ft</span>
                                <div class="item-total">${CartEngine.formatCurrency(item.totalPrice)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div style="margin-bottom:20px;">
                    <a href="my-orders.html" style="color:var(--royal-blue);text-decoration:none;font-size:13px;font-weight:700;">
                        <i class="fas fa-arrow-left"></i> Back to Orders
                    </a>
                </div>

                <div class="info-card" style="background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#93c5fd;">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
                        <div>
                            <div style="font-size:11px;color:var(--muted-text);font-weight:700;text-transform:uppercase;letter-spacing:1px;">Order ID</div>
                            <div style="font-size:18px;font-weight:900;color:var(--highlight-grey);font-family:'Courier New',monospace;letter-spacing:1px;margin-top:2px;">
                                #${order.orderId}
                            </div>
                            <div style="font-size:11px;color:var(--muted-text);font-weight:600;margin-top:4px;">
                                Placed on ${new Date(order.createdAt).toLocaleString('en-IN')}
                            </div>
                        </div>
                        <span class="status-badge ${status.class}" style="font-size:12px;padding:6px 16px;">
                            ${status.label}
                        </span>
                    </div>
                </div>

                <div class="info-card">
                    <div class="card-title"><i class="fas fa-truck"></i> Delivery Details</div>
                    <div class="detail-row">
                        <span class="label">Name</span>
                        <span class="value">${cust.name || '—'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Mobile</span>
                        <span class="value">${cust.mobile || '—'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Address</span>
                        <span class="value">${cust.address || '—'}, ${cust.city || ''} - ${cust.pincode || ''}</span>
                    </div>
                    ${cust.landmark ? `
                        <div class="detail-row">
                            <span class="label">Landmark</span>
                            <span class="value">${cust.landmark}</span>
                        </div>
                    ` : ''}
                </div>

                <div class="info-card">
                    <div class="card-title"><i class="fas fa-box"></i> Order Items (${order.items.length})</div>
                    ${itemsHtml}
                </div>

                <div class="info-card">
                    <div class="card-title"><i class="fas fa-rupee-sign"></i> Payment Summary</div>
                    <div class="detail-row">
                        <span class="label">Subtotal</span>
                        <span class="value">${CartEngine.formatCurrency(totals.subtotal)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">GST (18%)</span>
                        <span class="value">${CartEngine.formatCurrency(totals.gst)}</span>
                    </div>
                    ${totals.discountAmount ? `
                        <div class="detail-row">
                            <span class="label">Discount</span>
                            <span class="value" style="color:#059669;">- ${CartEngine.formatCurrency(totals.discountAmount)}</span>
                        </div>
                    ` : ''}
                    <div class="detail-row">
                        <span class="label">Payment Method</span>
                        <span class="value">${order.paymentMethod || '—'}</span>
                    </div>
                    <div class="detail-row" style="border-top:2px solid var(--border);margin-top:6px;padding-top:12px;">
                        <span class="label" style="font-weight:900;font-size:14px;color:var(--highlight-grey);">Grand Total</span>
                        <span class="value" style="font-size:20px;color:var(--royal-blue);font-weight:900;">${CartEngine.formatCurrency(totals.grandTotal)}</span>
                    </div>
                    ${totals.advanceAmount ? `
                        <div class="detail-row">
                            <span class="label">Advance</span>
                            <span class="value" style="color:#059669;">${CartEngine.formatCurrency(totals.advanceAmount)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Balance</span>
                            <span class="value" style="color:#d97706;">${CartEngine.formatCurrency(totals.balanceAmount)}</span>
                        </div>
                    ` : ''}
                </div>

                ${order.notes ? `
                    <div class="info-card">
                        <div class="card-title"><i class="fas fa-sticky-note"></i> Order Notes</div>
                        <p style="font-size:13px;color:var(--bold-grey);line-height:1.7;">${order.notes}</p>
                    </div>
                ` : ''}

                <div class="confirm-actions">
                    <a href="https://wa.me/919483037385?text=Hi,%20I%20need%20help%20with%20order%20${order.orderId}" target="_blank" class="btn btn-whatsapp">
                        <i class="fab fa-whatsapp"></i> WhatsApp Support
                    </a>
                    <a href="tel:9483037385" class="btn btn-primary">
                        <i class="fas fa-phone"></i> Call Support
                    </a>
                    <button class="btn btn-secondary" onclick="window.print()">
                        <i class="fas fa-print"></i> Print Order
                    </button>
                    ${order.status === 'NEW' ? `
                        <button class="btn btn-secondary" onclick="cancelOrder('${order.orderId}')" style="color:#dc2626;border-color:#dc2626;">
                            <i class="fas fa-times"></i> Cancel Order
                        </button>
                    ` : ''}
                </div>
            `;
        }

        function showError(msg) {
            document.getElementById('detailsContainer').innerHTML = `
                <div class="empty-cart">
                    <div class="empty-icon" style="background:#fee2e2;color:#dc2626;">
                        <i class="fas fa-exclamation-circle"></i>
                    </div>
                    <h2>${msg}</h2>
                    <p>We couldn't find this order.</p>
                    <a href="my-orders.html" class="btn btn-primary">View My Orders</a>
                </div>
            `;
        }

        window.cancelOrder = function(orderId) {
            if (!confirm('Cancel this order?')) return;
            try {
                const orders = JSON.parse(localStorage.getItem('raj_orders') || '[]');
                const idx = orders.findIndex(o => o.orderId === orderId);
                if (idx >= 0) {
                    orders[idx].status = 'CANCELLED';
                    orders[idx].cancelledAt = new Date().toISOString();
                    localStorage.setItem('raj_orders', JSON.stringify(orders));
                    showToast('Order cancelled', 'warning');
                    setTimeout(() => window.location.reload(), 800);
                }
            } catch (e) {}
        };

        function showToast(msg, type = 'info') {
            document.querySelectorAll('.rm-toast').forEach(t => t.remove());
            const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b' };
            const t = document.createElement('div');
            t.className = 'rm-toast';
            t.textContent = msg;
            t.style.background = colors[type] || '#1a56db';
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2500);
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
