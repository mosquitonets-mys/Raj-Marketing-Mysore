    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <style>
        /* ============================================================
           COMPLETE PRODUCT DETAIL STYLES
           Inspired by Premium D2C Design Language
        ============================================================ */
        
        /* ===== CSS VARIABLES ===== */
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --primary-light: #e0f2fe;
            --secondary: #0f172a;
            --dark: #0f172a;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.10);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 50px;
            --transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg-light);
            color: var(--text);
            min-height: 100vh;
            padding: 0 16px;
            padding-top: 80px;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-light);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== CONTAINER ===== */
        .app-container {
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: 20px 18px 28px;
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 720px;
                padding: 30px 32px 40px;
                border-radius: 32px;
            }
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 960px;
                padding: 40px 48px 50px;
            }
        }

        /* ============================================================
           HEADER
        ============================================================ */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            padding: 10px 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (min-width: 768px) {
            .fixed-header {
                max-width: 720px;
                padding: 12px 24px;
            }
        }

        @media (min-width: 1024px) {
            .fixed-header {
                max-width: 960px;
                padding: 14px 32px;
            }
        }

        .fixed-header .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--dark);
        }

        .fixed-header .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 17px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }

        .fixed-header .logo-text {
            font-weight: 800;
            font-size: 16px;
            color: var(--dark);
            line-height: 1.1;
        }

        .fixed-header .logo-text span {
            display: block;
            font-weight: 400;
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .fixed-header .header-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .fixed-header .header-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 8px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            text-decoration: none;
            min-width: 40px;
            transition: var(--transition);
            position: relative;
        }

        .fixed-header .header-btn i {
            font-size: 16px;
            display: block;
            margin-bottom: 1px;
            transition: 0.2s;
        }

        .fixed-header .header-btn .label {
            font-size: 7px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            opacity: 0.6;
        }

        .fixed-header .header-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .fixed-header .header-btn:hover i {
            transform: translateY(-2px);
        }

        .header-btn .badge-dot {
            position: absolute;
            top: 2px;
            right: 4px;
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
        }

        /* ============================================================
           BREADCRUMB
        ============================================================ */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 16px;
            flex-wrap: wrap;
            padding: 0 2px;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .breadcrumb a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .breadcrumb .sep {
            color: var(--border);
        }

        .breadcrumb .current {
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        /* ============================================================
           PRODUCT HEADER
        ============================================================ */
        .product-header {
            margin-bottom: 16px;
        }

        .product-header .badge-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .product-header .badge-row .tag {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .tag-velcro { background: #dbeafe; color: #1d4ed8; }
        .tag-pleated { background: #d1fae5; color: #059669; }
        .tag-frame { background: #fef3c7; color: #d97706; }
        .tag-door { background: #fce4ec; color: #dc2626; }
        .tag-premium { background: #fef3c7; color: #b45309; }
        .tag-security { background: #e0e7ff; color: #4f46e5; }
        .tag-honeycomb { background: #fef3c7; color: #b45309; }
        .tag-sliding { background: #c7d2fe; color: #4338ca; }
        .tag-mesh { background: #e5e7eb; color: #4b5563; }

        .product-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--dark);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .product-header .sub {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 400;
        }

        .product-header .rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 14px;
        }

        .product-header .rating .stars {
            color: #f59e0b;
            letter-spacing: 1px;
        }

        .product-header .rating .rating-text {
            color: var(--text-muted);
            font-weight: 500;
        }

        .product-header .rating .rating-count {
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 420px) {
            .product-header h1 {
                font-size: 21px;
            }
            .breadcrumb {
                font-size: 11px;
            }
            .breadcrumb .current {
                max-width: 100px;
            }
        }

        /* ============================================================
           PRODUCT GALLERY
        ============================================================ */
        .gallery-container {
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            height: 280px;
            background: var(--bg-light);
            margin: 12px 0 16px 0;
            touch-action: pan-y;
        }

        @media (min-width: 768px) {
            .gallery-container {
                height: 400px;
                border-radius: var(--radius-lg);
            }
        }

        @media (min-width: 1024px) {
            .gallery-container {
                height: 480px;
            }
        }

        .gallery-track {
            display: flex;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .gallery-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-light);
            overflow: hidden;
        }

        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-slide .icon-placeholder {
            font-size: 72px;
            color: var(--primary);
            opacity: 0.3;
        }

        .gallery-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
            transition: var(--transition);
            color: var(--text);
            z-index: 10;
        }

        .gallery-btn:hover {
            background: #ffffff;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
            color: var(--primary);
            transform: translateY(-50%) scale(1.05);
        }

        .gallery-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        .gallery-btn.prev { left: 12px; }
        .gallery-btn.next { right: 12px; }

        .gallery-dots {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .gallery-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border: none;
            transition: var(--transition);
            padding: 0;
        }

        .gallery-dots .dot.active {
            background: var(--primary);
            transform: scale(1.3);
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.3);
        }

        .gallery-counter {
            position: absolute;
            bottom: 14px;
            right: 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
            z-index: 10;
        }

        @media (max-width: 420px) {
            .gallery-container {
                height: 200px;
            }
            .gallery-btn {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }
            .gallery-btn.prev { left: 8px; }
            .gallery-btn.next { right: 8px; }
        }

        /* ============================================================
           PRICE SECTION
        ============================================================ */
        .price-section {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 14px;
        }

        .price-section .current {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .price-section .current .unit {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0;
        }

        .price-section .original {
            font-size: 17px;
            color: var(--text-light);
            text-decoration: line-through;
            font-weight: 400;
        }

        .price-section .discount-badge {
            background: #d1fae5;
            color: #059669;
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
        }

        .price-section .availability-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .availability-badge.online {
            background: #d1fae5;
            color: #059669;
        }

        .availability-badge.appointment {
            background: #fef3c7;
            color: #d97706;
        }

        .price-section .gst-note {
            font-size: 11px;
            color: var(--text-light);
            width: 100%;
        }

        @media (max-width: 420px) {
            .price-section .current {
                font-size: 26px;
            }
        }

        /* ============================================================
           CTA ROW
        ============================================================ */
        .cta-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0 16px 0;
        }

        .cta-row .btn {
            flex: 1;
            min-width: 110px;
            padding: 14px 24px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            font-family: var(--font);
        }

        .cta-row .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.4);
        }

        .btn-success {
            background: linear-gradient(145deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.4);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
            transform: translateY(-2px);
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(37, 211, 102, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        @media (max-width: 420px) {
            .cta-row .btn {
                min-width: 80px;
                font-size: 12px;
                padding: 12px 14px;
            }
        }

        @media (max-width: 360px) {
            .cta-row .btn {
                min-width: 100%;
            }
        }

        /* ============================================================
           QUICK BUY SECTION
        ============================================================ */
        .quick-buy {
            background: var(--bg-light);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            margin: 14px 0;
            border: 1px solid var(--border-light);
        }

        .quick-buy .title {
            font-weight: 700;
            font-size: 13px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .quick-buy .title i {
            color: var(--primary);
        }

        .quick-buy .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .quick-buy .row .qty-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-white);
            border-radius: var(--radius-full);
            border: 1.5px solid var(--border);
            padding: 2px;
        }

        .quick-buy .row .qty-wrap button {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 50%;
            transition: var(--transition);
        }

        .quick-buy .row .qty-wrap button:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .quick-buy .row .qty-wrap input {
            width: 40px;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            background: transparent;
            outline: none;
            padding: 4px 0;
        }

        .quick-buy .row .btn {
            flex: 1;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .quick-buy .row .btn:active {
            transform: scale(0.97);
        }

        .quick-buy .row .btn-cart {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
        }

        .quick-buy .row .btn-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(14, 165, 233, 0.35);
        }

        .quick-buy .row .btn-buy {
            background: linear-gradient(145deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.25);
        }

        .quick-buy .row .btn-buy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(34, 197, 94, 0.35);
        }

        /* ============================================================
           SECTION TITLE
        ============================================================ */
        .section-title {
            font-weight: 700;
            font-size: 17px;
            color: var(--dark);
            margin: 22px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .section-title i {
            color: var(--primary);
            font-size: 18px;
        }

        .section-title .title-line {
            flex: 1;
            height: 1.5px;
            background: linear-gradient(to right, var(--border), transparent);
            margin-left: 4px;
        }

        .section-label {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 3px 14px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        /* ============================================================
           DESCRIPTION
        ============================================================ */
        .description-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.8;
        }

        .description-text .more {
            display: none;
        }

        .description-text .more.show {
            display: inline;
        }

        .description-text .read-more-btn {
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 14px;
            font-family: var(--font);
            padding: 0;
        }

        .description-text .read-more-btn:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* ============================================================
           SPEC TABLE
        ============================================================ */
        .spec-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin: 6px 0;
            background: var(--bg-light);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .spec-table tr {
            border-bottom: 1px solid var(--border-light);
        }

        .spec-table tr:last-child {
            border-bottom: none;
        }

        .spec-table td {
            padding: 10px 14px;
        }

        .spec-table .label {
            color: var(--text-muted);
            font-weight: 500;
            width: 40%;
            background: var(--bg-light);
        }

        .spec-table .value {
            font-weight: 600;
            color: var(--dark);
        }

        /* ============================================================
           COLOUR SELECTOR
        ============================================================ */

        // ============================================================
        // PRODUCT SCHEMA (JSON-LD)
        // ============================================================
        function updateProductSchema(product) {
            const existing = document.getElementById('productSchema');
            if (existing) existing.remove();

            const script = document.createElement('script');
            script.id = 'productSchema';
            script.type = 'application/ld+json';
            script.textContent = JSON.stringify({
                '@context': 'https://schema.org',
                '@type': 'Product',
                'name': product.name,
                'description': product.description || 'Premium mosquito net from Raj Marketing Mysore.',
                'image': product.images && product.images.length > 0 ? `https://rajmarketingmysore.info/${product.images[0]}` :
                    'https://rajmarketingmysore.info/images/og-image.jpg',
                'brand': {
                    '@type': 'Brand',
                    'name': 'Raj Marketing Mysore'
                },
                'offers': {
                    '@type': 'Offer',
                    'priceCurrency': 'INR',
                    'price': typeof product.displayPrice === 'number' ? product.displayPrice : product.price,
                    'availability': product.onlinePurchase !== false ? 'https://schema.org/InStock' :
                        'https://schema.org/PreOrder',
                    'url': `https://rajmarketingmysore.info/product-detail.html?id=${product.id}`
                },
                'aggregateRating': {
                    '@type': 'AggregateRating',
                    'ratingValue': '4.9',
                    'reviewCount': '24'
                }
            });
            document.head.appendChild(script);
        }

        // ============================================================
        // SLIDER FUNCTIONS
        // ============================================================
        window.changeSlide = function(direction) {
            const track = document.getElementById('galleryTrack');
            if (!track) return;
            const slides = track.querySelectorAll('.gallery-slide');
            if (!slides.length) return;
            const total = slides.length;
            currentSlide = (currentSlide + direction + total) % total;
            track.style.transform = `translateX(-${currentSlide * (100 / total)}%)`;

            // Update dots
            const dots = document.querySelectorAll('.gallery-dots .dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });

            // Update counter
            const counter = document.querySelector('.gallery-counter');
            if (counter) {
                counter.textContent = `${currentSlide + 1} / ${total}`;
            }
        };

        window.goToSlide = function(index) {
            const track = document.getElementById('galleryTrack');
            if (!track) return;
            const slides = track.querySelectorAll('.gallery-slide');
            if (!slides.length) return;
            const total = slides.length;
            currentSlide = Math.min(Math.max(index, 0), total - 1);
            track.style.transform = `translateX(-${currentSlide * (100 / total)}%)`;

            // Update dots
            const dots = document.querySelectorAll('.gallery-dots .dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });

            // Update counter
            const counter = document.querySelector('.gallery-counter');
            if (counter) {
                counter.textContent = `${currentSlide + 1} / ${total}`;
            }
        };

        // Touch/swipe support for gallery
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('galleryContainer');
            if (!container) return;

            let startX = 0;
            let isDragging = false;

            container.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                isDragging = true;
            }, { passive: true });

            container.addEventListener('touchend', function(e) {
                if (!isDragging) return;
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) {
                        changeSlide(1);
                    } else {
                        changeSlide(-1);
                    }
                }
                isDragging = false;
            }, { passive: true });
        });
