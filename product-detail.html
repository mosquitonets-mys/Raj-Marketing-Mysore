<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title id="pageTitle">Product - Raj Marketing</title>
    <meta id="metaDescription" name="description" content="Premium mosquito nets and window screens in Mysore." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ============================================================
           FULL PRODUCT DETAIL STYLES
        ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
            padding: 0 16px;
            padding-top: 76px;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 20px 18px 24px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        /* ===== HEADER ===== */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fixed-header .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fixed-header .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(145deg, #0ea5e9, #0284c7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        .fixed-header .logo-text {
            font-weight: 800;
            font-size: 16px;
            color: #0f172a;
            line-height: 1.1;
        }

        .fixed-header .logo-text span {
            display: block;
            font-weight: 400;
            font-size: 9px;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        .fixed-header .header-actions {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .fixed-header .header-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 8px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            min-width: 44px;
            transition: all 0.25s ease;
        }

        .fixed-header .header-btn i {
            font-size: 17px;
            display: block;
            margin-bottom: 1px;
            transition: 0.2s;
        }

        .fixed-header .header-btn .label {
            font-size: 7px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            opacity: 0.7;
        }

        .fixed-header .header-btn:hover {
            background: #f0f9ff;
            color: #0ea5e9;
        }

        .fixed-header .header-btn:hover i {
            transform: translateY(-1px);
        }

        /* ===== FOOTER ===== */
        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            padding: 8px 12px 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 28px 28px 0 0;
        }

        .fixed-footer .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: #94a3b8;
            font-weight: 500;
            gap: 1px;
            padding: 6px 12px;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .fixed-footer .nav-item i {
            font-size: 19px;
            color: #94a3b8;
            transition: 0.2s;
        }

        .fixed-footer .nav-item.active i {
            color: #0ea5e9;
        }

        .fixed-footer .nav-item.active {
            color: #0ea5e9;
            background: #f0f9ff;
        }

        .fixed-footer .nav-item:hover {
            color: #0ea5e9;
        }

        .fixed-footer .nav-item:hover i {
            color: #0ea5e9;
            transform: translateY(-2px);
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .breadcrumb a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .breadcrumb a:hover {
            color: #0284c7;
            text-decoration: underline;
        }

        .breadcrumb .sep {
            color: #cbd5e1;
        }

        .breadcrumb .current {
            color: #475569;
            font-weight: 500;
        }

        /* ===== PRODUCT HERO ===== */
        .product-hero {
            margin-bottom: 16px;
        }

        .product-hero .badge-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .product-hero .badge-row .tag {
            padding: 3px 14px;
            border-radius: 14px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .tag-velcro {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .tag-pleated {
            background: #d1fae5;
            color: #059669;
        }
        .tag-frame {
            background: #fef3c7;
            color: #d97706;
        }
        .tag-door {
            background: #fce4ec;
            color: #dc2626;
        }
        .tag-premium {
            background: #fef3c7;
            color: #b45309;
        }

        .product-hero h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
        }

        .product-hero .sub {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 400;
        }

        /* ===== SLIDER ===== */
        .slider-container {
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            height: 260px;
            background: #f1f5f9;
            margin: 12px 0 14px 0;
        }

        .slider-track {
            display: flex;
            width: 300%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .slider-slide {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            overflow: hidden;
        }

        .slider-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-slide .icon-placeholder {
            font-size: 64px;
            color: #0ea5e9;
            opacity: 0.6;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            transition: all 0.25s ease;
            color: #475569;
        }

        .slider-btn:hover {
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            color: #0ea5e9;
            transform: translateY(-50%) scale(1.05);
        }

        .slider-btn.prev {
            left: 10px;
        }
        .slider-btn.next {
            right: 10px;
        }

        .slider-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .slider-dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .slider-dots .dot.active {
            background: #0ea5e9;
            transform: scale(1.2);
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
        }

        /* ===== PRICE SECTION ===== */
        .price-section {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            padding: 14px 0;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 14px;
        }

        .price-section .current {
            font-size: 30px;
            font-weight: 800;
            color: #0ea5e9;
        }

        .price-section .current .unit {
            font-size: 14px;
            font-weight: 400;
            color: #94a3b8;
        }

        .price-section .original {
            font-size: 16px;
            color: #94a3b8;
            text-decoration: line-through;
            font-weight: 400;
        }

        .price-section .discount-badge {
            background: #d1fae5;
            color: #059669;
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
        }

        .price-section .availability-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 30px;
        }

        .availability-badge.online {
            background: #d1fae5;
            color: #059669;
        }

        .availability-badge.appointment {
            background: #fef3c7;
            color: #d97706;
        }

        /* ===== CTA ROW ===== */
        .cta-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0 16px 0;
        }

        .cta-row .btn {
            flex: 1;
            min-width: 120px;
            padding: 13px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(145deg, #0ea5e9, #0284c7);
            color: #fff;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.4);
        }

        .btn-success {
            background: linear-gradient(145deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.4);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #0f172a;
            border: 1.5px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(37, 211, 102, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: #0ea5e9;
            border: 1.5px solid #0ea5e9;
        }

        .btn-outline:hover {
            background: #f0f9ff;
            transform: translateY(-2px);
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-weight: 700;
            font-size: 16px;
            color: #0f172a;
            margin: 18px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #0ea5e9;
            font-size: 18px;
        }

        .section-title .title-line {
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, #e2e8f0, transparent);
            margin-left: 4px;
        }

        /* ===== SPEC TABLE ===== */
        .spec-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin: 6px 0;
            background: #f8fafc;
            border-radius: 14px;
            overflow: hidden;
        }

        .spec-table tr {
            border-bottom: 1px solid #f1f5f9;
        }

        .spec-table tr:last-child {
            border-bottom: none;
        }

        .spec-table td {
            padding: 10px 14px;
        }

        .spec-table .label {
            color: #64748b;
            font-weight: 500;
            width: 40%;
            background: #f8fafc;
        }

        .spec-table .value {
            font-weight: 600;
            color: #0f172a;
        }

        /* ===== COLOUR SELECTOR ===== */
        .colour-selector {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 6px 0;
        }

        .colour-selector .colour {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2.5px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .colour-selector .colour:hover {
            border-color: #0ea5e9;
            transform: scale(1.08);
        }

        .colour-selector .colour.active {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
            transform: scale(1.05);
        }

        .colour-selector .colour.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .colour-ivory {
            background: #F5F0E8;
        }
        .colour-honey-gold {
            background: #D4A843;
        }
        .colour-brown {
            background: #8B6914;
        }
        .colour-black {
            background: #1A1A1A;
        }
        .colour-white {
            background: #FFFFFF;
            border-color: #d1d5db;
        }
        .colour-teakwood {
            background: #8B6914;
        }

        /* ===== TYPE SELECTOR ===== */
        .type-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 6px 0;
        }

        .type-selector .type {
            padding: 7px 20px;
            border-radius: 30px;
            border: 1.5px solid #e2e8f0;
            background: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #475569;
        }

        .type-selector .type:hover {
            border-color: #0ea5e9;
            color: #0ea5e9;
        }

        .type-selector .type.active {
            background: #0ea5e9;
            color: #fff;
            border-color: #0ea5e9;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
        }

        /* ===== BENEFIT GRID ===== */
        .benefit-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 6px 0;
        }

        .benefit-grid .item {
            background: #f8fafc;
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
            transition: 0.3s;
        }

        .benefit-grid .item:hover {
            background: #f0f9ff;
            transform: translateY(-2px);
        }

        .benefit-grid .item i {
            font-size: 26px;
            color: #0ea5e9;
            display: block;
            margin-bottom: 4px;
        }

        .benefit-grid .item span {
            font-size: 11px;
            font-weight: 600;
            color: #0f172a;
        }

        /* ===== APPLICATION TAGS ===== */
        .app-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 4px 0;
        }

        .app-tags .tag {
            background: #f1f5f9;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            color: #475569;
            transition: 0.2s;
        }

        .app-tags .tag:hover {
            background: #0ea5e9;
            color: #fff;
        }

        /* ===== FAQ ===== */
        .faq-item {
            border-bottom: 1px solid #f1f5f9;
            padding: 12px 0;
            cursor: pointer;
            transition: 0.2s;
        }

        .faq-item:hover {
            padding-left: 4px;
        }

        .faq-item .q {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 13px;
            color: #0f172a;
        }

        .faq-item .q i {
            color: #0ea5e9;
            transition: 0.3s ease;
            font-size: 14px;
        }

        .faq-item .a {
            font-size: 13px;
            color: #64748b;
            padding-top: 8px;
            display: none;
            line-height: 1.7;
        }

        .faq-item.open .a {
            display: block;
        }

        .faq-item.open .q i {
            transform: rotate(180deg);
        }

        /* ===== RELATED PRODUCTS ===== */
        .related-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 6px 0;
        }

                .related-card {
            background: #fff;
            border-radius: 16px;
            padding: 14px 12px;
            border: 1px solid #e2e8f0;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #0f172a;
        }

        .related-card:hover {
            transform: translateY(-4px);
            border-color: #0ea5e9;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .related-card .img-wrap {
            width: 100%;
            aspect-ratio: 1.2 / 1;
            border-radius: 12px;
            background: #f1f5f9;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .related-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-card .name {
            font-size: 12px;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .related-card .price {
            font-size: 13px;
            font-weight: 700;
            color: #0ea5e9;
            margin-top: 2px;
        }

        /* ===== INSTALLATION PROCESS ===== */
        .install-steps {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 11px;
            color: #64748b;
            flex-wrap: wrap;
            gap: 4px;
        }

        .install-steps .step {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f8fafc;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .install-steps .step i {
            color: #0ea5e9;
            font-size: 12px;
        }

        .install-steps .arrow {
            color: #cbd5e1;
        }

        /* ===== HELP SECTION ===== */
        .help-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 18px;
            margin: 14px 0;
            text-align: center;
        }

        .help-section .title {
            font-weight: 700;
            font-size: 15px;
            color: #0f172a;
        }

        .help-section p {
            font-size: 12px;
            color: #64748b;
            margin: 4px 0 10px 0;
        }

        .help-section .help-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .help-section .help-buttons a {
            padding: 8px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            transition: 0.3s;
        }

        .help-section .help-buttons .wa {
            background: #25D366;
            color: #fff;
        }

        .help-section .help-buttons .wa:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
        }

        .help-section .help-buttons .call {
            background: #0ea5e9;
            color: #fff;
        }

        .help-section .help-buttons .call:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.3);
        }

        /* ===== NOTICE ===== */
        .notice-box {
            border-radius: 14px;
            padding: 14px 18px;
            margin: 12px 0;
            border-left: 4px solid;
        }

        .notice-box.info {
            background: #f0f9ff;
            border-color: #0ea5e9;
        }

        .notice-box.warning {
            background: #fef3c7;
            border-color: #f59e0b;
        }

        .notice-box.success {
            background: #d1fae5;
            border-color: #22c55e;
        }

        .notice-box .title {
            font-weight: 600;
            font-size: 13px;
            color: #0f172a;
        }

        .notice-box p {
            font-size: 12px;
            color: #475569;
            margin-top: 2px;
        }

        /* ===== FOOTER LINKS ===== */
        .footer-links {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 14px;
        }

        .footer-links a {
            font-size: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .footer-links a:hover {
            color: #0ea5e9;
        }

        // ============================================================

        window.changeSlide = function(direction) {
            const track = document.getElementById('sliderTrack');
            if (!track) return;
            const slides = track.querySelectorAll('.slider-slide');
            if (!slides.length) return;
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            track.style.transform = `translateX(-${currentSlide * (100 / slides.length)}%)`;
            document.querySelectorAll('.slider-dots .dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        };

        window.goToSlide = function(index) {
            const track = document.getElementById('sliderTrack');
            if (!track) return;
            const slides = track.querySelectorAll('.slider-slide');
            if (!slides.length) return;
            currentSlide = index;
            track.style.transform = `translateX(-${currentSlide * (100 / slides.length)}%)`;
            document.querySelectorAll('.slider-dots .dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        };

            document.querySelectorAll('.colour-selector .colour').forEach(c => c.classList.remove('active'));

            console.log('Selected colour:', colour);
        };

        window.selectType = function(el, type) {
            document.querySelectorAll('.type-selector .type').forEach(t => t.classList.remove('active'));

        };
