        }

        function renderProduct(product) {
            const isOnline = product.onlinePurchase !== false;
            const ctaText = isOnline ? '🛒 Buy Online' : '📅 Book Appointment';
            const ctaClass = isOnline ? 'btn-success' : 'btn-primary';

            const images = productImages[product.id] || productImages['default'];

            // Specifications
            const specs = product.specs || {

            const specHtml = Object.entries(specs).map(([key, val]) =>

            const colourHtml = colours.map(c => {

            }).join('');

            const typeHtml = types.map(t =>
                `<span class="type ${t === types[0] ? 'active' : ''}" onclick="selectType(this, '${t}')">${t}</span>`

            const applicationHtml = applications.map(a =>
                `<span style="background:#f1f5f9; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:500; color:#1a1a2e; display:inline-block; margin:2px;">${a}</span>`
            ).join('');

            const relatedHtml = related.map(r =>
                `<a href="product-detail.html?id=${r.id}" class="related-card">
                    <span class="icon"><i class="${r.image || 'fas fa-box'}"></i></span>
                    <span class="name">${r.name}</span>
                </a>`
            ).join('');

            const faqHtml = faqs.map((f, i) =>
                `<div class="faq-item ${i === 0 ? 'open' : ''}" onclick="toggleFaq(this)">
                    <div class="q"><span>${f.q}</span><i class="fas fa-chevron-down"></i></div>

            const discountHtml = product.discount ?
                `<span class="discount-badge">${product.discount}% OFF</span>` : '';
            const originalHtml = product.originalPrice ?
                `<span class="original">₹${product.originalPrice}</span>` : '';

            document.getElementById('mainContent').innerHTML = `
                <div class="breadcrumb">
                    <a href="index.html">Home</a><span class="sep">›</span>
                    <a href="products.html">Products</a><span class="sep">›</span>
                    <span>${product.name}</span>
                </div>

                <div class="product-hero">
                    <div class="badge-row">
                        <span class="tag tag-${badgeClass}">${product.category || 'Product'}</span>
                        ${isOnline ? '<span class="tag tag-velcro" style="background:#d1fae5; color:#059669;">Buy Online</span>' : '<span class="tag tag-frame" style="background:#fef3c7; color:#d97706;">Book Appointment</span>'}
                    </div>
                    <h1>${product.name}</h1>
                    <div class="sub">${product.variant || ''}</div>
                </div>

                <div class="slider-container">
                    <div class="slider-track" id="sliderTrack">
                        ${slides.map((s, i) => `
                            <div class="slider-slide">
                                ${s.src.startsWith('fas') ? `<i class="${s.src}"></i>` : `<img src="${s.src}" alt="${s.alt}" style="width:100%;height:100%;object-fit:cover;" />`}
                            </div>
                        `).join('')}
                    </div>

                    <button class="slider-btn next" onclick="changeSlide(1)"><i class="fas fa-chevron-right"></i></button>
                    <div class="slider-dots">
                        ${slides.map((_, i) => `<button class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></button>`).join('')}
                    </div>
                </div>

                <div class="price-section">
                    <span class="current">₹${product.price} <span class="unit">/ ${product.unit || 'sq.ft'}</span></span>
                    ${originalHtml}
                    ${discountHtml}
                </div>
                                <div class="cta-row">
                    <button class="btn ${ctaClass}" onclick="handlePrimaryCta()">${ctaText}</button>
                    <button class="btn btn-secondary" onclick="window.location.href='https://wa.me/919483037385?text=Hi%2C%20I%20want%20to%20know%20about%20${encodeURIComponent(product.name)}'"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                </div>

                ${isOnline ? `
                    <div style="background:#f1f5f9; border-radius:16px; padding:16px; margin:12px 0;">
                        <div style="font-weight:700; font-size:14px; margin-bottom:8px;">🛒 Quick Purchase</div>
                        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                            <input type="number" id="qtyInput" value="1" min="1" style="width:60px; padding:8px; border:1px solid #e8ecf0; border-radius:12px; text-align:center; font-size:14px;" />
                            <button class="btn btn-success" style="flex:1; padding:10px 20px; border-radius:40px; font-weight:700; font-size:13px; border:none; color:#fff; background:linear-gradient(145deg,#22c55e,#16a34a); cursor:pointer;" onclick="addToCart()">Add to Cart</button>
                            <button class="btn btn-primary" style="flex:1; padding:10px 20px; border-radius:40px; font-weight:700; font-size:13px; border:none; color:#fff; background:linear-gradient(145deg,#0ea5e9,#0284c7); cursor:pointer;" onclick="buyNow()">Buy Now</button>
                        </div>
                    </div>
                ` : `
                    <div style="background:#fef3c7; border-radius:16px; padding:12px 16px; margin:12px 0; border-left:4px solid #f59e0b;">
                        <span style="font-size:13px; color:#1a1a2e;">📐 This product requires professional measurement and installation.</span>
                        <span style="font-size:12px; color:#6b6b7b; display:block; margin-top:2px;">Click "Book Appointment" to schedule a site visit.</span>
                    </div>
                `}

                <div class="section-title"><i class="fas fa-info-circle"></i> Description</div>
                <p style="font-size:13px; color:#4a4a5a; line-height:1.7;">${product.description || product.longDescription || 'Premium quality mosquito net from Raj Marketing Mysore.'}</p>
                ${product.longDescription ? `<p style="font-size:13px; color:#4a4a5a; line-height:1.7; margin-top:6px;">${product.longDescription}</p>` : ''}

                <div class="section-title"><i class="fas fa-list"></i> Specifications</div>
                <table class="spec-table">${specHtml}</table>

                <div class="section-title"><i class="fas fa-palette"></i> Frame Colour</div>
                <div class="colour-selector">${colourHtml}</div>

                <div class="section-title"><i class="fas fa-layer-group"></i> Type</div>
                <div class="type-selector">${typeHtml}</div>

                <div class="section-title"><i class="fas fa-star"></i> Benefits</div>
                <div class="benefit-grid">${benefitHtml}</div>

                <div class="section-title"><i class="fas fa-check-circle"></i> Best For</div>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">${applicationHtml}</div>

                <div class="section-title"><i class="fas fa-cogs"></i> Installation Process</div>
                <div style="display:flex; justify-content:space-between; padding:8px 0; font-size:12px; color:#6b6b7b;">
                    <span>1. Book Appointment</span><span>→</span>
                    <span>2. Site Measurement</span><span>→</span>
                    <span>3. Product Confirmation</span><span>→</span>
                    <span>4. Manufacturing</span><span>→</span>
                    <span>5. Installation</span>
                </div>

                <div class="section-title"><i class="fas fa-question-circle"></i> FAQs</div>
                ${faqHtml}

                <div class="section-title"><i class="fas fa-link"></i> You May Also Like</div>
                <div class="related-grid">${relatedHtml || '<div style="grid-column:1/-1; text-align:center; color:#6b6b7b; font-size:13px;">No related products found.</div>'}</div>

                <div style="background:#f1f5f9; border-radius:16px; padding:16px; margin:12px 0; text-align:center;">
                    <div style="font-weight:700; font-size:14px; color:#1a1a2e;">Need Help?</div>
                    <p style="font-size:12px; color:#6b6b7b;">Call us at <a href="tel:9483037385" style="color:#0ea5e9; text-decoration:none; font-weight:600;">9483037385</a></p>
                    <div style="display:flex; gap:10px; justify-content:center; margin-top:8px;">
                        <a href="https://wa.me/919483037385" target="_blank" style="background:#25D366; color:#fff; padding:8px 20px; border-radius:30px; text-decoration:none; font-weight:600; font-size:12px;"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                        <a href="tel:9483037385" style="background:#0ea5e9; color:#fff; padding:8px 20px; border-radius:30px; text-decoration:none; font-weight:600; font-size:12px;"><i class="fas fa-phone"></i> Call</a>
                    </div>
                </div>

                <div class="footer-links">
                    <a href="index.html">Home</a>| <a href="about.html">About</a>| <a href="contact.html">Contact</a>| <a href="terms.html">Terms</a>| <a href="privacy.html">Privacy</a>
                </div>
                <div class="footer-copyright">© 2026 Raj Marketing Mysore</div>
            `;

            // Update sticky bottom
            const sticky = document.getElementById('stickyBottom');
            sticky.style.display = 'block';
            document.getElementById('stickyPrice').textContent = `₹${product.price}/sq.ft`;
            document.getElementById('stickyCta').textContent = isOnline ? '🛒 Buy Online' : '📅 Book Appointment';
            document.getElementById('stickyCta').className = `btn ${isOnline ? 'btn-success' : 'btn-primary'}`;

            // Update SEO metadata
            document.title = `${product.name} – Raj Marketing Mysore`;
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) {
                metaDesc.content = `${product.name}. ${product.description || 'Premium mosquito net from Raj Marketing Mysore.'}`;
            }

            // Update page URL without reload
            if (window.history && window.history.pushState) {
                const newUrl = `/product-detail.html?id=${product.id}`;
                window.history.pushState({ productId: product.id }, '', newUrl);
            }

            // Set product in booking modal
            document.getElementById('bProduct').value = product.name;

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });

            console.log('✅ Product rendered:', product.name);
        }

        function getRelatedProducts(product) {
            const allProducts = Object.values(productData);
            const related = allProducts.filter(p => p.id !== product.id && p.category === product.category);
            return related.slice(0, 4);
        }

        // ============================================================
        // SLIDER FUNCTIONS
        // ============================================================
        window.changeSlide = function(direction) {
            const track = document.getElementById('sliderTrack');
            if (!track) return;
            const slides = track.querySelectorAll('.slider-slide');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            track.style.transform = `translateX(-${currentSlide * (100 / slides.length)}%)`;
            document.querySelectorAll('.slider-dots .dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        };

        window.goToSlide = function(index) {
            const track = document.getElementById('sliderTrack');
            if (!track) return;
            const slides = track.querySelectorAll('.slider-slide');
            currentSlide = index;
            track.style.transform = `translateX(-${currentSlide * (100 / slides.length)}%)`;
            document.querySelectorAll('.slider-dots .dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        };

        // ============================================================
        // COLOUR & TYPE SELECTORS
        // ============================================================
        window.selectColour = function(el, colour) {
            document.querySelectorAll('.colour-selector .colour').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            console.log('Selected colour:', colour);
        };

        window.selectType = function(el, type) {
            document.querySelectorAll('.type-selector .type').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            console.log('Selected type:', type);
        };

        // ============================================================
        // FAQ TOGGLE
        // ============================================================
        window.toggleFaq = function(el) {
            el.classList.toggle('open');
        };

        // ============================================================
        // CTA HANDLERS
        // ============================================================
        window.handlePrimaryCta = function() {
            if (currentProduct && currentProduct.onlinePurchase !== false) {
                // Velcro - Buy Online
                const qty = document.getElementById('qtyInput')?.value || 1;
                alert(`🛒 Buy Online: ${currentProduct.name}\nPrice: ₹${currentProduct.price}/sq.ft\nQuantity: ${qty}\n\nThis will redirect to checkout.`);
            } else {
                // Book Appointment
                document.getElementById('bookingModal').classList.add('active');
            }
        };

        window.addToCart = function() {
            const qty = document.getElementById('qtyInput')?.value || 1;
            alert(`🛒 Added to cart:\n${currentProduct.name}\n₹${currentProduct.price}/sq.ft × ${qty}\nTotal: ₹${currentProduct.price * qty}`);
        };

        window.buyNow = function() {
            const qty = document.getElementById('qtyInput')?.value || 1;
            alert(`🛒 Buy Now:\n${currentProduct.name}\n₹${currentProduct.price}/sq.ft × ${qty}\nTotal: ₹${currentProduct.price * qty}\n\nRedirecting to checkout...`);
        };

        // ============================================================
        // BOOKING SUBMIT
        // ============================================================
        window.submitBooking = async function(e) {
            e.preventDefault();
            const name = document.getElementById('bName').value.trim();
            const mobile = document.getElementById('bMobile').value.trim();

            if (!name || !mobile) {
                alert('Please enter your name and mobile number.');
                return;
            }

            const data = {
                customerName: name,
                mobile: mobile,
                whatsapp: document.getElementById('bWhatsapp').value.trim(),
                address: document.getElementById('bAddress').value.trim(),
                product: document.getElementById('bProduct').value,
                date: document.getElementById('bDate').value,
                time: document.getElementById('bTime').value,
                windows: parseInt(document.getElementById('bWindows').value) || 1,
                doors: parseInt(document.getElementById('bDoors').value) || 0,
                message: document.getElementById('bMessage').value.trim(),
                source: 'Product Page',
                status: 'NEW',
                createdAt: serverTimestamp ? serverTimestamp() : new Date().toISOString()
            };

            try {
                await addDoc(collection(db, 'appointments'), data);
                alert('✅ Appointment request received successfully! Our team will contact you to confirm.');
                closeModal('bookingModal');
            } catch (error) {
                console.error('Booking error:', error);
                alert('❌ Failed to submit booking. Please try again or call us directly.');
            }
        };

        // ============================================================
        // MODAL
        // ============================================================
        window.closeModal = function(id) {
            document.getElementById(id).classList.remove('active');
        };

        // ============================================================
        // INIT
        // ============================================================
        loadProduct();

        // Listen for back/forward navigation
        window.addEventListener('popstate', function(e) {
            if (e.state && e.state.productId) {
                loadProduct();
            }
        });

        console.log('✅ Product detail page loaded');
    </script>
