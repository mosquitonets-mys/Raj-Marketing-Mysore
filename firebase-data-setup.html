<html lang="en">
<head>
    <meta charset="UTF-8" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; background: #fff; border-radius: 24px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); }
        h1 { font-size: 24px; margin-bottom: 4px; color: #1a1a2e; }
        .subtitle { color: #6b6b7b; margin-bottom: 20px; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .btn { padding: 12px 24px; border-radius: 40px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-primary { background: #0ea5e9; color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(14,165,233,0.3); }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(239,68,68,0.3); }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(34,197,94,0.3); }
        .status { padding: 12px 16px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
        .status.success { background: #d1fae5; color: #065f46; border-left: 4px solid #22c55e; }
        .status.error { background: #fee2e2; color: #991b1b; border-left: 4px solid #dc2626; }
        .status.info { background: #dbeafe; color: #1d4ed8; border-left: 4px solid #0ea5e9; }
        .section { margin-bottom: 20px; padding: 16px; background: #f8fafc; border-radius: 12px; border: 1px solid #e8ecf0; }
        .section h3 { font-size: 15px; margin-bottom: 8px; color: #0ea5e9; display: flex; align-items: center; gap: 8px; }
        .section .count { font-size: 12px; color: #6b6b7b; font-weight: 400; }
        pre { background: #1a1a2e; color: #e8ecf0; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 11px; line-height: 1.5; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; }
        .stat-card { background: #fff; border-radius: 12px; padding: 14px; text-align: center; border: 1px solid #e8ecf0; }
        .stat-card .num { font-size: 24px; font-weight: 800; color: #0ea5e9; }
        .stat-card .label { font-size: 11px; color: #6b6b7b; }
        .loading { text-align: center; padding: 20px; color: #6b6b7b; }
        @media (max-width: 500px) { .container { padding: 16px; } .btn { width: 100%; text-align: center; } }
    </style>
</head>
<body>
    <div class="container">

        <div id="status"></div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="setupAll()">🚀 Setup All Data</button>
            <button class="btn btn-success" onclick="setupCustomer()">👤 Setup Customer</button>
            <button class="btn btn-success" onclick="setupProducts()">📦 Setup Products</button>
            <button class="btn btn-danger" onclick="clearAll()">🗑️ Clear All</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="num" id="statProducts">0</div><div class="label">Products</div></div>
            <div class="stat-card"><div class="num" id="statCustomers">0</div><div class="label">Customers</div></div>
            <div class="stat-card"><div class="num" id="statOffers">0</div><div class="label">Offers</div></div>
            <div class="stat-card"><div class="num" id="statOrders">0</div><div class="label">Orders</div></div>
            <div class="stat-card"><div class="num" id="statAppointments">0</div><div class="label">Appointments</div></div>
        </div>

        <!-- Data Preview -->
        <div class="section">
            <h3>📦 Products <span class="count" id="productCount">(0)</span></h3>
            <pre id="productsData">Loading...</pre>
        </div>

        <div class="section">
            <h3>👤 Customers <span class="count" id="customerCount">(0)</span></h3>
            <pre id="customersData">Loading...</pre>
        </div>

        <div class="section">
            <h3>🏷️ Offers <span class="count" id="offerCount">(0)</span></h3>
            <pre id="offersData">Loading...</pre>
        </div>

        <div class="section">
            <h3>📦 Orders <span class="count" id="orderCount">(0)</span></h3>
            <pre id="ordersData">Loading...</pre>
        </div>
    </div>

    <script type="module">

        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_a91sI0xpFRX5_ti2ukM8Ybn2lMXS6Zw",
            authDomain: "raj-marketing-mysore-f91f7.firebaseapp.com",
            projectId: "raj-marketing-mysore-f91f7",
            storageBucket: "raj-marketing-mysore-f91f7.firebasestorage.app",
            messagingSenderId: "534782698781",
            appId: "1:534782698781:web:bad9454adb5d2ad1e7edf4",
            measurementId: "G-P95PHHGV2M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ============================================================
        // COMPLETE PRODUCT DATA
        // ============================================================
        const PRODUCTS = [
            { id: 'velcro-economic', name: 'Velcro System – Economic', category: 'Velcro', variant: 'Economic', price: 65, originalPrice: null, discount: null, unit: 'sq.ft', onlinePurchase: true, description: 'Economical Velcro mosquito net for windows and doors.', image: 'fas fa-vector-square', badge: 'velcro', active: true, featured: true },
            { id: 'velcro-premium', name: 'Velcro System – Premium Saint-Gobain', category: 'Velcro', variant: 'Premium Saint-Gobain', price: 80, originalPrice: null, discount: null, unit: 'sq.ft', onlinePurchase: true, description: 'Premium Saint-Gobain Velcro mosquito net.', image: 'fas fa-vector-square', badge: 'velcro', active: true, featured: true },
            { id: 'aluminium-black-ss', name: 'Aluminium Frame – Black Coated SS Mesh', category: 'Aluminium Frame', variant: 'Regular + Black Coated SS Mesh', price: 200, originalPrice: null, discount: null, unit: 'sq.ft', onlinePurchase: false, description: 'Strong aluminium frame with black coated SS mesh.', image: 'fas fa-border-all', badge: 'frame', active: true, featured: true },
            { id: 'aluminium-bright-ss', name: 'Aluminium Frame – Bright SS 304 Mesh', category: 'Aluminium Frame', variant: 'Regular + Bright SS 304 Mesh', price: 220, originalPrice: null, discount: null, unit: 'sq.ft', onlinePurchase: false, description: 'Premium aluminium frame with bright SS 304 mesh.', image: 'fas fa-border-all', badge: 'frame', active: true, featured: true },
            { id: 'aluminium-teakwood', name: 'Premium Teakwood – Black Coated SS Mesh', category: 'Premium Aluminium', variant: 'Teakwood + Black Coated SS Mesh', price: 300, originalPrice: null, discount: null, unit: 'sq.ft', onlinePurchase: false, description: 'Premium teakwood finish aluminium frame.', image: 'fas fa-crown', badge: 'premium', active: true, featured: true },
            { id: 'pleated-gold', name: 'Pleated Mesh – Gold Detachable', category: 'Pleated', variant: '32mm Single', price: 380, originalPrice: 420, discount: 10, unit: 'sq.ft', onlinePurchase: false, description: 'Premium gold pleated mosquito net.', image: 'fas fa-wind', badge: 'pleated', active: true, featured: true },
            { id: 'pleated-platinum', name: 'Pleated SS Mesh – Platinum Detachable', category: 'Pleated', variant: '25mm Single', price: 500, originalPrice: null, discount: null, unit: 'sq.ft', onlinePurchase: false, description: 'Premium platinum SS mesh pleated net.', image: 'fas fa-wind', badge: 'pleated', active: true, featured: true },
            { id: 'mesh-door-black', name: 'Mesh Door – Black Coated SS Mesh', category: 'Mesh Door', variant: 'Regular + Black Coated SS Mesh', price: 350, originalPrice: null, discount: null, unit: 'sq.ft', onlinePurchase: false, description: 'Durable mesh door with black coated SS mesh.', image: 'fas fa-door-open', badge: 'door', active: true, featured: true },
            { id: 'mesh-door-bright', name: 'Mesh Door – Bright SS 304 Mesh', category: 'Mesh Door', variant: 'Regular + Bright SS 304 Mesh', price: 380, originalPrice: null, discount: null, unit: 'sq.ft', onlinePurchase: false, description: 'Premium mesh door with bright SS 304 mesh.', image: 'fas fa-door-open', badge: 'door', active: true, featured: true }
        ];

        // ============================================================
        // SAMPLE CUSTOMER
        // ============================================================
        const SAMPLE_CUSTOMER = {
            customerId: "RM-CUS-20260817-4013",
            name: "Madhu",
            mobile: "9353673202",
            phone: "9353673202",
            whatsapp: "9353673202",
            email: "madhu@example.com",
            address: "123, MG Road, Mysore",
            landmark: "Near City Centre",
            city: "Mysore",
            district: "Mysore",
            state: "Karnataka",
            pin: "570001",
            source: "Website",
            status: "Active",
            referralCode: "RAJ-REF-001",
            profileImageUrl: "",
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };

        // ============================================================
        // SAMPLE OFFERS
        // ============================================================
        const OFFERS = [
            { id: 'offer-1', name: 'Summer Special', description: '20% off on all Pleated Nets', product: 'Pleated', discount: 20, originalPrice: 380, offerPrice: 304, validUntil: '2026-09-30', active: true, tag: 'discount' },
            { id: 'offer-2', name: 'Dealer Launch Offer', description: '10% off on Aluminium Frame Systems', product: 'Aluminium Frame', discount: 10, originalPrice: 220, offerPrice: 198, validUntil: '2026-09-15', active: true, tag: 'limited' },
            { id: 'offer-3', name: 'Velcro Bundle Deal', description: 'Buy 2 get 5% off on Velcro Systems', product: 'Velcro', discount: 5, originalPrice: 65, offerPrice: 61.75, validUntil: '2026-10-01', active: true, tag: 'exclusive' }
        ];

        // ============================================================
        // SAMPLE ORDER
        // ============================================================
        const SAMPLE_ORDER = {
            orderId: "ORD-20260817-4821",
            customerId: "RM-CUS-20260817-4013",
            customerName: "Madhu",
            mobile: "9353673202",
            product: "Velcro Economic",
            sqft: 20,
            rate: 65,
            totalAmount: 1300,
            advanceAmount: 780,
            balanceAmount: 520,
            orderStatus: "NEW",
            productionStatus: "PENDING",
            paymentStatus: "PENDING",
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };

        // ============================================================
        // SAMPLE APPOINTMENT
        // ============================================================
        const SAMPLE_APPOINTMENT = {
            appointmentId: "APT-20260817-001",
            customerId: "RM-CUS-20260817-4013",
            customerName: "Madhu",
            mobile: "9353673202",
            product: "Aluminium Frame",
            date: "2026-08-20",
            time: "Morning",
            address: "123, MG Road, Mysore",
            status: "NEW",
            source: "Website",
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };

        // ============================================================
        // UI FUNCTIONS
        // ============================================================
        function showStatus(message, type = 'info') {
            const div = document.getElementById('status');
            div.className = `status ${type}`;
            div.textContent = message;
        }

        async function updateStats() {
            try {
                const productSnap = await getDocs(collection(db, 'products'));
                const customerSnap = await getDocs(collection(db, 'customers'));
                const offerSnap = await getDocs(collection(db, 'offers'));
                const orderSnap = await getDocs(collection(db, 'orders'));
                const apptSnap = await getDocs(collection(db, 'appointments'));

                document.getElementById('statProducts').textContent = productSnap.size;
                document.getElementById('statCustomers').textContent = customerSnap.size;
                document.getElementById('statOffers').textContent = offerSnap.size;
                document.getElementById('statOrders').textContent = orderSnap.size;
                document.getElementById('statAppointments').textContent = apptSnap.size;

                document.getElementById('productCount').textContent = `(${productSnap.size})`;
                document.getElementById('customerCount').textContent = `(${customerSnap.size})`;
                document.getElementById('offerCount').textContent = `(${offerSnap.size})`;
                document.getElementById('orderCount').textContent = `(${orderSnap.size})`;
            } catch (e) { console.error('Stats error:', e); }
        }

        async function loadPreviews() {
            try {
                const productSnap = await getDocs(collection(db, 'products'));
                if (productSnap.size > 0) {
                    const data = [];
                    productSnap.forEach(doc => data.push(doc.data()));
                    document.getElementById('productsData').textContent = JSON.stringify(data.slice(0, 5), null, 2) + (data.length > 5 ? `\n... and ${data.length - 5} more` : '');
                } else {
                    document.getElementById('productsData').textContent = '⚠️ No products found. Run setup.';
                }

                const customerSnap = await getDocs(collection(db, 'customers'));
                if (customerSnap.size > 0) {
                    const data = [];
                    customerSnap.forEach(doc => data.push(doc.data()));
                    document.getElementById('customersData').textContent = JSON.stringify(data.slice(0, 3), null, 2) + (data.length > 3 ? `\n... and ${data.length - 3} more` : '');
                } else {
                    document.getElementById('customersData').textContent = '⚠️ No customers found. Run setup.';
                }

                const offerSnap = await getDocs(collection(db, 'offers'));
                if (offerSnap.size > 0) {
                    const data = [];
                    offerSnap.forEach(doc => data.push(doc.data()));
                    document.getElementById('offersData').textContent = JSON.stringify(data, null, 2);
                } else {
                    document.getElementById('offersData').textContent = '⚠️ No offers found. Run setup.';
                }

                const orderSnap = await getDocs(collection(db, 'orders'));
                if (orderSnap.size > 0) {
                    const data = [];
                    orderSnap.forEach(doc => data.push(doc.data()));
                    document.getElementById('ordersData').textContent = JSON.stringify(data.slice(0, 3), null, 2) + (data.length > 3 ? `\n... and ${data.length - 3} more` : '');
                } else {
                    document.getElementById('ordersData').textContent = '⚠️ No orders found. Run setup.';
                }

                await updateStats();
            } catch (e) {
                console.error('Preview error:', e);
            }
        }

        // ============================================================
        // SETUP FUNCTIONS
        // ============================================================
        window.setupAll = async function() {
            showStatus('⏳ Setting up all data...', 'info');
            try {
                await clearCollection('products');
                await clearCollection('offers');
                await clearCollection('orders');
                await clearCollection('appointments');

                // Products
                const productBatch = writeBatch(db);
                for (const p of PRODUCTS) {
                    const ref = doc(db, 'products', p.id);
                    productBatch.set(ref, { ...p, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
                }
                await productBatch.commit();

                // Offers
                const offerBatch = writeBatch(db);
                for (const o of OFFERS) {
                    const ref = doc(db, 'offers', o.id);
                    offerBatch.set(ref, { ...o, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
                }
                await offerBatch.commit();

                // Orders
                const orderRef = doc(db, 'orders', SAMPLE_ORDER.orderId);
                await setDoc(orderRef, SAMPLE_ORDER);

                // Appointments
                const apptRef = doc(db, 'appointments', SAMPLE_APPOINTMENT.appointmentId);
                await setDoc(apptRef, SAMPLE_APPOINTMENT);

                // Customers (if not exists)
                const custRef = doc(db, 'customers', SAMPLE_CUSTOMER.customerId);
                await setDoc(custRef, SAMPLE_CUSTOMER);

                showStatus('✅ All data initialized successfully!', 'success');
                await loadPreviews();

            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
                console.error('Setup error:', error);
            }
        };

        window.setupProducts = async function() {
            showStatus('⏳ Setting up products...', 'info');
            try {
                await clearCollection('products');
                const batch = writeBatch(db);
                for (const p of PRODUCTS) {
                    const ref = doc(db, 'products', p.id);
                    batch.set(ref, { ...p, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
                }
                await batch.commit();
                showStatus(`✅ ${PRODUCTS.length} products created!`, 'success');
                await loadPreviews();
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        };

        window.setupCustomer = async function() {
            showStatus('⏳ Setting up customer...', 'info');
            try {
                const ref = doc(db, 'customers', SAMPLE_CUSTOMER.customerId);
                await setDoc(ref, SAMPLE_CUSTOMER);
                showStatus('✅ Customer created!', 'success');
                await loadPreviews();
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        };

        window.clearAll = async function() {
            if (!confirm('⚠️ This will delete ALL data from Firestore. Are you sure?')) return;
            showStatus('⏳ Clearing data...', 'info');
            try {
                const collections = ['products', 'customers', 'offers', 'orders', 'appointments', 'estimates', 'payments', 'referrals', 'feedback', 'supportTickets'];
                for (const name of collections) {
                    await clearCollection(name);
                }
                showStatus('✅ All data cleared!', 'success');
                await loadPreviews();
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        };

        async function clearCollection(name) {
            try {
                const snapshot = await getDocs(collection(db, name));
                const batch = writeBatch(db);
                snapshot.forEach(doc => batch.delete(doc.ref));
                if (snapshot.size > 0) await batch.commit();
                console.log(`✅ Cleared ${name} (${snapshot.size} documents)`);
            } catch (e) {
                console.log(`ℹ️ Collection ${name} may not exist`);
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        loadPreviews();
        console.log('✅ Firebase data setup loaded');
    </script>
</body>
</html>
