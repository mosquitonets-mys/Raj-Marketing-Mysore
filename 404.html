<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Raj Marketing Mysore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
        }
        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #2563EB;
            line-height: 1;
        }
        .error-icon {
            font-size: 60px;
            color: #F59E0B;
            margin: 10px 0;
        }
        h1 {
            font-size: 24px;
            color: #0F172A;
            margin-bottom: 8px;
        }
        p {
            color: #64748B;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .btn-home {
            display: inline-block;
            background: #2563EB;
            color: #FFFFFF;
            padding: 12px 32px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-home:hover {
            background: #0F172A;
            transform: translateY(-2px);
        }
        .links {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: #2563EB;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-icon"><i class="fas fa-map-signs"></i></div>
        <h1>Page Not Found</h1>
        <p>Oops! The page you're looking for doesn't exist or has been moved.</p>
        <a href="index.html" class="btn-home"><i class="fas fa-home"></i> Back to Home</a>
        <div class="links">
            <a href="products.html">Products</a>
            <a href="estimate.html">Get Estimate</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>
</body>
</html>
