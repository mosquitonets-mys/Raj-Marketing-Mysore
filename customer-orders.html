<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Raj Marketing · My Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; display: flex; justify-content: center; min-height: 100vh; padding: 0 12px; padding-top: 70px; padding-bottom: 100px; }
        .app-container { max-width: 480px; width: 100%; background: #fff; border-radius: 32px; padding: 18px 16px 20px; border: 1px solid #e8ecf0; }

        .fixed-header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; max-width: 504px; margin: 0 auto; width: 100%; background: #fff; padding: 8px 16px; border-bottom: 1px solid #e8ecf0; display: flex; justify-content: space-between; align-items: center; }
        .fixed-header .logo-area { display: flex; align-items: center; gap: 8px; }
        .fixed-header .logo-icon { width: 32px; height: 32px; background: linear-gradient(145deg, #0ea5e9, #0284c7); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
        .fixed-header .logo-text { font-weight: 700; font-size: 14px; color: #1a1a2e; line-height: 1.1; }
        .fixed-header .logo-text span { display: block; font-weight: 400; font-size: 8px; color: #6b6b7b; }
        .fixed-header .header-actions { display: flex; gap: 6px; align-items: center; }
        .fixed-header .header-btn { display: flex; flex-direction: column; align-items: center; padding: 4px 6px; border-radius: 8px; border: none; background: transparent; color: #6b6b7b; font-size: 11px; cursor: pointer; text-decoration: none; min-width: 40px; transition: 0.2s; }
        .fixed-header .header-btn i { font-size: 16px; display: block; margin-bottom: 1px; }
        .fixed-header .header-btn .label { font-size: 7px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; opacity: 0.7; }
        .fixed-header .header-btn:hover { background: #f0f9ff; color: #0ea5e9; }

        .fixed-footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; max-width: 504px; margin: 0 auto; width: 100%; background: #fff; padding: 6px 12px 10px; border-top: 1px solid #e8ecf0; display: flex; justify-content: space-around; align-items: center; border-radius: 30px 30px 0 0; }
        .fixed-footer .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 8px; color: #6b6b7b; font-weight: 500; gap: 1px; padding: 4px 10px; border-radius: 20px; text-decoration: none; transition: 0.2s; }
        .fixed-footer .nav-item i { font-size: 18px; color: #6b6b7b; }
        .fixed-footer .nav-item.active i { color: #0ea5e9; }
        .fixed-footer .nav-item.active { color: #0ea5e9; background: #f0f9ff; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .page-header h1 { font-size: 20px; font-weight: 800; color: #1a1a2e; }
        .page-header .count { font-size: 12px; color: #6b6b7b; background: #f0f9ff; padding: 2px 12px; border-radius: 20px; }

        .order-card { background: #fff; border-radius: 20px; padding: 16px; border: 1px solid #e8ecf0; margin-bottom: 12px; transition: 0.2s; }
        .order-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.04); border-color: #0ea5e9; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .order-header .id { font-weight: 700; font-size: 14px; color: #1a1a2e; }
        .order-header .date { font-size: 11px; color: #6b6b7b; }
        .order-status { padding: 2px 12px; border-radius: 20px; font-size: 10px; font-weight: 600; display: inline-block; }
        .status-new { background: #fff7ed; color: #ea580c; }
        .status-confirmed { background: #dbeafe; color: #1d4ed8; }
        .status-production { background: #dbeafe; color: #1d4ed8; }
        .status-ready { background: #d1fae5; color: #059669; }
        .status-completed { background: #d1fae5; color: #059669; }
        .status-cancelled { background: #fee2e2; color: #dc2626; }

        .order-product { font-size: 13px; color: #4a4a5a; padding: 4px 0; }
        .order-product .name { font-weight: 600; }
        .order-details { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #6b6b7b; margin-top: 6px; padding-top: 6px; border-top: 1px solid #f1f5f9; }
        .order-details .item { display: flex; gap: 4px; }
        .order-details .item .label { color: #6b6b7b; }
        .order-details .item .value { font-weight: 600; color: #1a1a2e; }

        .timeline { display: flex; justify-content: space-between; padding: 8px 0 4px; position: relative; }
        .timeline::before { content: ''; position: absolute; top: 14px; left: 10%; right: 10%; height: 2px; background: #e8ecf0; }
        .timeline .step { text-align: center; flex: 1; position: relative; z-index: 1; }
        .timeline .step .dot { width: 12px; height: 12px; border-radius: 50%; background: #e8ecf0; margin: 0 auto 2px; border: 2px solid #fff; box-shadow: 0 0 0 2px #e8ecf0; }
        .timeline .step.active .dot { background: #0ea5e9; box-shadow: 0 0 0 2px #0ea5e9; }
        .timeline .step.completed .dot { background: #22c55e; box-shadow: 0 0 0 2px #22c55e; }
        .timeline .step .label { font-size: 7px; color: #6b6b7b; }
        .timeline .step.active .label { color: #0ea5e9; font-weight: 600; }
        .timeline .step.completed .label { color: #22c55e; }

        .order-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1f5f9; }
        .order-actions .btn-sm { padding: 4px 14px; border-radius: 20px; font-size: 10px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-sm-primary { background: #0ea5e9; color: #fff; }
        .btn-sm-primary:hover { background: #0284c7; }
        .btn-sm-whatsapp { background: #25D366; color: #fff; }
        .btn-sm-whatsapp:hover { background: #1da851; }

        .empty-state { text-align: center; padding: 40px 20px; color: #6b6b7b; }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.4; }

        .whatsapp-float { position: fixed; bottom: 100px; right: 20px; background: #25D366; color: #fff; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 16px rgba(37,211,102,0.4); z-index: 999; text-decoration: none; }
        .whatsapp-float:hover { transform: scale(1.08); }

        .footer-links { margin-top: 16px; padding-top: 14px; border-top: 1px solid #e8ecf0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
        .footer-links a { font-size: 9px; color: #6b6b7b; text-decoration: none; }
        .footer-links a:hover { color: #0ea5e9; }
        .footer-copyright { font-size: 8px; color: #aaa; text-align: center; margin-top: 6px; }
        .loading-text { text-align: center; padding: 40px; color: #6b6b7b; }
        .loading-text i { font-size: 32px; display: block; margin-bottom: 12px; }

        @media (max-width: 400px) { .whatsapp-float { width: 48px; height: 48px; font-size: 24px; bottom: 90px; right: 16px; } }
    </style>
</head>
<body>

    <a href="https://wa.me/919483037385" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <header class="fixed-header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <div class="logo-text">Raj Marketing<span>Mysore</span></div>
        </div>
        <div class="header-actions">
            <a href="customer-dashboard.html" class="header-btn"><i class="fas fa-arrow-left"></i><span class="label">Back</span></a>
        </div>
    </header>

    <div class="app-container">
        <div class="page-header">
            <h1>📦 My Orders</h1>
            <span class="count" id="orderCount">0 Orders</span>
        </div>

        <div id="loadingState" class="loading-text">
            <i class="fas fa-spinner fa-spin"></i>
            Loading orders...
        </div>

        <div id="orderList" style="display:none;"></div>

        <div class="footer-links">
            <a href="index.html">Home</a>| <a href="about.html">About</a>| <a href="contact.html">Contact</a>| <a href="terms.html">Terms</a>| <a href="privacy.html">Privacy</a>
        </div>
        <div class="footer-copyright">© 2026 Raj Marketing Mysore</div>
    </div>

    <footer class="fixed-footer">
        <a href="customer-dashboard.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
        <a href="customer-products.html" class="nav-item"><i class="fas fa-th-large"></i> Products</a>
        <a href="customer-orders.html" class="nav-item active"><i class="fas fa-box"></i> Orders</a>
        <a href="customer-appointments.html" class="nav-item"><i class="fas fa-calendar-check"></i> Appointment</a>
        <a href="customer-profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
    </footer>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        let customerId = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "customer-login.html"; return; }
            await loadCustomerId(user.uid);
            await loadOrders();
        });

        async function loadCustomerId(uid) {
            try {
                const customersRef = collection(db, "customers");
                const q = query(customersRef, where("uid", "==", uid));
                const snapshot = await getDocs(q);
                if (!snapshot.empty) customerId = snapshot.docs[0].id;
            } catch (error) { console.error("Customer ID load error:", error); }
        }

        async function loadOrders() {
            if (!customerId) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('orderList').style.display = 'block';
                document.getElementById('orderList').innerHTML = `<div class="empty-state"><span class="icon">📦</span><h3 style="font-size:16px; font-weight:700;">No Orders Found</h3><p style="font-size:13px; margin-top:4px;">You haven't placed any orders yet.</p><a href="customer-products.html" style="color:#0ea5e9; text-decoration:none; font-weight:600; font-size:13px; display:inline-block; margin-top:8px;">Browse Products →</a></div>`;
                return;
            }

            try {
                const ordersRef = collection(db, "orders");
                const q = query(ordersRef, where("customerId", "==", customerId), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);

                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('orderList').style.display = 'block';

                if (snapshot.empty) {
                    document.getElementById('orderList').innerHTML = `<div class="empty-state"><span class="icon">📦</span><h3 style="font-size:16px; font-weight:700;">No Orders Found</h3><p style="font-size:13px; margin-top:4px;">You haven't placed any orders yet.</p><a href="customer-products.html" style="color:#0ea5e9; text-decoration:none; font-weight:600; font-size:13px; display:inline-block; margin-top:8px;">Browse Products →</a></div>`;
                    document.getElementById('orderCount').textContent = '0 Orders';
                    return;
                }

                const orders = [];
                snapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
                document.getElementById('orderCount').textContent = orders.length + ' Orders';

                document.getElementById('orderList').innerHTML = orders.map(o => {
                    const status = o.orderStatus || o.status || 'NEW';
                    const statusClass = status.toLowerCase().replace(/ /g, '');
                    const total = o.totalAmount || o.total || 0;
                    const advance = o.advanceAmount || o.advance || 0;
                    const balance = Math.max(total - advance, 0);
                    const date = o.createdAt?.toDate?.() || new Date(o.createdAt);
                    const dateStr = date ? date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';

                    const steps = ['NEW', 'CONFIRMED', 'PRODUCTION', 'READY', 'COMPLETED'];
                    const currentStep = steps.indexOf(status.toUpperCase());
                    const timelineHtml = steps.map((s, i) => {
                        const state = i < currentStep ? 'completed' : i === currentStep ? 'active' : '';
                        const label = s === 'PRODUCTION' ? 'Production' : s.charAt(0) + s.slice(1).toLowerCase();
                        return `<div class="step ${state}"><div class="dot"></div><span class="label">${label}</span></div>`;
                    }).join('');

                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <span class="id">${o.orderId || o.id}</span>
                                <span class="status status-${statusClass}">${status}</span>
                            </div>
                            <div class="order-header" style="font-size:11px; color:#6b6b7b; margin-top:-4px;">
                                <span>${dateStr}</span>
                                <span>Payment: ${o.paymentStatus || 'PENDING'}</span>
                            </div>
                            <div class="order-product"><span class="name">${o.product || '—'}</span> ${o.sqft ? `· ${o.sqft} sq.ft` : ''}</div>
                            <div class="order-details">
                                <span class="item"><span class="label">Total:</span> <span class="value">₹${total.toFixed(2)}</span></span>
                                <span class="item"><span class="label">Advance:</span> <span class="value">₹${advance.toFixed(2)}</span></span>
                                <span class="item"><span class="label">Balance:</span> <span class="value">₹${balance.toFixed(2)}</span></span>
                            </div>
                            <div class="timeline">${timelineHtml}</div>
                            <div class="order-actions">
                                <a href="customer-order-detail.html?id=${o.id}" class="btn-sm btn-sm-primary">View Details</a>
                                ${o.mobile ? `<a href="https://wa.me/91${String(o.mobile).replace(/\D/g,'')}" target="_blank" class="btn-sm btn-sm-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error("❌ Orders load error:", error);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('orderList').style.display = 'block';
                document.getElementById('orderList').innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><h3 style="font-size:16px; font-weight:700;">Unable to Load Orders</h3><p style="font-size:13px; margin-top:4px;">Please try again later.</p></div>`;
            }
        }
    </script>
</body>
    </html>
