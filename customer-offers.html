<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Raj Marketing · Offers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; display: flex; justify-content: center; min-height: 100vh; padding: 0 12px; padding-top: 70px; padding-bottom: 100px; }
        .app-container { max-width: 480px; width: 100%; background: #fff; border-radius: 32px; padding: 18px 16px 20px; border: 1px solid #e8ecf0; }

        .fixed-header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; max-width: 504px; margin: 0 auto; width: 100%; background: #fff; padding: 8px 16px; border-bottom: 1px solid #e8ecf0; display: flex; justify-content: space-between; align-items: center; }
        .fixed-header .logo-area { display: flex; align-items: center; gap: 8px; }
        .fixed-header .logo-icon { width: 32px; height: 32px; background: linear-gradient(145deg, #0ea5e9, #0284c7); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
        .fixed-header .logo-text { font-weight: 700; font-size: 14px; color: #1a1a2e; line-height: 1.1; }
        .fixed-header .logo-text span { display: block; font-weight: 400; font-size: 8px; color: #6b6b7b; }
        .fixed-header .header-actions { display: flex; gap: 6px; align-items: center; }
        .fixed-header .header-btn { display: flex; flex-direction: column; align-items: center; padding: 4px 6px; border-radius: 8px; border: none; background: transparent; color: #6b6b7b; font-size: 11px; cursor: pointer; text-decoration: none; min-width: 40px; transition: 0.2s; }
        .fixed-header .header-btn i { font-size: 16px; display: block; margin-bottom: 1px; }
        .fixed-header .header-btn .label { font-size: 7px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; opacity: 0.7; }
        .fixed-header .header-btn:hover { background: #f0f9ff; color: #0ea5e9; }

        .fixed-footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; max-width: 504px; margin: 0 auto; width: 100%; background: #fff; padding: 6px 12px 10px; border-top: 1px solid #e8ecf0; display: flex; justify-content: space-around; align-items: center; border-radius: 30px 30px 0 0; }
        .fixed-footer .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 8px; color: #6b6b7b; font-weight: 500; gap: 1px; padding: 4px 10px; border-radius: 20px; text-decoration: none; transition: 0.2s; }
        .fixed-footer .nav-item i { font-size: 18px; color: #6b6b7b; }
        .fixed-footer .nav-item.active i { color: #0ea5e9; }
        .fixed-footer .nav-item.active { color: #0ea5e9; background: #f0f9ff; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .page-header h1 { font-size: 20px; font-weight: 800; color: #1a1a2e; }
        .page-header .count { font-size: 12px; color: #6b6b7b; background: #f0f9ff; padding: 2px 12px; border-radius: 20px; }

        .offer-card { background: #fff; border-radius: 20px; padding: 16px; border: 1px solid #e8ecf0; margin-bottom: 12px; transition: 0.3s; position: relative; overflow: hidden; }
        .offer-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); border-color: #0ea5e9; transform: translateY(-2px); }
        .offer-card .offer-badge { position: absolute; top: 12px; right: 12px; background: #f97316; color: #fff; padding: 2px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; }
        .offer-card .offer-title { font-weight: 700; font-size: 16px; color: #1a1a2e; }
        .offer-card .offer-desc { font-size: 13px; color: #6b6b7b; margin: 4px 0 8px; }
        .offer-card .offer-price { font-size: 20px; font-weight: 800; color: #0ea5e9; }
        .offer-card .offer-original { font-size: 14px; color: #6b6b7b; text-decoration: line-through; margin-left: 8px; }
        .offer-card .offer-valid { font-size: 11px; color: #6b6b7b; margin-top: 4px; }
        .offer-card .offer-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1f5f9; }
        .offer-card .offer-actions .btn-sm { padding: 6px 16px; border-radius: 30px; font-size: 11px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-sm-primary { background: #0ea5e9; color: #fff; }
        .btn-sm-primary:hover { background: #0284c7; }
        .btn-sm-whatsapp { background: #25D366; color: #fff; }
        .btn-sm-whatsapp:hover { background: #1da851; }
        .btn-sm-outline { background: transparent; border: 1px solid #e8ecf0; color: #1a1a2e; }
        .btn-sm-outline:hover { background: #f1f5f9; }

        .offer-tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 9px; font-weight: 700; }
        .tag-discount { background: #d1fae5; color: #059669; }
        .tag-limited { background: #fef3c7; color: #d97706; }
        .tag-exclusive { background: #dbeafe; color: #1d4ed8; }

        .empty-state { text-align: center; padding: 40px 20px; color: #6b6b7b; }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.4; }

        .whatsapp-float { position: fixed; bottom: 100px; right: 20px; background: #25D366; color: #fff; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 16px rgba(37,211,102,0.4); z-index: 999; text-decoration: none; }
        .whatsapp-float:hover { transform: scale(1.08); }

        .footer-links { margin-top: 16px; padding-top: 14px; border-top: 1px solid #e8ecf0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
        .footer-links a { font-size: 9px; color: #6b6b7b; text-decoration: none; }
        .footer-links a:hover { color: #0ea5e9; }
        .footer-copyright { font-size: 8px; color: #aaa; text-align: center; margin-top: 6px; }

        .loading-text { text-align: center; padding: 40px; color: #6b6b7b; }
        .loading-text i { font-size: 32px; display: block; margin-bottom: 12px; }

        @media (max-width: 400px) { .whatsapp-float { width: 48px; height: 48px; font-size: 24px; bottom: 90px; right: 16px; } }
    </style>
</head>
<body>

    <a href="https://wa.me/919483037385" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <header class="fixed-header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <div class="logo-text">Raj Marketing<span>Mysore</span></div>
        </div>
        <div class="header-actions">
            <a href="customer-dashboard.html" class="header-btn"><i class="fas fa-arrow-left"></i><span class="label">Back</span></a>
        </div>
    </header>

    <div class="app-container">
        <div class="page-header">
            <h1>🎁 Special Offers</h1>
            <span class="count" id="offerCount">0 Offers</span>
        </div>

        <div id="loadingState" class="loading-text">
            <i class="fas fa-spinner fa-spin"></i>
            Loading offers...
        </div>

        <div id="offerList" style="display:none;"></div>

        <div class="footer-links">
            <a href="index.html">Home</a>| <a href="about.html">About</a>| <a href="contact.html">Contact</a>| <a href="terms.html">Terms</a>| <a href="privacy.html">Privacy</a>
        </div>
        <div class="footer-copyright">© 2026 Raj Marketing Mysore</div>
    </div>

    <footer class="fixed-footer">
        <a href="customer-dashboard.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
        <a href="customer-products.html" class="nav-item"><i class="fas fa-th-large"></i> Products</a>
        <a href="customer-orders.html" class="nav-item"><i class="fas fa-box"></i> Orders</a>
        <a href="customer-appointments.html" class="nav-item"><i class="fas fa-calendar-check"></i> Appointment</a>
        <a href="customer-profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
    </footer>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        // Fallback offers based on Raj Marketing rules
        const FALLBACK_OFFERS = [
            { id: 'offer-1', name: 'Summer Special', description: '20% off on all Pleated Nets', product: 'Pleated', discount: 20, originalPrice: 380, offerPrice: 304, validUntil: '2026-09-30', tag: 'discount' },
            { id: 'offer-2', name: 'Dealer Launch Offer', description: '10% off on Aluminium Frame Systems', product: 'Aluminium Frame', discount: 10, originalPrice: 220, offerPrice: 198, validUntil: '2026-09-15', tag: 'limited' },
            { id: 'offer-3', name: 'Velcro Bundle Deal', description: 'Buy 2 get 5% off on Velcro Systems', product: 'Velcro', discount: 5, originalPrice: 65, offerPrice: 61.75, validUntil: '2026-10-01', tag: 'exclusive' }
        ];

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "customer-login.html"; return; }
            await loadOffers();
        });

        async function loadOffers() {
            try {
                const offersRef = collection(db, "offers");
                const q = query(offersRef, where("active", "==", true));
                const snapshot = await getDocs(q);
                let offers = [];

                if (snapshot.empty) {
                    offers = FALLBACK_OFFERS;
                } else {
                    snapshot.forEach(doc => offers.push({ id: doc.id, ...doc.data() }));
                }

                renderOffers(offers);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('offerList').style.display = 'block';
                document.getElementById('offerCount').textContent = offers.length + ' Offers';

            } catch (error) {
                console.error("❌ Offers load error:", error);
                renderOffers(FALLBACK_OFFERS);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('offerList').style.display = 'block';
                document.getElementById('offerCount').textContent = FALLBACK_OFFERS.length + ' Offers';
            }
        }

        function renderOffers(offers) {
            const container = document.getElementById('offerList');

            if (!offers.length) {
                container.innerHTML = `<div class="empty-state"><span class="icon">🎁</span><h3 style="font-size:16px; font-weight:700;">No Offers Available</h3><p style="font-size:13px; margin-top:4px;">Check back later for new offers.</p></div>`;
                return;
            }

            container.innerHTML = offers.map(o => {
                const tagClass = o.tag || 'discount';
                const tagLabel = tagClass === 'discount' ? '🔥 Discount' : tagClass === 'limited' ? '⏳ Limited' : '⭐ Exclusive';
                const validDate = o.validUntil ? new Date(o.validUntil).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';

                return `
                    <div class="offer-card">
                        <span class="offer-badge tag-${tagClass}">${tagLabel}</span>
                        <div class="offer-title">${o.name || 'Special Offer'}</div>
                        <div class="offer-desc">${o.description || ''}</div>
                        <div>
                            <span class="offer-price">₹${(o.offerPrice || 0).toFixed(2)}</span>
                            ${o.originalPrice ? `<span class="offer-original">₹${o.originalPrice}</span>` : ''}
                            ${o.discount ? `<span style="font-size:12px; color:#059669; font-weight:600;">${o.discount}% OFF</span>` : ''}
                        </div>
                        <div class="offer-valid"><i class="far fa-calendar-alt"></i> Valid until: ${validDate}</div>
                        ${o.product ? `<div style="font-size:11px; color:#6b6b7b;">Product: ${o.product}</div>` : ''}
                        <div class="offer-actions">
                            <a href="price-checker.html" class="btn-sm btn-sm-primary">💰 Check Price</a>
                            <a href="https://wa.me/919483037385?text=Hi%2C%20I%20want%20to%20know%20about%20${encodeURIComponent(o.name)}" target="_blank" class="btn-sm btn-sm-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                            <a href="appointment.html" class="btn-sm btn-sm-outline">📅 Book Appointment</a>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
  </html>
