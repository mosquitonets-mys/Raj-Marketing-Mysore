        .fixed-header .logo-text span {

        }

        .fixed-header .header-actions {

        }

        .fixed-header .header-btn {

            background: transparent;

            color: #0ea5e9;

            color: #0ea5e9;
        }

        .fixed-footer .nav-item:hover i {

        }

            color: #64748b;
            background: #f1f5f9;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 600;
        }

            border-radius: 50px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;

        .search-bar:focus-within {

            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.12);

        .search-bar input {

            background: transparent;
            font-size: 14px;
            outline: none;
            padding: 4px 0;
            color: #0f172a;
            font-weight: 400;

        }

        .search-bar i {
            color: #94a3b8;
            font-size: 16px;

            overflow-x: auto;
            padding: 4px 0 14px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;

            font-weight: 600;
            background: #ffffff;
            color: #475569;

            cursor: pointer;
            transition: all 0.25s ease;

            border-color: #0ea5e9;
            color: #0ea5e9;

            gap: 14px;
            margin: 4px 0 16px 0;

            border-radius: 20px;
            padding: 14px;

            cursor: pointer;
            text-decoration: none;
            display: block;

            border-radius: 14px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 10px;
            position: relative;
            transition: 0.3s;

        .product-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

            transform: scale(1.04);
        }

            left: 8px;
            padding: 3px 12px;
            border-radius: 14px;
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;

            color: #059669;
        }

            color: #d97706;

            color: #dc2626;

            background: rgba(254, 243, 199, 0.9);
            color: #b45309;

            font-size: 13px;
            color: #0f172a;
            margin-bottom: 2px;
            line-height: 1.25;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;

            font-size: 11px;
            color: #94a3b8;
            font-weight: 400;
        }

            padding-top: 8px;

            text-decoration: line-through;
            font-weight: 400;

            color: #059669;
            font-weight: 700;
            background: #d1fae5;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;

        .product-card .cta-tag {

            font-weight: 600;
            color: #0ea5e9;
            background: #f0f9ff;

        .product-card:hover .cta-tag {

        }

        .product-card .online-badge {
            font-size: 8px;
            font-weight: 600;
            color: #059669;
            background: #d1fae5;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;
        }

        .product-card .appointment-badge {
            font-size: 8px;
            font-weight: 600;
            color: #d97706;
            background: #fef3c7;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;
        }

        /* ===== WHATSAPP FLOAT ===== */
        .whatsapp-float {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: #25D366;
            color: #fff;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            z-index: 999;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 6px 28px rgba(37, 211, 102, 0.5);
        }

        /* ===== FOOTER LINKS ===== */
        .footer-links {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e8ecf0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 14px;
        }

        .footer-links a {
            font-size: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .footer-links a:hover {
            color: #0ea5e9;
        }

        .footer-copyright {
            font-size: 9px;
            color: #cbd5e1;
            text-align: center;
            margin-top: 6px;
            font-weight: 400;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        .empty-state h3 {
            color: #475569;
            font-weight: 600;
            font-size: 16px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            body {
                padding: 0 10px;
                padding-top: 70px;
                padding-bottom: 80px;
            }

            .product-grid {
                gap: 10px;
            }

            .product-card {
                padding: 10px;
            }

            .product-card .name {
                font-size: 12px;
            }

            .product-card .price {
                font-size: 15px;
            }

            .page-header h1 {
                font-size: 18px;
            }

            .whatsapp-float {
                width: 48px;
                height: 48px;
                font-size: 22px;
                bottom: 85px;
                right: 14px;
            }

            .filter-chips .chip {
                font-size: 10px;
                padding: 4px 14px;
            }

            .search-bar {
                padding: 8px 14px;
            }

            .search-bar input {
                font-size: 13px;
            }

            .fixed-header {
                padding: 8px 12px;
            }

            .fixed-header .logo-text {
                font-size: 14px;
            }

            .fixed-header .logo-icon {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
        }

        @media (min-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        @media (max-width: 380px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');

            if (!products || !products.length) {
                grid.innerHTML = `

                        <h3>No products found</h3>
                        <p style="font-size:13px; margin-top:4px;">Try adjusting your search or filter</p>

                return;

                const discountHtml = p.discount ? `<span class="discount-badge">${p.discount}% OFF</span>` : '';
                const originalHtml = p.originalPrice ? `<span class="original">₹${p.originalPrice}</span>` : '';
                const availabilityBadge = isOnline ?
                    `<span class="online-badge"><i class="fas fa-shopping-cart"></i> Buy Online</span>` :
                    `<span class="appointment-badge"><i class="fas fa-calendar-check"></i> Book Appointment</span>`;

                // Fallback image if not found
                const imgSrc = p.image || 'images/placeholder.jpg';

                return `
                    <a href="product-detail.html?id=${p.id}" class="product-card">
                        <div class="img-wrap">
                            <img src="${imgSrc}" alt="${p.name}" loading="lazy" onerror="this.src='images/placeholder.jpg'" />
                            <span class="badge badge-${badgeClass}">${p.category || 'Product'}</span>
                        </div>
                        <div class="name">${p.name}</div>
                        <div class="variant">${p.variant || ''}</div>
                        <div class="price-row">
                            <span class="price">₹${p.price} ${originalHtml}</span>
                            <span class="cta-tag">${isOnline ? 'Buy' : 'Book'}</span>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:4px;">
                            ${discountHtml}
                            ${availabilityBadge}
                        </div>
                    </a>
                `;
            }).join('');

            document.getElementById('productCount').textContent = products.length + ' Products';
        }

        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = allProducts;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => p.category === currentFilter);
            }

            if (search) {
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(search) ||
                    (p.variant && p.variant.toLowerCase().includes(search)) ||
                    (p.category && p.category.toLowerCase().includes(search))
                );
            }

            renderProducts(filtered);
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chips .chip').forEach(c => {
                c.classList.toggle('active', c.dataset.filter === filter);
            });
            filterProducts();
        }

        // ============================================================
        // INIT
        // ============================================================
        renderProducts(allProducts);
        console.log('✅ Products page loaded with', allProducts.length, 'products');
    </script>

</body>
</html>
