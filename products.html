<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="canonical" href="https://rajmarketingmysore.info/products.html" />

    <!-- Open Graph -->
    <meta property="og:title" content="Products - Raj Marketing Mysore" />
    <meta property="og:description" content="Premium mosquito nets and window screens in Mysore." />
    <meta property="og:url" content="https://rajmarketingmysore.info/products.html" />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Page-specific styles -->
    <style>
        /* ===== PAGE HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 14px 0;
            padding: 0 4px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--highlight-grey);
            letter-spacing: -0.5px;
        }

        .page-header h1 i {
            color: var(--royal-blue);
            margin-right: 6px;
        }

        .page-header .count {
            font-size: 12px;
            color: var(--bold-grey);
            background: var(--light-grey);
            padding: 5px 14px;
            border-radius: 30px;
            font-weight: 700;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar-products {
            background: var(--white);
            border-radius: 50px;
            padding: 11px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            border: 1.5px solid #e2e8f0;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .search-bar-products:focus-within {
            border-color: var(--royal-blue);
            box-shadow: 0 4px 16px rgba(26, 86, 219, 0.12);
        }

        .search-bar-products input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            padding: 4px 0;
            color: var(--dark-text);
            font-weight: 400;
            font-family: 'Poppins', sans-serif;
        }

        .search-bar-products input::placeholder {
            color: var(--muted-text);
        }

        .search-bar-products i {
            color: var(--muted-text);
            font-size: 16px;
        }

        /* ===== FILTER CHIPS ===== */
        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 16px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .filter-chips::-webkit-scrollbar {
            display: none;
        }

        .filter-chips .chip {
            padding: 7px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            background: var(--white);
            color: var(--bold-grey);
            border: 1.5px solid #e2e8f0;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .filter-chips .chip:hover {
            background: var(--light-blue);
            border-color: var(--royal-blue);
            color: var(--royal-blue);
            transform: translateY(-1px);
        }

        .filter-chips .chip.active {
            background: linear-gradient(145deg, var(--royal-blue), #0d47a1);
            color: #fff;
            border-color: var(--royal-blue);
            box-shadow: 0 4px 14px rgba(26, 86, 219, 0.25);
        }

        /* ===== PRODUCT GRID ===== */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 4px 0 24px 0;
        }

        .product-grid .product-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 14px;
            border: 1px solid #e8ecf0;
            transition: var(--transition);
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-shadow: var(--shadow-sm);
        }

        .product-grid .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
            border-color: var(--royal-blue);
        }

        .product-grid .product-card .img-wrap {
            width: 100%;
            aspect-ratio: 1.2 / 1;
            border-radius: var(--radius);
            background: var(--light-grey);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 10px;
            position: relative;
        }

        .product-grid .product-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-grid .product-card:hover .img-wrap img {
            transform: scale(1.05);
        }

        .product-grid .product-card .img-wrap .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 3px 12px;
            border-radius: 14px;
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
        }

        .badge-velcro { background: rgba(219, 234, 254, 0.92); color: #1d4ed8; }
        .badge-pleated { background: rgba(209, 250, 229, 0.92); color: #059669; }
        .badge-frame { background: rgba(254, 243, 199, 0.92); color: #d97706; }
        .badge-door { background: rgba(252, 228, 236, 0.92); color: #dc2626; }
        .badge-premium { background: rgba(254, 243, 199, 0.92); color: #b45309; }
        .badge-sliding { background: rgba(199, 210, 254, 0.92); color: #4338ca; }
        .badge-mesh { background: rgba(229, 231, 235, 0.92); color: #4b5563; }
        .badge-security { background: rgba(224, 231, 255, 0.92); color: #4f46e5; }
        .badge-honeycomb { background: rgba(254, 243, 199, 0.92); color: #b45309; }

        .product-grid .product-card .name {
            font-weight: 800;
            font-size: 13px;
            color: var(--highlight-grey);
            margin-bottom: 2px;
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-grid .product-card .variant {
            font-size: 11px;
            color: var(--muted-text);
            font-weight: 400;
        }

        .product-grid .product-card .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--light-grey);
        }

        .product-grid .product-card .price {
            font-size: 17px;
            font-weight: 900;
            color: var(--royal-blue);
            letter-spacing: -0.3px;
        }

        .product-grid .product-card .price .original {
            font-size: 12px;
            color: var(--muted-text);
            text-decoration: line-through;
            font-weight: 400;
            margin-left: 4px;
        }

        .product-grid .product-card .discount-badge {
            font-size: 10px;
            color: #059669;
            font-weight: 700;
            background: #d1fae5;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .product-grid .product-card .cta-tag {
            font-size: 10px;
            font-weight: 700;
            color: var(--royal-blue);
            background: var(--light-blue);
            padding: 3px 12px;
            border-radius: 30px;
            transition: var(--transition);
        }

        .product-grid .product-card:hover .cta-tag {
            background: var(--royal-blue);
            color: #fff;
        }

        .product-grid .product-card .online-badge {
            font-size: 9px;
            font-weight: 600;
            color: #059669;
            background: #d1fae5;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .product-grid .product-card .appointment-badge {
            font-size: 9px;
            font-weight: 600;
            color: #d97706;
            background: #fef3c7;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--muted-text);
        }

        .empty-state i {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        .empty-state h3 {
            color: var(--bold-grey);
            font-weight: 700;
            font-size: 16px;
        }

        @media (max-width: 420px) {
            .product-grid {
                gap: 10px;
            }
            .product-grid .product-card {
                padding: 10px;
            }
            .product-grid .product-card .name {
                font-size: 12px;
            }
            .product-grid .product-card .price {
                font-size: 15px;
            }
            .page-header h1 {
                font-size: 20px;
            }
            .filter-chips .chip {
                font-size: 10px;
                padding: 5px 14px;
            }
        }

        @media (min-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        @media (max-width: 360px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER PLACEHOLDER (loaded via JS) ===== -->
    <div id="header-placeholder"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        <div class="container">

            <!-- Page Header -->
            <div class="page-header">
                <h1><i class="fas fa-store-alt"></i> Our Products</h1>
                <span class="count" id="productCount">0 Products</span>
            </div>

            <!-- Search -->
            <div class="search-bar-products">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search mosquito nets..." oninput="filterProducts()" />
            </div>

            <!-- Filter Chips -->
            <div class="filter-chips" id="filterChips">
                <span class="chip active" data-filter="all" onclick="setFilter('all')">All</span>
                <span class="chip" data-filter="Velcro" onclick="setFilter('Velcro')">Velcro</span>
                <span class="chip" data-filter="Aluminium" onclick="setFilter('Aluminium')">Aluminium</span>
                <span class="chip" data-filter="Premium" onclick="setFilter('Premium')">Premium</span>
                <span class="chip" data-filter="Pleated" onclick="setFilter('Pleated')">Pleated</span>
                <span class="chip" data-filter="Sliding" onclick="setFilter('Sliding')">Sliding</span>
                <span class="chip" data-filter="Security" onclick="setFilter('Security')">Security</span>
                <span class="chip" data-filter="Mesh" onclick="setFilter('Mesh')">Mesh</span>
                <span class="chip" data-filter="Door" onclick="setFilter('Door')">Door</span>
            </div>

            <!-- Product Grid -->
            <div class="product-grid" id="productGrid">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Loading products...</h3>
                </div>
            </div>

        </div>
    </main>

    <!-- ===== FOOTER PLACEHOLDER (loaded via JS) ===== -->
    <div id="footer-placeholder"></div>

    <!-- ============================================================
         SCRIPTS
    ============================================================ -->
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>

    <script>
        // ============================================================
        // PRODUCT DATABASE
        // ============================================================
        const PRODUCTS = [
            // ===== VELCRO =====
            { id: 'velcro-economic', name: 'Velcro System – Economic', category: 'Velcro', variant: 'Economic', price: 65, originalPrice: null, discount: null, image: 'images/velcro-economic.jpg', badge: 'velcro', onlinePurchase: true },
            { id: 'velcro-premium', name: 'Velcro System – Premium Saint-Gobain', category: 'Velcro', variant: 'Premium Saint-Gobain', price: 80, originalPrice: null, discount: null, image: 'images/velcro-premium.jpg', badge: 'velcro', onlinePurchase: true },

            // ===== ALUMINIUM =====
            { id: 'aluminium-black-ss', name: 'Aluminium Frame – Black Coated SS Mesh', category: 'Aluminium', variant: 'Regular + Black Coated SS', price: 200, originalPrice: null, discount: null, image: 'images/aluminium-black-ss.jpg', badge: 'frame', onlinePurchase: false },
            { id: 'aluminium-bright-ss', name: 'Aluminium Frame – Bright SS 304 Mesh', category: 'Aluminium', variant: 'Regular + Bright SS 304', price: 220, originalPrice: null, discount: null, image: 'images/aluminium-bright-ss.jpg', badge: 'frame', onlinePurchase: false },

            // ===== PREMIUM =====
            { id: 'aluminium-teakwood', name: 'Premium Teakwood – Black Coated SS Mesh', category: 'Premium', variant: 'Teakwood + Black Coated SS', price: 300, originalPrice: null, discount: null, image: 'images/aluminium-teakwood.jpg', badge: 'premium', onlinePurchase: false },

            // ===== PLEATED =====
            { id: 'pleated-gold', name: 'Pleated Mesh – Gold Detachable', category: 'Pleated', variant: '32mm Single', price: 380, originalPrice: 420, discount: 10, image: 'images/pleated-gold.jpg', badge: 'pleated', onlinePurchase: false },
            { id: 'pleated-platinum', name: 'Pleated SS Mesh – Platinum Detachable', category: 'Pleated', variant: '25mm Single', price: 500, originalPrice: null, discount: null, image: 'images/pleated-platinum.jpg', badge: 'pleated', onlinePurchase: false },
            { id: 'pleated-diamond', name: 'Pleated SS Mesh – Diamond Detachable', category: 'Pleated', variant: '32mm Single', price: 560, originalPrice: null, discount: null, image: 'images/pleated-diamond.jpg', badge: 'pleated', onlinePurchase: false },
            { id: 'honeycomb-gold', name: 'Pleated Honeycomb Gold – Detachable', category: 'Pleated', variant: '32mm Single', price: 520, originalPrice: null, discount: null, image: 'images/honeycomb-gold.jpg', badge: 'pleated', onlinePurchase: false },

            // ===== SLIDING =====
            { id: 'single-sliding-economic', name: 'Single Sliding Economic', category: 'Sliding', variant: 'Single Sliding', price: 400, originalPrice: null, discount: null, image: 'images/single-sliding.jpg', badge: 'sliding', onlinePurchase: false },
            { id: 'double-sliding-economic', name: 'Double Sliding Economic', category: 'Sliding', variant: 'Double Sliding', price: 450, originalPrice: null, discount: null, image: 'images/double-sliding.jpg', badge: 'sliding', onlinePurchase: false },

            // ===== SECURITY =====
            { id: 'security-screen-single-door', name: 'Security Screen – Single Door', category: 'Security', variant: 'Single Door + GST', price: 990, originalPrice: null, discount: null, image: 'images/security-screen-single.jpg', badge: 'security', onlinePurchase: false },
            { id: 'security-screen-double-door', name: 'Security Screen – Double Door', category: 'Security', variant: 'Double Door + GST', price: 1150, originalPrice: null, discount: null, image: 'images/security-screen-double.jpg', badge: 'security', onlinePurchase: false },

            // ===== MESH =====
            { id: 'ss-black-mesh-0.18mm', name: 'SS Black Mesh 0.18mm', category: 'Mesh', variant: '0.18mm Black', price: 36, originalPrice: null, discount: null, image: 'images/ss-black-mesh.jpg', badge: 'mesh', onlinePurchase: false },
            { id: 'ss-black-mesh', name: 'SS Black Mesh', category: 'Mesh', variant: 'Black', price: 38, originalPrice: null, discount: null, image: 'images/ss-black-mesh-standard.jpg', badge: 'mesh', onlinePurchase: false },
            { id: 'ss-black-mesh-3ft', name: 'SS Black Mesh 3 ft', category: 'Mesh', variant: '3 ft Black', price: 42, originalPrice: null, discount: null, image: 'images/ss-black-mesh-3ft.jpg', badge: 'mesh', onlinePurchase: false },
            { id: 'ss-bright-mesh-0.24mm-4ft', name: 'SS Bright Mesh 0.24mm, 4 ft', category: 'Mesh', variant: '0.24mm Bright 4ft', price: 48, originalPrice: null, discount: null, image: 'images/ss-bright-mesh.jpg', badge: 'mesh', onlinePurchase: false },
            { id: 'ss-black-304g-0.5mm', name: 'SS Black 304G 0.5mm', category: 'Mesh', variant: '304G 0.5mm', price: 550, originalPrice: null, discount: null, image: 'images/ss-black-304g.jpg', badge: 'mesh', onlinePurchase: false },
            { id: 'fiber-touflex-mesh', name: 'Fiber/Touflex Mesh', category: 'Mesh', variant: 'Fiber Mesh', price: 8, originalPrice: null, discount: null, image: 'images/fiber-mesh.jpg', badge: 'mesh', onlinePurchase: false },

            // ===== DOOR =====
            { id: 'mesh-door-black', name: 'Mesh Door – Black Coated SS Mesh', category: 'Door', variant: 'Regular + Black Coated SS', price: 350, originalPrice: null, discount: null, image: 'images/mesh-door-black.jpg', badge: 'door', onlinePurchase: false },
            { id: 'mesh-door-bright', name: 'Mesh Door – Bright SS 304 Mesh', category: 'Door', variant: 'Regular + Bright SS 304', price: 380, originalPrice: null, discount: null, image: 'images/mesh-door-bright.jpg', badge: 'door', onlinePurchase: false }
        ];

        // ============================================================
        // STATE
        // ============================================================
        let currentFilter = 'all';
        let allProducts = PRODUCTS;

        // ============================================================
        // RENDER PRODUCTS
        // ============================================================
        function renderProducts(products) {
            const grid = document.getElementById('productGrid');

            if (!products || !products.length) {
                               grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>No products found</h3>
                        <p style="font-size:13px; margin-top:4px;">Try adjusting your search or filter</p>
                    </div>
                `;
                document.getElementById('productCount').textContent = '0 Products';
                return;
            }

            grid.innerHTML = products.map(p => {
                const badgeClass = p.badge || 'velcro';
                const isOnline = p.onlinePurchase !== false;
                const discountHtml = p.discount ? `<span class="discount-badge">${p.discount}% OFF</span>` : '';
                const originalHtml = p.originalPrice ? `<span class="original">₹${p.originalPrice}</span>` : '';
                const availabilityBadge = isOnline
                    ? `<span class="online-badge"><i class="fas fa-shopping-cart"></i> Buy Online</span>`
                    : `<span class="appointment-badge"><i class="fas fa-calendar-check"></i> Book Appointment</span>`;

                const imgSrc = p.image || 'images/placeholder.jpg';

                return `
                    <a href="product-detail.html?id=${p.id}" class="product-card">
                        <div class="img-wrap">
                            <img src="${imgSrc}" alt="${p.name}" loading="lazy" onerror="this.src='images/placeholder.jpg'" />
                            <span class="badge badge-${badgeClass}">${p.category || 'Product'}</span>
                        </div>
                        <div class="name">${p.name}</div>
                        <div class="variant">${p.variant || ''}</div>
                        <div class="price-row">
                            <span class="price">₹${p.price} ${originalHtml}</span>
                            <span class="cta-tag">${isOnline ? 'Buy' : 'Book'}</span>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px;">
                            ${discountHtml}
                            ${availabilityBadge}
                        </div>
                    </a>
                `;
            }).join('');

            document.getElementById('productCount').textContent = products.length + ' Products';
        }

        // ============================================================
        // FILTER PRODUCTS
        // ============================================================
        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = allProducts;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => p.category === currentFilter);
            }

            if (search) {
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(search) ||
                    (p.variant && p.variant.toLowerCase().includes(search)) ||
                    (p.category && p.category.toLowerCase().includes(search))
                );
            }

            renderProducts(filtered);
        }

        // ============================================================
        // SET FILTER
        // ============================================================
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chips .chip').forEach(c => {
                c.classList.toggle('active', c.dataset.filter === filter);
            });
            filterProducts();
        }

        // ============================================================
        // INIT
        // ============================================================
        renderProducts(allProducts);
        console.log('✅ Products page loaded with', allProducts.length, 'products');
    </script>

</body>
</html>
