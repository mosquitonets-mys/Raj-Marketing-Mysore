        ];

        window.setupProducts = async function() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status info">⏳ Uploading products...</div>';

            try {
                // Clear existing
                const snapshot = await getDocs(collection(db, 'products'));
                const batch = writeBatch(db);
                snapshot.forEach(doc => batch.delete(doc.ref));
                if (snapshot.size > 0) await batch.commit();

                // Upload new products
                const uploadBatch = writeBatch(db);
                for (const p of products) {
                    const ref = doc(db, 'products', p.id);
                    uploadBatch.set(ref, {
                        ...p,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });
                }
                await uploadBatch.commit();

                statusDiv.innerHTML = `
                    <div class="status success">✅ ${products.length} products uploaded successfully!</div>
                    <div class="status info">📦 All products are now available in Firebase</div>
                `;
                document.getElementById('dataPreview').textContent = JSON.stringify(products, null, 2);

            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
                console.error('Setup error:', error);
            }
        };

        async function loadPreview() {
            try {
                const snapshot = await getDocs(collection(db, 'products'));
                const count = snapshot.size;
                if (count > 0) {
                    document.getElementById('dataPreview').textContent = `✅ ${count} products already exist.`;
                } else {
                    document.getElementById('dataPreview').textContent = '⚠️ No products found. Click "Upload Products" to set up.';
                }
            } catch (e) {
                document.getElementById('dataPreview').textContent = '⚠️ Unable to read database. Please run setup.';
            }
        }
        loadPreview();
    </script>
