<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Dealer Login - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="auth-container">

        <div class="dealer-auth-card">
            <div class="auth-header">
                <div class="dealer-auth-icon"><i class="fas fa-user-tie"></i></div>
                <h1>Dealer Login</h1>
                <p>Sign in to your dealer portal</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email or Dealer ID <span class="required">*</span></label>
                    <input type="text" id="loginEmail" required placeholder="Enter email or dealer ID" />
                </div>

                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" id="loginPassword" required placeholder="Enter password" minlength="6" />
                    <div class="form-hint" style="text-align:right;">
                        <a href="#" onclick="forgotPassword(event)" style="color:#f59e0b;text-decoration:none;font-weight:700;">Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="background:linear-gradient(145deg,#f59e0b,#d97706);box-shadow:0 4px 14px rgba(245,158,11,0.3);">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div style="text-align:center;margin:16px 0;color:var(--muted-text);font-size:12px;position:relative;">
                    <hr style="border:none;border-top:1px solid var(--border);margin:0;" />
                    <span style="background:var(--white);padding:0 12px;position:relative;top:-9px;font-weight:600;">OR</span>
                </div>

                <a href="dealer-registration.html" class="btn btn-secondary btn-block btn-lg">
                    <i class="fas fa-handshake"></i> Become a Dealer
                </a>
            </form>
        </div>

        <div style="text-align:center;margin-top:20px;font-size:12px;color:var(--muted-text);">
            <p>By continuing, you agree to our</p>
            <p>
                <a href="../terms.html" style="color:#f59e0b;text-decoration:none;font-weight:700;">Terms</a>
                ·
                <a href="../privacy.html" style="color:#f59e0b;text-decoration:none;font-weight:700;">Privacy Policy</a>
            </p>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email) { showToast('Please enter email or dealer ID', 'error'); return; }
        if (!password || password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }

        try {
            const dealers = JSON.parse(localStorage.getItem('raj_dealers') || '[]');
            const found = dealers.find(d =>
                (d.email === email || d.dealerId === email || d.mobile === email) && d.password === password
            );

            if (!found) {
                showToast('Invalid credentials. Please register first.', 'error');
                return;
            }

            if (found.status !== 'Approved' && found.status !== 'Active') {
                showToast('Your account is under review. Please wait for approval.', 'warning');
                return;
            }

            localStorage.setItem('raj_dealer', JSON.stringify({
                id: found.id,
                dealerId: found.dealerId,
                name: found.ownerName || found.name,
                email: found.email,
                mobile: found.mobile,
                status: found.status,
                loggedInAt: new Date().toISOString()
            }));

            showToast('✅ Login successful!', 'success');
            setTimeout(() => window.location.href = 'dealer-dashboard.html', 800);
        } catch (err) {
            showToast('Login failed. Try again.', 'error');
        }
    }

    function forgotPassword(e) {
        e.preventDefault();
        const email = prompt('Enter your registered email or dealer ID:');
        if (email) showToast('Password reset link sent to ' + email, 'info');
    }

    function showToast(msg, type = 'info') {
        document.querySelectorAll('.rm-toast').forEach(t => t.remove());
        const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#1a56db' };
        const t = document.createElement('div');
        t.className = 'rm-toast';
        t.textContent = msg;
        t.style.background = colors[type] || colors.info;
        document.body.appendChild(t);
        requestAnimationFrame(() => t.classList.add('show'));
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
    }
    </script>
</body>
</html>
