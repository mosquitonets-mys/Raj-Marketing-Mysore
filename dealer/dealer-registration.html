<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Dealer Registration - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="auth-container">

        <div class="dealer-auth-card">
            <div class="auth-header">
                <div class="dealer-auth-icon"><i class="fas fa-handshake"></i></div>
                <h1>Become a Dealer</h1>
                <p>Join the Raj Marketing Dealer Network</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Owner Name <span class="required">*</span></label>
                    <input type="text" id="regOwnerName" required placeholder="Enter your full name" />
                </div>

                <div class="form-group">
                    <label>Business Name <span class="required">*</span></label>
                    <input type="text" id="regBusinessName" required placeholder="Enter business name" />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="regEmail" required placeholder="your@email.com" />
                    </div>
                    <div class="form-group">
                        <label>Mobile <span class="required">*</span></label>
                        <input type="tel" id="regMobile" required placeholder="10-digit number" maxlength="10" pattern="[0-9]{10}" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input type="tel" id="regWhatsapp" maxlength="10" placeholder="If different" />
                    </div>
                    <div class="form-group">
                        <label>GSTIN (Optional)</label>
                        <input type="text" id="regGST" placeholder="29ABCDE1234F1Z5" maxlength="15" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Business Address <span class="required">*</span></label>
                    <textarea id="regAddress" required placeholder="Street, area, landmark..." rows="2"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>City <span class="required">*</span></label>
                        <input type="text" id="regCity" required placeholder="City" />
                    </div>
                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" id="regPincode" maxlength="6" placeholder="570001" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <input type="password" id="regPassword" required placeholder="Min 6 characters" minlength="6" />
                    </div>
                    <div class="form-group">
                        <label>Confirm Password <span class="required">*</span></label>
                        <input type="password" id="regConfirm" required placeholder="Re-enter" minlength="6" />
                    </div>
                </div>

                <div class="form-group" style="display:flex;align-items:flex-start;gap:8px;">
                    <input type="checkbox" id="regTerms" required style="width:auto;margin-top:4px;flex-shrink:0;" />
                    <label for="regTerms" style="font-weight:500;font-size:12px;color:var(--muted-text);line-height:1.5;">
                        I agree to the
                        <a href="../terms.html" style="color:#f59e0b;text-decoration:none;font-weight:700;">Terms</a>
                        and
                        <a href="../privacy.html" style="color:#f59e0b;text-decoration:none;font-weight:700;">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-block btn-lg" style="background:linear-gradient(145deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 14px rgba(245,158,11,0.3);">
                    <i class="fas fa-handshake"></i> Submit Application
                </button>

                <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted-text);">
                    Already a dealer?
                    <a href="dealer-login.html" style="color:#f59e0b;text-decoration:none;font-weight:700;">Sign In</a>
                </div>
            </form>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    function handleRegister(e) {
        e.preventDefault();

        const ownerName = document.getElementById('regOwnerName').value.trim();
        const businessName = document.getElementById('regBusinessName').value.trim();
        const email = document.getElementById('regEmail').value.trim().toLowerCase();
        const mobile = document.getElementById('regMobile').value.trim();
        const whatsapp = document.getElementById('regWhatsapp').value.trim();
        const gst = document.getElementById('regGST').value.trim().toUpperCase();
        const address = document.getElementById('regAddress').value.trim();
        const city = document.getElementById('regCity').value.trim();
        const pincode = document.getElementById('regPincode').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        const terms = document.getElementById('regTerms').checked;

        if (!ownerName || ownerName.length < 2) { showToast('Please enter owner name', 'error'); return; }
        if (!businessName || businessName.length < 2) { showToast('Please enter business name', 'error'); return; }
        if (!email || !/^\S+@\S+\.\S+$/.test(email)) { showToast('Please enter valid email', 'error'); return; }
        if (!mobile || mobile.length !== 10) { showToast('Please enter valid mobile', 'error'); return; }
        if (!address) { showToast('Please enter business address', 'error'); return; }
        if (!city) { showToast('Please enter city', 'error'); return; }
        if (password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
        if (password !== confirm) { showToast('Passwords do not match', 'error'); return; }
        if (!terms) { showToast('Please accept Terms & Privacy', 'error'); return; }

        try {
            const dealers = JSON.parse(localStorage.getItem('raj_dealers') || '[]');

            if (dealers.find(d => d.email === email || d.mobile === mobile)) {
                showToast('Email or mobile already registered', 'error');
                return;
            }

            const dealerId = 'DLR-' + String(dealers.length + 1).padStart(6, '0');

            const newDealer = {
                id: 'DEALER-' + Date.now(),
                dealerId,
                ownerName,
                businessName,
                email,
                mobile,
                whatsapp: whatsapp || mobile,
                gst,
                address,
                city,
                pincode,
                password,
                status: 'Pending',
                tier: 'Bronze',
                registeredAt: new Date().toISOString()
            };

            dealers.push(newDealer);
            localStorage.setItem('raj_dealers', JSON.stringify(dealers));

            showToast('🎉 Application submitted! Awaiting approval.', 'success');
            setTimeout(() => window.location.href = 'dealer-login.html', 1500);
        } catch (err) {
            showToast('Registration failed. Try again.', 'error');
        }
    }

    function showToast(msg, type = 'info') {
        document.querySelectorAll('.rm-toast').forEach(t => t.remove());
        const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#1a56db' };
        const t = document.createElement('div');
        t.className = 'rm-toast';
        t.textContent = msg;
        t.style.background = colors[type] || colors.info;
        document.body.appendChild(t);
        requestAnimationFrame(() => t.classList.add('show'));
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
    }
    </script>
</body>
</html>
