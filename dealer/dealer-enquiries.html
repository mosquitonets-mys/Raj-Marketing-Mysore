<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Customer Enquiries - Raj Marketing Dealer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-phone"></i> Customer Enquiries</h1>
            <a href="dealer-calculator.html" class="btn btn-primary btn-sm" style="background:linear-gradient(145deg,#f59e0b,#d97706);">
                <i class="fas fa-plus"></i> New Enquiry
            </a>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" data-status="all" onclick="setTab('all')">All</button>
            <button class="tab-btn" data-status="New" onclick="setTab('New')">New</button>
            <button class="tab-btn" data-status="Contacted" onclick="setTab('Contacted')">Contacted</button>
            <button class="tab-btn" data-status="Converted" onclick="setTab('Converted')">Converted</button>
        </div>

        <div id="enquiryList">
            <div class="loader">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading enquiries...</p>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        let allEnquiries = [];
        let currentTab = 'all';

        function load() {
            try {
                const data = JSON.parse(localStorage.getItem('raj_dealer_data') || '{}');
                allEnquiries = (data.enquiries || []).slice().reverse();
                render();
            } catch (e) { render(); }
        }

        window.setTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.status === tab));
            render();
        };

        function render() {
            const container = document.getElementById('enquiryList');
            let list = allEnquiries;
            if (currentTab !== 'all') {
                list = list.filter(e => e.status === currentTab);
            }

            if (!list.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-phone"></i>
                        <h3>No enquiries found</h3>
                        <p>Customer enquiries will appear here</p>
                        <a href="dealer-calculator.html" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Add Enquiry
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(enq => `
                <div class="card enquiry-${(enq.status || 'new').toLowerCase()}">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px;">
                        <div>
                            <h3 style="font-size:15px;font-weight:800;color:var(--highlight-grey);">
                                ${enq.customerName || 'Customer'}
                            </h3>
                            <div style="font-size:11px;color:var(--muted-text);font-weight:600;">
                                #${enq.id}
                            </div>
                        </div>
                        <span class="status-badge status-${(enq.status || 'new').toLowerCase()}">${enq.status || 'New'}</span>
                    </div>

                    <div class="detail-row">
                        <span class="label"><i class="fas fa-phone"></i> Mobile</span>
                        <span class="value">${enq.mobile || '—'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label"><i class="fas fa-box"></i> Product</span>
                        <span class="value">${enq.product || '—'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label"><i class="fas fa-map-marker-alt"></i> Location</span>
                        <span class="value">${enq.location || '—'}</span>
                    </div>

                    <div class="btn-group" style="margin-top:12px;">
                        <a href="tel:${enq.mobile}" class="btn btn-secondary btn-sm">
                            <i class="fas fa-phone"></i> Call
                        </a>
                        <a href="https://wa.me/91${enq.mobile}" target="_blank" class="btn btn-whatsapp btn-sm">
                            <i class="fab fa-whatsapp"></i> WhatsApp
                        </a>
                        <button class="btn btn-primary btn-sm" style="background:linear-gradient(145deg,#f59e0b,#d97706);" onclick="convertToEstimate('${enq.id}')">
                            <i class="fas fa-file-invoice"></i> Estimate
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.convertToEstimate = function(id) {
            const enq = allEnquiries.find(e => e.id === id);
            if (!enq) return;
            // Store for calculator
            localStorage.setItem('raj_dealer_enquiry_convert', JSON.stringify(enq));
            window.location.href = 'dealer-calculator.html';
        };

        function showToast(msg, type = 'info') {
            document.querySelectorAll('.rm-toast').forEach(t => t.remove());
            const colors = { success: '#10b981', error: '#ef4444', info: '#1a56db' };
            const t = document.createElement('div');
            t.className = 'rm-toast';
            t.textContent = msg;
            t.style.background = colors[type] || colors.info;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>
</body>
 </html>
