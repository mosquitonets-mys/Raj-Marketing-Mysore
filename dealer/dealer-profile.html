<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Dealer Profile - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page-container">

        <div class="page-header">
            <h1><i class="fas fa-user-tie"></i> Dealer Profile</h1>
            <a href="dealer-dashboard.html" class="btn btn-secondary btn-sm">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <!-- Dealer ID Card -->
        <div class="dealer-id-card">
            <div class="id-label">Dealer ID</div>
            <div class="id-value" id="profileDealerId">DLR-000000</div>
            <div class="business-name" id="profileBusiness">Business Name</div>
            <div class="business-meta" id="profileOwner">
                <i class="fas fa-user"></i> Owner Name
            </div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                <span class="tier-badge tier-bronze" id="profileTier">
                    <i class="fas fa-award"></i> Bronze Dealer
                </span>
                <span class="status-badge status-active" id="profileStatus">Active</span>
            </div>
        </div>

        <!-- Business Info -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-building"></i> Business Information
            </div>

            <form id="profileForm" onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label>Owner Name <span class="required">*</span></label>
                    <input type="text" id="pOwnerName" required />
                </div>

                <div class="form-group">
                    <label>Business Name <span class="required">*</span></label>
                    <input type="text" id="pBusinessName" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="pEmail" required />
                    </div>
                    <div class="form-group">
                        <label>Mobile <span class="required">*</span></label>
                        <input type="tel" id="pMobile" required maxlength="10" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input type="tel" id="pWhatsapp" maxlength="10" />
                    </div>
                    <div class="form-group">
                        <label>GSTIN</label>
                        <input type="text" id="pGST" maxlength="15" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Business Address</label>
                    <textarea id="pAddress" rows="2"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="pCity" />
                    </div>
                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" id="pPincode" maxlength="6" />
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="background:linear-gradient(145deg,#f59e0b,#d97706);box-shadow:0 4px 14px rgba(245,158,11,0.3);">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </form>
        </div>

        <!-- Account Actions -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-cog"></i> Account Actions
            </div>

            <a href="dealer-payments.html" class="list-item">
                <div class="icon" style="background:#fef3c7;color:#f59e0b;">
                    <i class="fas fa-credit-card"></i>
                </div>
                <div class="info">
                    <div class="title">Payment Methods</div>
                    <div class="subtitle">Manage payment options</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <a href="dealer-support.html" class="list-item">
                <div class="icon" style="background:#fef3c7;color:#f59e0b;">
                    <i class="fas fa-headset"></i>
                </div>
                <div class="info">
                    <div class="title">Help & Support</div>
                    <div class="subtitle">Get help from our team</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <button class="list-item" onclick="logout()" style="width:100%;border:none;cursor:pointer;text-align:left;font-family:inherit;">
                <div class="icon" style="background:#fee2e2;color:#dc2626;">
                    <i class="fas fa-sign-out-alt"></i>
                </div>
                <div class="info">
                    <div class="title" style="color:#dc2626;">Logout</div>
                    <div class="subtitle">Sign out of dealer portal</div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </button>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

    <script>
    (function() {
        'use strict';

        function init() {
            loadProfile();
        }

        function loadProfile() {
            try {
                const dealer = JSON.parse(localStorage.getItem('raj_dealer') || '{}');
                if (!dealer.id) {
                    window.location.href = 'dealer-login.html';
                    return;
                }

                const dealers = JSON.parse(localStorage.getItem('raj_dealers') || '[]');
                const fullDealer = dealers.find(d => d.id === dealer.id) || dealer;

                document.getElementById('profileDealerId').textContent = fullDealer.dealerId || fullDealer.id || 'DLR-000000';
                document.getElementById('profileBusiness').textContent = fullDealer.businessName || 'Your Business';
                document.getElementById('profileOwner').innerHTML = `<i class="fas fa-user"></i> ${fullDealer.ownerName || 'Owner'}`;
                document.getElementById('profileStatus').textContent = fullDealer.status || 'Active';

                const tier = (fullDealer.tier || 'Bronze').toLowerCase();
                const tierEl = document.getElementById('profileTier');
                tierEl.className = `tier-badge tier-${tier}`;
                tierEl.innerHTML = `<i class="fas fa-award"></i> ${fullDealer.tier || 'Bronze'} Dealer`;

                document.getElementById('pOwnerName').value = fullDealer.ownerName || '';
                document.getElementById('pBusinessName').value = fullDealer.businessName || '';
                document.getElementById('pEmail').value = fullDealer.email || '';
                document.getElementById('pMobile').value = fullDealer.mobile || '';
                document.getElementById('pWhatsapp').value = fullDealer.whatsapp || '';
                document.getElementById('pGST').value = fullDealer.gst || '';
                document.getElementById('pAddress').value = fullDealer.address || '';
                document.getElementById('pCity').value = fullDealer.city || 'Mysore';
                document.getElementById('pPincode').value = fullDealer.pincode || '';
            } catch (e) {
                console.error(e);
            }
        }

        window.saveProfile = function(e) {
            e.preventDefault();
            const ownerName = document.getElementById('pOwnerName').value.trim();
            const businessName = document.getElementById('pBusinessName').value.trim();
            const email = document.getElementById('pEmail').value.trim();
            const mobile = document.getElementById('pMobile').value.trim();

            if (!ownerName || !businessName || !email || !mobile) {
                showToast('Please fill required fields', 'error');
                return;
            }

            try {
                const dealer = JSON.parse(localStorage.getItem('raj_dealer') || '{}');
                const dealers = JSON.parse(localStorage.getItem('raj_dealers') || '[]');
                const idx = dealers.findIndex(d => d.id === dealer.id);

                const updated = {
                    ...(idx >= 0 ? dealers[idx] : dealer),
                    ownerName,
                    businessName,
                    email,
                    mobile,
                    whatsapp: document.getElementById('pWhatsapp').value.trim(),
                    gst: document.getElementById('pGST').value.trim().toUpperCase(),
                    address: document.getElementById('pAddress').value.trim(),
                    city: document.getElementById('pCity').value.trim(),
                    pincode: document.getElementById('pPincode').value.trim(),
                    updatedAt: new Date().toISOString()
                };

                if (idx >= 0) dealers[idx] = updated;
                else dealers.push(updated);

                localStorage.setItem('raj_dealers', JSON.stringify(dealers));
                localStorage.setItem('raj_dealer', JSON.stringify({
                    ...dealer,
                    name: ownerName,
                    businessName,
                    email,
                    mobile
                }));

                document.getElementById('profileBusiness').textContent = businessName;
                document.getElementById('profileOwner').innerHTML = `<i class="fas fa-user"></i> ${ownerName}`;

                showToast('✅ Profile updated successfully!', 'success');
            } catch (err) {
                showToast('Failed to save profile', 'error');
            }
        };

        window.logout = function() {
            if (!confirm('Are you sure you want to logout?')) return;
            localStorage.removeItem('raj_dealer');
            window.location.href = 'dealer-login.html';
        };

        function showToast(msg, type = 'info') {
            document.querySelectorAll('.rm-toast').forEach(t => t.remove());
            const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#1a56db' };
            const t = document.createElement('div');
            t.className = 'rm-toast';
            t.textContent = msg;
            t.style.background = colors[type] || colors.info;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
