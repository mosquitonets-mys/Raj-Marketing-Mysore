<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Book Appointment · Raj Marketing Mysore</title>
  <meta name="description" content="Book a free mosquito net measurement appointment in Mysore. AI assistant available 24/7. Free demo within Mysore, ₹15/km outside." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://rajmarketingmysore.info/appointment.html" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root{
      --rm-blue:#0ea5e9; --rm-blue-dark:#0284c7; --rm-navy:#0f172a;
      --rm-sky:#38bdf8; --rm-green:#22c55e; --rm-green-dark:#16a34a;
      --rm-wa:#25D366; --rm-wa-dark:#128C7E;
      --rm-gold:#fbbf24; --rm-gold-dark:#d97706;
      --rm-ink:#0f172a; --rm-muted:#64748b; --rm-border:#e2e8f0;
      --rm-bg:#f0f4f8; --rm-card:#ffffff; --rm-surface:#f8fafc;
      --rm-radius:24px; --rm-radius-sm:16px;
      --rm-shadow:0 2px 12px rgba(0,0,0,.03);
      --rm-shadow-md:0 4px 20px rgba(0,0,0,.06);
      --rm-shadow-lg:0 8px 32px rgba(14,165,233,.15);
      --rm-transition:.25s cubic-bezier(.4,0,.2,1);
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent;}
    html{scroll-behavior:smooth;}
    body{
      background:var(--rm-bg);min-height:100vh;
      padding:0 16px;padding-top:100px;padding-bottom:100px;
      display:flex;justify-content:center;
      color:var(--rm-ink);line-height:1.5;overflow-x:hidden;
    }
    .app-container{max-width:560px;width:100%;margin:0 auto;}

    /* HEADER */
    .fixed-header{
      position:fixed;top:0;left:0;right:0;z-index:1000;
      max-width:600px;margin:0 auto;width:100%;
      background:linear-gradient(135deg,#0f1b33 0%,#1e3a8a 55%,#2563eb 100%);
      padding:10px 16px;display:flex;justify-content:space-between;align-items:center;
      box-shadow:0 2px 20px rgba(15,27,51,.25);height:76px;
      border-bottom:1px solid rgba(251,191,36,.15);
    }
    .fixed-header .logo-area{display:flex;align-items:center;gap:10px;}
    .fixed-header .back-btn{
      font-size:16px;color:#fff;background:rgba(255,255,255,.12);
      padding:9px 12px;border-radius:50%;cursor:pointer;text-decoration:none;
      transition:var(--rm-transition);display:inline-flex;align-items:center;justify-content:center;
      border:1.5px solid rgba(255,255,255,.18);
    }
    .fixed-header .back-btn:hover{background:rgba(255,255,255,.25);color:var(--rm-gold);}
    .fixed-header .logo-icon{
      width:40px;height:40px;border-radius:11px;overflow:hidden;
      background:#fff;box-shadow:0 4px 14px rgba(251,191,36,.3);
      display:flex;align-items:center;justify-content:center;
      border:1.5px solid rgba(251,191,36,.4);
    }
    .fixed-header .logo-icon img{width:100%;height:100%;object-fit:contain;padding:3px;display:block;}
    .fixed-header .logo-icon i{font-size:20px;color:var(--rm-gold-dark);}
    .fixed-header .logo-text{
      font-weight:900;font-size:17px;color:var(--rm-gold);line-height:1.1;
      letter-spacing:-.3px;
      background:linear-gradient(90deg,#fbbf24,#fcd34d,#f59e0b);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    }
    .fixed-header .logo-text span{
      display:block;font-weight:600;font-size:9px;color:rgba(251,191,36,.7);
      letter-spacing:2.5px;-webkit-text-fill-color:rgba(251,191,36,.7);
    }
    .fixed-header .header-actions{display:flex;gap:6px;align-items:center;}
    .fixed-header .header-btn{
      display:flex;flex-direction:column;align-items:center;padding:4px 6px;
      border-radius:10px;border:none;background:rgba(255,255,255,.1);
      font-size:10px;cursor:pointer;text-decoration:none;min-width:40px;
      transition:var(--rm-transition);
    }
    .fixed-header .header-btn i{font-size:16px;display:block;margin-bottom:1px;color:#4ade80;transition:.2s;}
    .fixed-header .header-btn .label{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:rgba(255,255,255,.8);}
    .fixed-header .header-btn:hover{background:rgba(37,211,102,.25);}
    .mode-switch{display:flex;background:rgba(255,255,255,.12);border-radius:40px;padding:3px;border:1.5px solid rgba(255,255,255,.18);}
    .mode-switch button{
      border:none;background:transparent;padding:6px 14px;border-radius:30px;
      font-weight:700;font-size:11px;color:rgba(255,255,255,.75);cursor:pointer;
      transition:var(--rm-transition);font-family:'Poppins',sans-serif;
    }
    .mode-switch button.active{
      background:linear-gradient(135deg,var(--rm-gold),var(--rm-gold-dark));
      color:#0f1b33;box-shadow:0 2px 12px rgba(251,191,36,.4);
    }

    /* FOOTER NAV */
    .fixed-footer{
      position:fixed;bottom:0;left:0;right:0;z-index:1000;
      max-width:600px;margin:0 auto;width:100%;
      background:#fff;padding:8px 12px 10px;
      display:flex;justify-content:space-around;align-items:center;
      border-radius:28px 28px 0 0;
      box-shadow:0 -4px 24px rgba(15,27,51,.1);
      border-top:1px solid var(--rm-border);
    }
    .fixed-footer .nav-item{
      display:flex;flex-direction:column;align-items:center;
      font-size:9px;color:var(--rm-muted);font-weight:600;gap:2px;
      padding:6px 12px;border-radius:16px;text-decoration:none;
      transition:var(--rm-transition);
    }
    .fixed-footer .nav-item i{font-size:19px;color:#475569;transition:var(--rm-transition);}
    .fixed-footer .nav-item.active{color:var(--rm-blue);background:#f0f9ff;}
    .fixed-footer .nav-item.active i{color:var(--rm-blue);}
    .fixed-footer .nav-item:hover{color:var(--rm-blue);}
    .fixed-footer .nav-item:hover i{color:var(--rm-blue);transform:translateY(-2px);}

    /* PAGE HEADER */
    .page-header{text-align:center;padding:4px 0 12px;}
    .page-header h1{font-weight:900;font-size:26px;color:var(--rm-ink);letter-spacing:-.5px;}
    .page-header h1 i{color:var(--rm-blue);}
    .page-header p{color:var(--rm-muted);font-size:13px;margin-top:2px;}
    .whatsapp-badge{
      background:linear-gradient(135deg,var(--rm-wa),var(--rm-wa-dark));
      color:#fff;padding:7px 20px;border-radius:40px;
      font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;
      margin-top:8px;box-shadow:0 4px 16px rgba(37,211,102,.25);
      animation:waPulse 2.5s infinite;
    }
    @keyframes waPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.35);}70%{box-shadow:0 0 0 12px rgba(37,211,102,0);}100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}}

    /* CARDS */
    .card{
      background:var(--rm-card);border-radius:var(--rm-radius);
      padding:20px 18px;margin:14px 0;
      border:1px solid var(--rm-border);box-shadow:var(--rm-shadow);
      transition:var(--rm-transition);
    }
    .card:hover{border-color:var(--rm-blue);box-shadow:var(--rm-shadow-md);}
    .card-title{
      font-weight:800;font-size:15px;color:var(--rm-ink);
      margin-bottom:14px;display:flex;align-items:center;gap:10px;
    }
    .card-title i{color:var(--rm-blue);font-size:18px;}
    .online-pill{font-size:10px;font-weight:500;color:var(--rm-muted);margin-left:auto;display:inline-flex;align-items:center;gap:4px;}
    .online-dot{width:7px;height:7px;border-radius:50%;background:var(--rm-green);display:inline-block;animation:onlinePulse 1.8s infinite;}
    @keyframes onlinePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.85);}}

    /* CHAT */
    .chat-container{max-height:400px;overflow-y:auto;padding:4px 2px 12px;scroll-behavior:smooth;overscroll-behavior:contain;}
    .chat-container::-webkit-scrollbar{width:4px;}
    .chat-container::-webkit-scrollbar-thumb{background:var(--rm-blue);border-radius:20px;}
    .chat-container::-webkit-scrollbar-track{background:#f1f5f9;border-radius:20px;}
    .chat-bubble{
      max-width:88%;padding:13px 17px;border-radius:18px;
      margin-bottom:12px;font-size:14px;line-height:1.65;
      animation:bubbleIn .35s cubic-bezier(.34,1.56,.64,1);
      position:relative;word-wrap:break-word;
    }
    .chat-bubble.ai{
      background:#fff;color:var(--rm-ink);border-bottom-left-radius:4px;
      box-shadow:0 4px 14px rgba(0,0,0,.08);border:1px solid var(--rm-border);margin-right:auto;
    }
    .chat-bubble.user{
      background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff;margin-left:auto;
      border-bottom-right-radius:4px;box-shadow:0 4px 14px rgba(56,189,248,.25);
    }
    .chat-bubble .time{font-size:9px;opacity:.55;margin-top:6px;display:block;}
    .chat-bubble.user .time{color:rgba(255,255,255,.75);opacity:1;}
    @keyframes bubbleIn{from{opacity:0;transform:translateY(12px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}

    /* TYPING */
    .typing-indicator{
      display:none;padding:10px 16px;background:#fff;border-radius:18px;
      border-bottom-left-radius:4px;max-width:90px;margin-bottom:12px;
      border:1px solid var(--rm-border);box-shadow:0 4px 14px rgba(0,0,0,.06);
      align-items:center;gap:8px;
    }
    .typing-indicator.show{display:inline-flex;animation:bubbleIn .3s ease;}
    .typing-indicator .ai-avatar{
      width:26px;height:26px;background:var(--rm-blue);border-radius:50%;
      display:flex;align-items:center;justify-content:center;color:#fff;
      font-size:13px;animation:avatarBounce 1.2s infinite;
    }
    @keyframes avatarBounce{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
    .typing-indicator .dots span{
      display:inline-block;width:7px;height:7px;border-radius:50%;
      background:#94a3b8;margin:0 2px;animation:typingDot 1.4s infinite;
    }
    .typing-indicator .dots span:nth-child(2){animation-delay:.2s;}
    .typing-indicator .dots span:nth-child(3){animation-delay:.4s;}
    @keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-6px);opacity:1;}}

    /* OPTIONS */
    .chat-options{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px;justify-content:flex-start;}
    .chat-options button{
      background:var(--rm-surface);border:1.5px solid var(--rm-border);
      border-radius:40px;padding:10px 18px;font-size:13px;
      font-weight:600;color:var(--rm-ink);cursor:pointer;
      transition:var(--rm-transition);font-family:'Poppins',sans-serif;text-align:left;
    }
    .chat-options button:hover,.chat-options button:focus-visible{
      background:var(--rm-blue);color:#fff;border-color:var(--rm-blue);
      transform:translateY(-2px);box-shadow:0 4px 16px rgba(14,165,233,.25);outline:none;
    }
    .chat-options button.selected{
      background:var(--rm-blue);color:#fff;border-color:var(--rm-blue);
      box-shadow:0 4px 16px rgba(14,165,233,.3);
    }

    /* INPUT */
    .chat-input{display:flex;gap:10px;margin-top:6px;}
    .chat-input input{
      flex:1;background:var(--rm-surface);border:1.5px solid var(--rm-border);
      border-radius:40px;padding:13px 20px;font-size:14px;outline:none;
      font-family:'Poppins',sans-serif;transition:.2s;color:var(--rm-ink);
    }
    .chat-input input:focus{border-color:var(--rm-blue);box-shadow:0 0 0 4px rgba(14,165,233,.1);}
    .chat-input input::placeholder{color:#94a3b8;}
    .chat-input button{
      background:linear-gradient(145deg,var(--rm-blue),var(--rm-blue-dark));
      border:none;border-radius:50%;width:48px;height:48px;color:#fff;
      font-size:16px;cursor:pointer;transition:.2s;
      box-shadow:0 4px 14px rgba(14,165,233,.3);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .chat-input button:hover{transform:scale(1.06);box-shadow:0 6px 20px rgba(14,165,233,.4);}

    #questionArea{background:var(--rm-surface);border-radius:20px;padding:18px 16px;margin-top:8px;border:1px solid var(--rm-border);}
    #questionText{font-weight:700;color:var(--rm-ink);font-size:14px;margin-bottom:10px;line-height:1.55;}

    /* SUMMARY */
    .summary-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px;gap:12px;}
    .summary-item:last-child{border-bottom:none;}
    .summary-item .label{color:var(--rm-muted);font-weight:500;flex-shrink:0;}
    .summary-item .value{font-weight:700;color:var(--rm-ink);text-align:right;word-break:break-word;}

    /* FORM */
    .form-group{margin-bottom:16px;}
    .form-group label{font-size:12px;font-weight:700;color:#475569;display:block;margin-bottom:6px;letter-spacing:.3px;}
    .form-group label .required{color:#dc2626;}
    .form-group input,.form-group select,.form-group textarea{
      width:100%;background:var(--rm-surface);border:1.5px solid var(--rm-border);
      border-radius:14px;padding:13px 16px;font-size:14px;outline:none;
      font-family:'Poppins',sans-serif;transition:.2s;color:var(--rm-ink);
    }
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{
      border-color:var(--rm-blue);box-shadow:0 0 0 4px rgba(14,165,233,.1);
    }
    .form-group textarea{resize:vertical;min-height:70px;}
    .field-error{color:#dc2626;font-size:11px;margin-top:4px;display:none;font-weight:600;}
    .field-error.show{display:block;}

    /* BUTTONS */
    .btn-primary{
      background:linear-gradient(145deg,var(--rm-blue),var(--rm-blue-dark));
      color:#fff;border:none;padding:16px 28px;border-radius:50px;
      font-weight:800;font-size:15px;width:100%;cursor:pointer;
      box-shadow:0 4px 16px rgba(14,165,233,.3);transition:var(--rm-transition);
      font-family:'Poppins',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-primary:hover{box-shadow:0 6px 28px rgba(14,165,233,.4);transform:translateY(-2px);}
    .btn-secondary{
      background:var(--rm-surface);color:var(--rm-ink);border:1.5px solid var(--rm-border);
      padding:12px 20px;border-radius:50px;font-weight:700;font-size:14px;
      cursor:pointer;text-align:center;transition:var(--rm-transition);
      font-family:'Poppins',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    }
    .btn-secondary:hover{background:var(--rm-border);}
    .btn-wa{
      background:linear-gradient(145deg,var(--rm-wa),var(--rm-wa-dark));
      color:#fff;border:none;padding:14px 28px;border-radius:50px;
      font-weight:700;font-size:14px;cursor:pointer;
      box-shadow:0 4px 16px rgba(37,211,102,.25);transition:var(--rm-transition);
      text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
      font-family:'Poppins',sans-serif;
    }
    .btn-wa:hover{box-shadow:0 6px 28px rgba(37,211,102,.4);transform:translateY(-2px);}
    .flex{display:flex;gap:10px;}
    .flex > *{flex:1;}

    /* SUCCESS */
    .hidden{display:none !important;}
    .success-card{text-align:center;padding:30px 20px;}
    .success-card .icon-circle{
      width:80px;height:80px;background:linear-gradient(145deg,var(--rm-green),var(--rm-green-dark));
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      margin:0 auto 16px;font-size:36px;color:#fff;
      box-shadow:0 8px 32px rgba(34,197,94,.35);
      animation:successPop .5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes successPop{0%{transform:scale(0);}100%{transform:scale(1);}}
    .success-card h2{font-size:22px;color:var(--rm-ink);font-weight:900;}
    .success-card p{color:var(--rm-muted);margin:8px 0 16px;font-size:14px;}
    .success-details{
      background:var(--rm-surface);border-radius:16px;padding:16px;margin:12px 0;
      text-align:left;border:1px solid var(--rm-border);
    }
    .success-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;}
    .success-actions > *{flex:1;min-width:80px;}

    /* LOCATION */
    .location-card{border-color:#fef3c7 !important;background:#fffbeb !important;}
    .location-card .loc-row{display:flex;align-items:center;gap:12px;}
    .location-card .loc-icon{font-size:28px;color:#d97706;flex-shrink:0;}
    .location-card .loc-text{flex:1;font-size:12px;color:#475569;line-height:1.6;}
    .location-card strong{color:var(--rm-ink);}

    /* WA CARD */
    .wa-card{background:linear-gradient(135deg,#f0faf0,#e6f5e6);border-color:var(--rm-wa) !important;}
    .wa-card .wa-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .wa-card .wa-icon{font-size:34px;color:var(--rm-wa);flex-shrink:0;}

    /* RESPONSIVE */
    @media (max-width:420px){
      body{padding:0 10px;padding-top:88px;padding-bottom:86px;}
      .fixed-header{height:68px;padding:8px 12px;}
      .fixed-header .logo-text{font-size:15px;}
      .fixed-header .logo-icon{width:36px;height:36px;}
      .fixed-header .back-btn{padding:7px 10px;font-size:14px;}
      .mode-switch button{font-size:10px;padding:5px 11px;}
      .page-header h1{font-size:22px;}
      .chat-options button{font-size:12px;padding:9px 15px;}
      .chat-bubble{font-size:13px;padding:12px 14px;max-width:92%;}
      .card{padding:16px 14px;}
      .whatsapp-badge{font-size:11px;padding:5px 16px;}
      .flex{flex-direction:column;}
      .fixed-footer .nav-item{font-size:7px;padding:4px 8px;}
      .fixed-footer .nav-item i{font-size:17px;}
      .summary-item{font-size:12px;}
    }

    /* A11Y */
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    }
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
    :focus-visible{outline:3px solid var(--rm-blue);outline-offset:2px;border-radius:4px;}
  </style>
</head>

    <!-- AI MODE -->
    <div id="aiMode" role="tabpanel" ari
