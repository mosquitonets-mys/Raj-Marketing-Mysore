<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Admin CRM - Raj Marketing Mysore</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        body { background: #f0f4f8; padding-bottom: 20px; }
        .admin-header {
            background: linear-gradient(135deg, #0f1b33, #1a56db);
            padding: 16px;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(15, 27, 51, 0.2);
        }
        .admin-header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-brand { display: flex; align-items: center; gap: 10px; }
        .admin-brand .logo {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .admin-brand h1 { font-size: 16px; font-weight: 900; }
        .admin-brand p { font-size: 10px; opacity: 0.75; }
        .admin-header-actions { display: flex; gap: 8px; }
        .admin-header-btn {
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
            transition: var(--transition);
        }
        .admin-header-btn:hover { background: rgba(255,255,255,0.25); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
        .page-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--highlight-grey);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }
        .page-title i { color: var(--royal-blue); }

        .tabs-nav {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 2px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .tabs-nav::-webkit-scrollbar { display: none; }
        .tab-btn {
            padding: 10px 18px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted-text);
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            position: relative;
            white-space: nowrap;
            border-radius: 8px 8px 0 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn:hover { color: var(--royal-blue); background: var(--light-blue); }
        .tab-btn.active { color: var(--royal-blue); }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--royal-blue);
            border-radius: 3px 3px 0 0;
        }
        .tab-btn .count-badge {
            background: var(--light-blue);
            color: var(--royal-blue);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 800;
        }
        .tab-btn.active .count-badge {
            background: var(--royal-blue);
            color: #fff;
        }

        /* Cards */
        .crm-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            transition: var(--transition);
        }
        .crm-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--royal-blue);
        }
        .crm-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .crm-card-header h3 {
            font-size: 15px;
            font-weight: 800;
            color: var(--highlight-grey);
            margin-bottom: 2px;
        }
        .crm-card-header .sub {
            font-size: 11px;
            color: var(--muted-text);
            font-weight: 600;
        }
        .crm-card .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 12px;
            border-bottom: 1px solid var(--border-light);
            gap: 8px;
        }
        .crm-card .detail-row:last-child { border-bottom: none; }
        .crm-card .detail-row .label { color: var(--muted-text); font-weight: 600; }
        .crm-card .detail-row .value { color: var(--highlight-grey); font-weight: 700; text-align: right; }
        .crm-card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
        }
        .crm-card-actions .btn {
            padding: 8px 14px;
            font-size: 11px;
            border-radius: 30px;
            flex: 1;
            min-width: 100px;
        }
        .btn-approve {
            background: #d1fae5;
            color: #059669;
            border: 1.5px solid #10b981;
        }
        .btn-approve:hover { background: #10b981; color: #fff; }
        .btn-reject {
            background: #fee2e2;
            color: #dc2626;
            border: 1.5px solid #ef4444;
        }
        .btn-reject:hover { background: #ef4444; color: #fff; }

        /* Search */
        .search-bar {
            background: var(--white);
            border-radius: 50px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1.5px solid var(--border);
            margin-bottom: 16px;
            transition: var(--transition);
        }
        .search-bar:focus-within {
            border-color: var(--royal-blue);
            box-shadow: 0 0 0 4px rgba(26, 86, 219, 0.08);
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            color: var(--highlight-grey);
        }
        .search-bar input::placeholder { color: var(--muted-text); }
        .search-bar i { color: var(--muted-text); font-size: 16px; }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border);
        }
        .empty-state i {
            font-size: 48px;
            color: var(--border);
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            font-size: 16px;
            font-weight: 800;
            color: var(--highlight-grey);
            margin-bottom: 6px;
        }
        .empty-state p { font-size: 13px; color: var(--muted-text); }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="admin-header-inner">
            <div class="admin-brand">
                <div class="logo"><i class="fas fa-users"></i></div>
                <div>
                    <h1>Admin CRM</h1>
                    <p>Customer &amp; Dealer Management</p>
                </div>
            </div>
            <div class="admin-header-actions">
                <a href="dashboard.html" class="admin-header-btn" title="Dashboard">
                    <i class="fas fa-home"></i>
                </a>
                <button class="admin-header-btn" onclick="AdminAuth.logout()" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container">

        <h1 class="page-title">
            <i class="fas fa-users-cog"></i> Customer &amp; Dealer Management
        </h1>

        <!-- Tabs -->
        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="pending" onclick="setTab('pending')">
                <i class="fas fa-clock"></i> Pending <span class="count-badge" id="countPending">0</span>
            </button>
            <button class="tab-btn" data-tab="customers" onclick="setTab('customers')">
                <i class="fas fa-user-friends"></i> Customers <span class="count-badge" id="countCustomers">0</span>
            </button>
            <button class="tab-btn" data-tab="dealers" onclick="setTab('dealers')">
                <i class="fas fa-handshake"></i> Dealers <span class="count-badge" id="countDealers">0</span>
            </button>
            <button class="tab-btn" data-tab="rejected" onclick="setTab('rejected')">
                <i class="fas fa-ban"></i> Rejected <span class="count-badge" id="countRejected">0</span>
            </button>
        </div>

        <!-- Search -->
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search by name, email, mobile..." oninput="render()" />
        </div>

        <!-- Content -->
        <div id="crmContent"></div>

    </div>

    <script src="js/admin-auth.js"></script>
    <script src="js/admin-notifications.js"></script>

    <script>
    (function() {
        'use strict';

        let currentTab = 'pending';

        function init() {
            if (!AdminAuth.requireLogin()) return;

            // Read tab from URL
            const params = new URLSearchParams(window.location.search);
            if (params.get('tab')) currentTab = params.get('tab');

            updateCounts();
            render();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            render();
        }
        window.setTab = setTab;

        // ============================================================
        // GET DATA
        // ============================================================
        function getCustomers() {
            try { return JSON.parse(localStorage.getItem('raj_customers') || '[]'); }
            catch { return []; }
        }

        function getDealers() {
            try { return JSON.parse(localStorage.getItem('raj_dealers') || '[]'); }
            catch { return []; }
        }

        // ============================================================
        // UPDATE COUNTS
        // ============================================================
        function updateCounts() {
            const customers = getCustomers();
            const dealers = getDealers();

            const pendingC = customers.filter(c => !c.status || c.status === 'Pending').length;
            const pendingD = dealers.filter(d => !d.status || d.status === 'Pending').length;

            const rejectedC = customers.filter(c => c.status === 'Rejected').length;
            const rejectedD = dealers.filter(d => d.status === 'Rejected').length;

            document.getElementById('countPending').textContent = pendingC + pendingD;
            document.getElementById('countCustomers').textContent = customers.length;
            document.getElementById('countDealers').textContent = dealers.length;
            document.getElementById('countRejected').textContent = rejectedC + rejectedD;
        }

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            const container = document.getElementById('crmContent');
            const q = document.getElementById('searchInput').value.toLowerCase().trim();

            let list = [];
            let type = '';

            if (currentTab === 'pending') {
                const customers = getCustomers().filter(c => !c.status || c.status === 'Pending')
                    .map(c => ({ ...c, _type: 'customer' }));
                const dealers = getDealers().filter(d => !d.status || d.status === 'Pending')
                    .map(d => ({ ...d, _type: 'dealer' }));
                list = [...customers, ...dealers];
            } else if (currentTab === 'customers') {
                list = getCustomers().map(c => ({ ...c, _type: 'customer' }));
            } else if (currentTab === 'dealers') {
                list = getDealers().map(d => ({ ...d, _type: 'dealer' }));
            } else if (currentTab === 'rejected') {
                const customers = getCustomers().filter(c => c.status === 'Rejected')
                    .map(c => ({ ...c, _type: 'customer' }));
                const dealers = getDealers().filter(d => d.status === 'Rejected')
                    .map(d => ({ ...d, _type: 'dealer' }));
                list = [...customers, ...dealers];
            }

            // Search filter
            if (q) {
                list = list.filter(item => {
                    const name = item.name || item.ownerName || '';
                    const business = item.businessName || '';
                    const email = item.email || '';
                    const mobile = item.mobile || '';
                    return name.toLowerCase().includes(q) ||
                           business.toLowerCase().includes(q) ||
                           email.toLowerCase().includes(q) ||
                           mobile.includes(q);
                });
            }

            if (!list.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No ${currentTab} records</h3>
                        <p>Nothing to show here</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(item => renderCard(item)).join('');
        }

        function renderCard(item) {
            const isDealer = item._type === 'dealer';
            const name = isDealer ? (item.ownerName || item.name || 'Dealer') : (item.name || 'Customer');
            const business = isDealer ? (item.businessName || '') : '';
            const email = item.email || '—';
            const mobile = item.mobile || '—';
            const city = item.city || '—';
            const status = item.status || 'Pending';

            const registeredDate = item.registeredAt ?
                new Date(item.registeredAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) :
                '—';

            const typeBadge = isDealer
                ? `<span style="background:#fef3c7;color:#b45309;padding:3px 10px;border-radius:20px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.5px;"><i class="fas fa-handshake"></i> Dealer</span>`
                : `<span style="background:#dbeafe;color:#1d4ed8;padding:3px 10px;border-radius:20px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.5px;"><i class="fas fa-user"></i> Customer</span>`;

            const statusBadge = `
                <span class="status-badge status-${status.toLowerCase()}">${status}</span>
            `;

            // Actions
            let actionsHtml = '';
            if (status === 'Pending' || !item.status) {
                actionsHtml = `
                    <button class="btn btn-approve" onclick="approveRecord('${item._type}', '${item.id}')">
                        <i class="fas fa-check"></i> Approve
                    </button>
                    <button class="btn btn-reject" onclick="rejectRecord('${item._type}', '${item.id}')">
                        <i class="fas fa-times"></i> Reject
                    </button>
                `;
            } else {
                actionsHtml = `
                    <button class="btn btn-secondary" onclick="viewDetails('${item._type}', '${item.id}')">
                        <i class="fas fa-eye"></i> View
                    </button>
                    <a href="tel:${mobile}" class="btn btn-secondary">
                        <i class="fas fa-phone"></i> Call
                    </a>
                    <a href="https://wa.me/91${mobile.replace(/\D/g, '')}" target="_blank" class="btn btn-whatsapp" style="background:#25D366;color:#fff;">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </a>
                `;
            }

            return `
                <div class="crm-card">
                    <div class="crm-card-header">
                        <div>
                            <h3>${name}</h3>
                            ${business ? `<div class="sub">${business}</div>` : ''}
                            <div style="margin-top:6px;">${typeBadge}</div>
                        </div>
                        ${statusBadge}
                    </div>

                    <div class="detail-row">
                        <span class="label"><i class="fas fa-envelope"></i> Email</span>
                        <span class="value">${email}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label"><i class="fas fa-phone"></i> Mobile</span>
                        <span class="value">${mobile}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label"><i class="fas fa-map-marker-alt"></i> City</span>
                        <span class="value">${city}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label"><i class="fas fa-calendar"></i> Registered</span>
                        <span class="value">${registeredDate}</span>
                    </div>

                    <div class="crm-card-actions">
                        ${actionsHtml}
                    </div>
                </div>
            `;
        }

        // ============================================================
        // APPROVE / REJECT
        // ============================================================
        window.approveRecord = function(type, id) {
            if (!confirm(`Approve this ${type}?`)) return;

            try {
                const key = type === 'dealer' ? 'raj_dealers' : 'raj_customers';
                const list = JSON.parse(localStorage.getItem(key) || '[]');
                const idx = list.findIndex(x => x.id === id);

                if (idx < 0) {
                    showToast('Record not found', 'error');
                    return;
                }

                list[idx].status = 'Approved';
                list[idx].approvedAt = new Date().toISOString();
                localStorage.setItem(key, JSON.stringify(list));

                // Notify
                if (type === 'dealer') {
                    AdminNotifications.notifyDealerApproved(list[idx]);
                } else {
                    AdminNotifications.add('SYSTEM',
                        'Customer Approved',
                        `${list[idx].name} has been approved.`,
                        { customerId: id }
                    );
                }

                showToast(`✅ ${type} approved!`, 'success');
                updateCounts();
                render();
            } catch (e) {
                showToast('Failed to approve', 'error');
            }
        };

        window.rejectRecord = function(type, id) {
            const reason = prompt(`Reason for rejecting this ${type}?`);
            if (reason === null) return;

            try {
                const key = type === 'dealer' ? 'raj_dealers' : 'raj_customers';
                const list = JSON.parse(localStorage.getItem(key) || '[]');
                const idx = list.findIndex(x => x.id === id);

                if (idx < 0) {
                    showToast('Record not found', 'error');
                    return;
                }

                list[idx].status = 'Rejected';
                list[idx].rejectedAt = new Date().toISOString();
                list[idx].rejectReason = reason || 'Not specified';
                localStorage.setItem(key, JSON.stringify(list));

                if (type === 'dealer') {
                    AdminNotifications.notifyDealerRejected(list[idx], reason);
                } else {
                    AdminNotifications.add('SYSTEM',
                        'Customer Rejected',
                        `${list[idx].name} was rejected. ${reason || ''}`,
                        { customerId: id }
                    );
                }

                showToast(`❌ ${type} rejected`, 'warning');
                updateCounts();
                render();
            } catch (e) {
                showToast('Failed to reject', 'error');
            }
        };

        window.viewDetails = function(type, id) {
            const key = type === 'dealer' ? 'raj_dealers' : 'raj_customers';
            const list = JSON.parse(localStorage.getItem(key) || '[]');
            const item = list.find(x => x.id === id);
            if (!item) return;
            alert(JSON.stringify(item, null, 2));
        };

        function showToast(msg, type = 'info') {
            document.querySelectorAll('.rm-toast').forEach(t => t.remove());
            const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#1a56db' };
            const t = document.createElement('div');
            t.className = 'rm-toast';
            t.textContent = msg;
            t.style.background = colors[type] || colors.info;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
