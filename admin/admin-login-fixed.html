<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - Raj Marketing Mysore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f1b33,#1a56db);font-family:Poppins,sans-serif}
    .card{width:100%;max-width:440px;background:#fff;border-radius:20px;padding:34px 28px;box-shadow:0 20px 60px #0004}
    .badge{display:table;margin:0 auto 18px;padding:6px 14px;border-radius:30px;background:#fee2e2;color:#b91c1c;font-size:11px;font-weight:800}
    h1{text-align:center;margin:0;color:#1f2937;font-size:27px}
    .sub{text-align:center;color:#64748b;font-size:13px;margin:7px 0 26px}
    label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px;color:#334155}
    input{width:100%;padding:13px 14px;border:1.5px solid #cbd5e1;border-radius:11px;font:inherit;font-size:14px}
    input:focus{outline:2px solid #93c5fd;border-color:#2563eb}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:30px;background:linear-gradient(145deg,#1a56db,#0f1b33);color:white;font:700 14px Poppins;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #message{display:none;margin-top:16px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}
    #message.error{display:block;background:#fee2e2;color:#991b1b}
    #message.success{display:block;background:#dcfce7;color:#166534}
    .note{text-align:center;color:#64748b;font-size:11px;margin-top:20px}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">ADMIN ACCESS ONLY</div>
    <h1>Admin Login</h1>
    <p class="sub">Raj Marketing Mysore · Secure Portal</p>

    <form id="adminLoginForm">
      <label for="adminEmail">Admin email</label>
      <input id="adminEmail" type="email" value="rajmarketingmys@gmail.com" autocomplete="username" required>
      <label for="adminPassword">Firebase password</label>
      <input id="adminPassword" type="password" autocomplete="current-password" required>
      <button id="submitBtn" type="submit">Secure Login</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
    <div class="note">Protected by Firebase Authentication and admin authorization.</div>
  </main>

  <script type="module">
    import { auth } from '../firebase-config.js';
    import { AdminAuth } from '../js/firebase-auth.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';

    const form = document.getElementById('adminLoginForm');
    const button = document.getElementById('submitBtn');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const allowed = await AdminAuth.checkSession();
      if (allowed) window.location.replace('dashboard.html');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Verifying...';
      message.className = '';
      message.textContent = '';

      try {
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;
        const result = await AdminAuth.login(email, password);

        if (!result.success) {
          showMessage(result.error || 'Login failed. Please try again.', 'error');
          document.getElementById('adminPassword').value = '';
          return;
        }

        showMessage('Login successful. Opening admin dashboard...', 'success');
        window.location.replace('dashboard.html');
      } catch (error) {
        console.error('Admin login page error:', error);
        showMessage(error.message || 'Unexpected login error. Check the browser console.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Secure Login';
      }
    });
  </script>
</body>
</html>
