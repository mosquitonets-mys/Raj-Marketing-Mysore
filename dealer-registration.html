<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Raj Marketing · Dealer Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            padding-top: 40px;
            padding-bottom: 40px;
        }
        .register-container {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            padding: 40px 30px;
            border: 1px solid #e8ecf0;
        }
        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .register-header .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #f97316, #ea580c);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            box-shadow: 0 4px 16px rgba(249, 115, 22, 0.25);
        }
        .register-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #1a1a2e;
            margin-top: 12px;
        }
        .register-header p {
            font-size: 13px;
            color: #6b6b7b;
            margin-top: 4px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #4a4a5a;
            display: block;
            margin-bottom: 4px;
        }
        .form-group label .required {
            color: #dc2626;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e8ecf0;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            background: #f8fafc;
            transition: 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.08);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-group small {
            font-size: 10px;
            color: #6b6b7b;
            display: block;
            margin-top: 2px;
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #f97316, #ea580c);
            color: #fff;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 16px rgba(249, 115, 22, 0.25);
            margin-top: 10px;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(249, 115, 22, 0.35);
        }
        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #6b6b7b;
        }
        .login-footer a {
            color: #f97316;
            text-decoration: none;
            font-weight: 600;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            border-left: 4px solid #dc2626;
        }
        .error-msg.show {
            display: block;
        }
        .success-msg {
            background: #d1fae5;
            color: #065f46;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            border-left: 4px solid #22c55e;
        }
        .success-msg.show {
            display: block;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 500px) {
            .register-container { padding: 30px 18px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <div class="logo-icon"><i class="fas fa-handshake"></i></div>
            <h1>Become a Raj Marketing Dealer</h1>
            <p>Join our dealer network and grow your business</p>
        </div>

        <div id="errorBox" class="error-msg"></div>
        <div id="successBox" class="success-msg"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required />
                </div>
                <div class="form-group">
                    <label>Business Name <span class="required">*</span></label>
                    <input type="text" id="businessName" placeholder="Your business name" required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Mobile Number <span class="required">*</span></label>
                    <input type="tel" id="mobile" placeholder="9483037385" required />
                </div>
                <div class="form-group">
                    <label>WhatsApp Number</label>
                    <input type="tel" id="whatsapp" placeholder="Same as mobile" />
                </div>
            </div>

            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" placeholder="your@email.com" required />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Business Type <span class="required">*</span></label>
                    <select id="businessType" required>
                        <option value="">Select...</option>
                        <option value="Aluminium Fabricator">Aluminium Fabricator</option>
                        <option value="Interior Designer">Interior Designer</option>
                        <option value="Hardware Dealer">Hardware Dealer</option>
                        <option value="Window & Door Dealer">Window & Door Dealer</option>
                        <option value="Contractor">Contractor</option>
                        <option value="Architect">Architect</option>
                        <option value="Home Improvement Business">Home Improvement Business</option>
                        <option value="Existing Mosquito Net Dealer">Existing Mosquito Net Dealer</option>
                        <option value="New Entrepreneur">New Entrepreneur</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" placeholder="Your city" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>District</label>
                    <input type="text" id="district" placeholder="Your district" />
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="state" value="Karnataka" />
                </div>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea id="address" rows="2" placeholder="Street, area, landmark"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>GST Number</label>
                    <input type="text" id="gst" placeholder="GSTIN (optional)" />
                </div>
                <div class="form-group">
                    <label>PIN Code</label>
                    <input type="text" id="pin" placeholder="570001" />
                </div>
            </div>

            <div class="form-group">
                <label>Products Interested</label>
                <select id="products" multiple style="height:80px;">
                    <option value="Velcro">Velcro System</option>
                    <option value="Aluminium">Aluminium Frame</option>
                    <option value="Pleated">Pleated Net</option>
                    <option value="Openable">Openable System</option>
                    <option value="Sliding">Double Sliding SS Mesh</option>
                </select>
                <small>Hold Ctrl/Cmd to select multiple</small>
            </div>

            <div class="form-group">
                <label>Monthly Requirement (₹)</label>
                <input type="text" id="monthly" placeholder="e.g. 100000" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" />
                </div>
                <div class="form-group">
                    <label>Confirm Password <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password" required />
                </div>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
                <i class="fas fa-paper-plane"></i> Submit Application
            </button>
        </form>

        <div class="login-footer">
            <p>Already registered? <a href="dealer-login.html">Login Here</a></p>
            <p style="margin-top:6px; font-size:12px; color:#8a8a9a;">
                <a href="index.html"><i class="fas fa-home"></i> Back to Home</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const form = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');

        async function handleRegister(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const businessName = document.getElementById('businessName').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const email = document.getElementById('email').value.trim();
            const businessType = document.getElementById('businessType').value;
            const city = document.getElementById('city').value.trim();
            const district = document.getElementById('district').value.trim();
            const state = document.getElementById('state').value.trim();
            const address = document.getElementById('address').value.trim();
            const gst = document.getElementById('gst').value.trim();
            const pin = document.getElementById('pin').value.trim();
            const monthly = document.getElementById('monthly').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            errorBox.classList.remove('show');
            successBox.classList.remove('show');

            if (!fullName || !businessName || !mobile || !email || !businessType || !password) {
                showError('Please fill in all required fields.');
                return;
            }

            if (mobile.length < 10) {
                showError('Please enter a valid 10-digit mobile number.');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            // Get selected products
            const productsSelect = document.getElementById('products');
            const productsInterested = [];
            for (let opt of productsSelect.options) {
                if (opt.selected) productsInterested.push(opt.value);
            }

            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="loading-spinner"></span> Submitting...';

            try {
                // Create Firebase Auth user
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // Save dealer data to Firestore
                const dealerId = 'DLR-' + Date.now().toString().slice(-8);
                await setDoc(doc(db, 'dealers', dealerId), {
                    dealerId: dealerId,
                    uid: uid,
                    ownerName: fullName,
                    businessName: businessName,
                    mobile: mobile,
                    whatsapp: whatsapp || mobile,
                    email: email,
                    businessType: businessType,
                    city: city,
                    district: district,
                    state: state || 'Karnataka',
                    address: address,
                    gstNumber: gst,
                    pin: pin,
                    monthlyRequirement: monthly,
                    productsInterested: productsInterested,
                    status: 'Pending',
                    dealerType: 'New',
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });

                // Show success
                successBox.textContent = '✅ Registration successful! Your application is under review.';
                successBox.classList.add('show');
                form.reset();

                setTimeout(() => {
                    window.location.href = 'dealer-login.html';
                }, 3000);

            } catch (error) {
                console.error('❌ Registration error:', error);
                let msg = 'Registration failed. Please try again.';
                if (error.code === 'auth/email-already-in-use') {
                    msg = 'This email is already registered. Please use a different email or login.';
                } else if (error.code === 'auth/weak-password') {
                    msg = 'Password is too weak. Please use at least 6 characters.';
                } else if (error.code === 'auth/invalid-email') {
                    msg = 'Please enter a valid email address.';
                }
                showError(msg);
            } finally {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Application';
            }
        }

        function showError(msg) {
            errorBox.textContent = '❌ ' + msg;
            errorBox.classList.add('show');
        }

        window.handleRegister = handleRegister;
    </script>

</body>
</html>
